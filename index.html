<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Растаможка · Калькулятор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d12;
  --panel:#0f1720;
  --panel-2:#141f2a;
  --border:#213040;
  --text:#e6edf1;
  --muted:#75919e;
  --accent:#2f7dd1;
  --accent-soft:#2f7dd122;
  --teal:#37b07c;
  --teal-soft:#37b07c22;
  --danger:#d1573f;
  --danger-soft:#d1573f22;
  --good:#37b07c;
  --radius:14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tg-top-pad: 0px; /* доп. место под кнопки закрыть/свернуть/⋯ в Telegram Mini App, см. bootGate() */
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding-bottom:calc(64px + var(--safe-bottom));
  position:relative;
}
.mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.serif{font-family:'Fraunces',serif;}

.topbar{
  padding:calc(14px + var(--safe-top) + var(--tg-top-pad)) 16px 10px;
  position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg, var(--bg) 70%, transparent);
}
.topbar h1{
  font-family:'Fraunces',serif; font-weight:600; font-size:21px; margin:0 0 2px; letter-spacing:0.2px;
}
.topbar .sub{color:var(--muted); font-size:12.5px;}

.tabs{ display:flex; gap:6px; padding:6px 16px 14px; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto; padding:9px 14px; border-radius:10px; background:transparent; border:1px solid var(--border);
  color:var(--muted); font-size:13.5px; font-weight:500; cursor:pointer;
}
.tab.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--text); }

.content{flex:1; padding:0 16px 24px;}

.card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
.card h2{ font-size:12px; color:var(--muted); margin:0 0 12px; font-weight:600; letter-spacing:0.2px; }
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; }
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
input[type=text], input[type=number], select, textarea{
  width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:9px;
  padding:10px 11px; font-size:14.5px; font-family:'IBM Plex Mono',monospace; outline:none;
}
select{font-family:'Inter',sans-serif;}
textarea{font-family:'Inter',sans-serif; resize:vertical;}
input:focus, select:focus, textarea:focus{border-color:var(--accent);}

.seg{ display:flex; background:var(--panel-2); border-radius:9px; padding:3px; border:1px solid var(--border); }
.seg button{ flex:1; background:transparent; border:none; color:var(--muted); padding:8px 4px; border-radius:7px; font-size:12.5px; cursor:pointer; font-family:'Inter',sans-serif; }
.seg button.active{background:var(--accent); color:#08131c; font-weight:600;}

.toggle-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.switch{ width:40px; height:24px; border-radius:99px; background:var(--panel-2); border:1px solid var(--border); position:relative; cursor:pointer; flex:0 0 auto; }
.switch .knob{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--muted); transition:left .15s; }
.switch.on{background:var(--teal-soft); border-color:var(--teal);}
.switch.on .knob{left:18px; background:var(--teal);}

.btn{ width:100%; background:var(--accent); color:#08131c; border:none; border-radius:11px; padding:13px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; }
.btn.secondary{ background:transparent; border:1px solid var(--border); color:var(--text); }
.btn.small{padding:9px; font-size:12.5px;}
.row3 .btn{ padding:11px 4px; font-size:12.5px; }
.btn.share-merged{ display:flex; padding:0; overflow:hidden; }
.share-merged span{ flex:1; padding:13px 4px; font-size:13.5px; font-weight:600; color:#fff; }
.share-merged .seg-wa{ background:#25D366; }
.share-merged .seg-tg{ background:#2AABEE; }
.share-merged .seg-max{ background:#9B7FE0; }
.linkbtn{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--teal-soft); border:1px solid var(--teal); color:var(--teal);
  border-radius:9px; padding:11px 12px; font-size:13px; font-weight:600; cursor:pointer; text-decoration:none;
  margin-bottom:8px;
}
.linkbtn:last-child{margin-bottom:0;}
.linkbtn small{display:block; font-weight:400; color:var(--teal); opacity:0.8; font-size:11px; margin-top:1px;}

.smartfill{ background:var(--panel-2); border:1px dashed var(--border); border-radius:12px; padding:12px; }
.smartfill textarea{ margin-bottom:10px; }
.smartfill .btn{ margin-bottom:6px; }
.smartfill .row2 .btn{ margin-bottom:0; }
.smartfill-status{ font-size:11px; color:var(--muted); min-height:14px; }
.smartfill-divider{ display:flex; align-items:center; gap:8px; margin:12px 0 10px; color:var(--muted); font-size:11px; }
.smartfill-divider::before, .smartfill-divider::after{ content:''; flex:1; height:1px; background:var(--border); }
.filepick{
  display:flex; align-items:center; justify-content:center; text-align:center;
  background:var(--panel); border:1px solid var(--border); border-radius:11px;
  padding:13px 8px; font-size:12.5px; color:var(--muted); cursor:pointer; font-family:'Inter',sans-serif;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.filepick.has-file{ color:var(--text); border-color:var(--accent); }
.smartfill-hint{ font-size:10.5px; color:var(--muted); margin-top:10px; line-height:1.4; }

.receipt{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; }
.receipt-head{ padding:16px 16px 12px; border-bottom:1px dashed var(--border); }
.receipt-head .model{font-family:'Fraunces',serif; font-size:17px; font-weight:600;}
.receipt-head .meta{color:var(--muted); font-size:12px; margin-top:3px;}
.receipt-body{padding:6px 16px;}
.rline{ display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--panel-2); font-size:13.5px; }
.rline:last-child{border-bottom:none;}
.rline .k{color:var(--muted);}
.rline .k .hint{display:block; font-size:10.5px; color:#5c6b69; margin-top:1px;}
.rline .v{font-family:'IBM Plex Mono',monospace; font-weight:500;}
.receipt-total{ padding:16px; background:var(--panel-2); display:flex; justify-content:space-between; align-items:center; border-top:1px dashed var(--border); }
.receipt-total .lbl{font-size:13px; color:var(--muted);}
.receipt-total .amt{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--good);}

.bottomnav{ position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(8,13,18,0.92); backdrop-filter:blur(10px); border-top:1px solid var(--border); padding-bottom:var(--safe-bottom); }
.bottomnav .inner{ max-width:480px; margin:0 auto; display:flex; }
.navbtn{ flex:1; background:none; border:none; color:var(--muted); padding:11px 4px 9px; font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; font-family:'Inter',sans-serif; }
.navbtn.active{color:var(--accent);}
.navicon{width:20px; height:20px; display:block;}

.sheet-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:40; display:none; align-items:flex-end; justify-content:center; }
.sheet-overlay.open{display:flex;}
.sheet{ background:var(--bg); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; border:1px solid var(--border); border-bottom:none; padding:10px 16px calc(24px + var(--safe-bottom)); }
.sheet-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:6px auto 14px;}
.sheet h3{font-family:'Fraunces',serif; font-size:17px; margin:4px 0 14px;}
.sub-h{font-size:11.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); margin:18px 0 8px;}
.sub-h:first-child{margin-top:2px;}

.tablecfg{width:100%; border-collapse:collapse; font-size:11.5px;}
.tablecfg th{text-align:left; color:var(--muted); font-weight:500; font-size:10px; padding:4px 3px;}
.tablecfg td{padding:3px 3px;}
.tablecfg input{padding:6px 6px; font-size:11.5px;}
.tablecfg td.name{font-size:11.5px; padding-right:6px; white-space:nowrap;}

.emptystate{ text-align:center; padding:50px 20px; color:var(--muted); }
.emptystate .big{font-family:'Fraunces',serif; font-size:16px; color:var(--text); margin-bottom:6px;}

.histcard{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:13px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
.histcard .l .m{font-weight:600; font-size:14px;}
.histcard .l .d{color:var(--muted); font-size:11.5px; margin-top:2px;}
.histcard .r{text-align:right;}
.histcard .r .t{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--accent);}
.histcard .r .c{font-size:10.5px; color:var(--muted);}

.settings-menu{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:14px; }
.settings-row{ display:flex; justify-content:space-between; align-items:center; padding:15px 16px; cursor:pointer; border-bottom:1px solid var(--panel-2); }
.settings-row:last-child{border-bottom:none;}
.settings-row .lbl{font-size:14px; font-weight:500;}
.settings-row .arrow{color:var(--muted); font-size:17px;}

.toast{ position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:9px; font-size:13px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s; }
.toast.show{opacity:1;}

.notice{ background:var(--danger-soft); border:1px solid var(--danger); color:var(--danger); border-radius:9px; padding:10px 12px; font-size:12px; margin-bottom:12px; line-height:1.45; }
.notice.info{background:var(--teal-soft); border-color:var(--teal); color:var(--teal);}
.notice.warn{background:#d9b25f22; border-color:#d9b25f; color:#d9b25f;}
.src-line{font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5; word-break:break-all;}
.src-line b{color:var(--text);}

/* -----------------------------------------------------------------------
   Фото-КП клиенту — рисуется офф-скрин и превращается в PNG (html2canvas).
   Цвета захардкожены (не через переменные темы приложения): картинка одна
   и та же независимо от того, тёмная тема сейчас в калькуляторе или нет.
----------------------------------------------------------------------- */
.kp-card{ width:1080px; background:#f7f9fc; font-family:'Inter',sans-serif; color:#1a2233; }
.kp-header{ background:#255aa1; padding:40px 48px; display:flex; align-items:center; justify-content:space-between; gap:26px; }
.kp-header-left{ display:flex; align-items:center; gap:26px; }
.kp-logo{ height:64px; display:block; }
.kp-header-div{ width:2px; align-self:stretch; background:rgba(255,255,255,.3); }
.kp-h-title{ color:#fff; font-size:35px; font-weight:800; }
.kp-h-route{ color:#fff; font-size:27px; font-weight:700; white-space:nowrap; }
.kp-stats{ display:flex; gap:16px; padding:28px 48px 0; }
.kp-stat{ flex:1; background:#fff; border-radius:14px; padding:20px 22px; text-align:center; }
.kp-stat-l{ color:#8a93a6; font-size:15px; font-weight:700; letter-spacing:.03em; }
.kp-stat-v{ color:#1a2233; font-size:28px; font-weight:800; margin-top:8px; }
.kp-section{ padding:32px 48px 0; }
.kp-h2{ font-size:26px; font-weight:800; margin-bottom:16px; }
.kp-card-white{ background:#fff; border-radius:18px; padding:6px 30px; }
.kp-row{ display:flex; align-items:flex-start; gap:20px; padding:26px 0; border-bottom:1px solid #e7eaf0; }
.kp-row-last{ border-bottom:none; }
.kp-badge{ flex:0 0 auto; width:46px; height:46px; border-radius:11px; background:#eaf1fa; color:#255aa1; font-weight:800; font-size:20px; display:flex; align-items:center; justify-content:center; }
.kp-row-body{ flex:1; min-width:0; }
.kp-row-title{ font-weight:700; font-size:21px; }
.kp-row-sub{ color:#8a93a6; font-size:16px; margin-top:3px; }
.kp-row-amt{ font-weight:800; font-size:23px; white-space:nowrap; padding-top:2px; }
.kp-sub-items{ margin-top:14px; display:flex; flex-direction:column; gap:9px; }
.kp-sub-item{ display:flex; justify-content:space-between; gap:16px; font-size:16px; color:#4a5568; }
.kp-sub-item b{ color:#1a2233; font-weight:700; white-space:nowrap; }
.kp-total{ margin:24px 48px 0; background:#255aa1; border-radius:18px; padding:26px 30px; }
.kp-total-row{ display:flex; align-items:center; justify-content:space-between; gap:20px; }
.kp-total-label{ color:#fff; font-size:27px; font-weight:800; letter-spacing:.02em; }
.kp-total-note{ color:#cfe0f5; font-size:14.5px; margin-top:6px; }
.kp-total-right{ text-align:right; flex:0 0 auto; }
.kp-total-amt{ color:#fff; font-size:42px; font-weight:800; white-space:nowrap; }
.kp-badge-pill{ margin-top:8px; display:inline-block; background:#173d6f; color:#fff; font-size:14px; font-weight:700; padding:8px 16px; border-radius:99px; white-space:nowrap; }
.kp-insurance{ margin:20px 48px 0; background:#fdf6e6; border-left:5px solid #9c6f1a; border-radius:14px; padding:20px 26px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
.kp-ins-title{ color:#8a5a12; font-weight:700; font-size:17px; }
.kp-ins-sub{ color:#96854f; font-size:14px; margin-top:4px; line-height:1.5; }
.kp-ins-amt{ color:#1a2233; font-weight:800; font-size:22px; white-space:nowrap; }
.kp-params .kp-prow{ padding:18px 0; border-bottom:1px solid #e7eaf0; display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
.kp-params .kp-prow:last-child{ border-bottom:none; }
.kp-prow-2{ display:flex; gap:40px; }
.kp-prow-2>div{ flex:1; display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
.kp-plabel{ color:#5c6a82; font-size:16px; font-weight:700; }
.kp-pval{ font-weight:700; font-size:17px; text-align:right; }
.kp-pval-model{ font-size:23px; font-weight:800; color:#255aa1; }
.kp-pval-wrap{ text-align:right; font-weight:600; max-width:640px; line-height:1.5; }
.kp-footer{ margin-top:36px; background:#255aa1; color:#cfe0f5; font-size:16px; text-align:center; line-height:1.6; padding:26px 48px; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="sub" id="dateLine">—</div>
  </div>
  <div class="tabs" id="routeTabs"></div>
  <div class="content" id="content"></div>
</div>

<div class="bottomnav">
  <div class="inner">
    <button class="navbtn active" data-view="calc">
      <svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="13" x2="10" y2="13"/><line x1="13" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="10" y2="17"/><line x1="13" y1="17" x2="16" y2="17"/></svg>
      Расчёт
    </button>
    <button class="navbtn" data-view="history">
      <svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l4 2"/></svg>
      История
    </button>
    <button class="navbtn" data-view="rates">
      <svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Курсы
    </button>
    <button class="navbtn" data-view="settings">
      <svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15 1.65 1.65 0 0 0 3 14H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.31.33.6.55.85"/></svg>
      Настройки
    </button>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay"><div class="sheet" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   CAR IMPORT COST CALCULATOR — internal tool

   - Duty (пошлина) and utilisation fee (утилизационный сбор) are computed
     automatically, server-side, by submitting the same inputs to
     alta.ru/auto-vat/ (api/customs.js) and reading the numbers back off
     its result table. Why alta.ru and not tks.ru/auto/calc directly:
     tks.ru's own calculator form is protected by an anti-bot "cap" widget
     (proof-of-work captcha) — automating past that would mean bypassing
     bot-detection, which this app won't do, and TKS's separate paid
     "Расчёт авто" API product has no published request/response docs to
     build against safely. alta.ru is a free, non-captcha calculator that
     cites and applies the exact same legal sources tks.ru's own page names
     (Решение Совета ЕЭК №107 от 20.12.2017 for duty, Постановление
     Правительства РФ №1291 от 26.12.2013 for the utilisation fee) — so it
     is, in practice, the same official numbers. The util fee in particular
     is NOT a flat figure any more (a 2024+ reform made it depend on engine
     volume and power brackets too), which is exactly why this proxies live
     instead of hard-coding a rate table that would go stale.
     Both fields stay editable after the auto-fetch — manual correction
     always wins until the next "Рассчитать" tap.
   - Currency rates are always pulled from the specific sources below via
     a small server-side proxy (api/rates.js) because these sites cannot
     be fetched directly from a browser (no CORS). Each rate has its own
     manual-override switch (see openRateEditor) — when it's on, the
     manual value is used and further auto-refreshes no longer overwrite
     it until you turn the switch back off.
       ЮАНЬ/₽   — VTB Online currency-rates API (public JSON, no auth —
                   see api/rates.js header for how the TLS/robots.txt
                   assumptions that used to block this were wrong)
       ЙЕНА/₽   — ATB "для денежных переводов" exchange page
       USDT/ВОНА— Naver search result for "usdt"  (raw value − 5)
       USDT/₽   — Investing.com USDT/RUB page      (raw value + 3)
   ========================================================================= */

const memStore = {};
const Store = {
  get(key, fallback){ try{ const raw=localStorage.getItem(key); if(raw!=null) return JSON.parse(raw);}catch(e){} return key in memStore?memStore[key]:fallback; },
  set(key, val){ memStore[key]=val; try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
};

/* ---------------------------------------------------------------------
   1. Default configuration
--------------------------------------------------------------------- */
const DEFAULT_CONFIG = {

  rates: {
    CNY: {
      label:'ЮАНЬ / ₽', short:'ЮАНЬ',
      sourceUrl:'https://www.vtb.ru/personal/platezhi-i-perevody/obmen-valjuty/',

// Курсы валют — как их брать (источник, автообновляемость, корректировка,
// текст-подсказка) — это решение из кода и должно обновляться с каждым
// релизом, а не застревать на том, что когда-то сохранилось у пользователя
// в localStorage/на сервере. Синхронизируем только сами значения (raw/
// value/manualOverride и т.п.), а метаданные источника всегда берём
// из свежего DEFAULT_CONFIG — иначе, например, включив автообновление
// юаня в коде, все уже открывавшие приложение так и останутся с
// «вручную», потому что старая сохранённая копия каждый раз перекрывает
// новый код при подгрузке.
function mergeRatesState(defaultRates, storedRates){
  const out = {};
  for(const id in defaultRates){
    const def = defaultRates[id];
    out[id] = {...def};
    const st = (storedRates && storedRates[id]) || {};
    ['raw','value','autoRaw','autoUpdatedAt','updatedAt','manualOverride'].forEach(k=>{
      if(st[k]!==undefined) out[id][k] = st[k];
    });
    // Раньше у части курсов (например, юаня) автообновления вообще не было,
    // и manualOverride был принудительным, а не осознанным выбором. Если код
    // теперь умеет обновлять курс сам, а автозначения при этом никогда не
    // было (autoRaw пусто) — это точно старый вынужденный режим, а не то,
    // что человек сам когда-то включил, поэтому снимаем галочку один раз.
    if(st.manualOverride===true && (st.autoRaw===undefined || st.autoRaw===null) && def.autoAvailable===true){
      out[id].manualOverride = false;
    }
  }
  return out;
}
// Те же грабли, что чинили для курсов: label/currency/dutyMode/defaultExtraCosts
// маршрутов — это константы кода, их нельзя редактировать через приложение, и
// они не должны браться из старого синхронизированного стейта (иначе правка
// названия вкладки в коде навсегда перекрывается тем, что уже сохранено на
// устройстве/сервере пользователя). Реально редактируемые через Настройки поля
// (брокер/комиссия/% банка) — наоборот, обязаны сохраняться между сессиями.
function mergeRoutesState(defaultRoutes, storedRoutes){
  const out = {};
  for(const id in defaultRoutes){
    const def = defaultRoutes[id];
    out[id] = {...def};
    const st = (storedRoutes && storedRoutes[id]) || {};
    ['brokerFee','agentFee','bankCommissionPct'].forEach(k=>{
      if(st[k]!==undefined) out[id][k] = st[k];
    });
  }
  return out;
}
function applyStoredConfig(stored){
  const merged = deepMerge(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), stored || {});
  merged.rates = mergeRatesState(DEFAULT_CONFIG.rates, stored && stored.rates);
  merged.routes = mergeRoutesState(DEFAULT_CONFIG.routes, stored && stored.routes);
  return merged;
}

function deepMerge(base, override){
  if(Array.isArray(base)) return override!==undefined ? override : base;
  if(typeof base === 'object' && base!==null){
    const out = {...base};
    for(const k in base){ out[k] = deepMerge(base[k], override ? override[k] : undefined); }
    if(override){ for(const k in override){ if(!(k in base)) out[k]=override[k]; } }
    return out;
  }
  return override!==undefined ? override : base;
}

const NBSP_THIN = '\u202f'; // узкий неразрывный пробел (U+202F)
// Своя группировка по тысячам этим символом — не полагаемся на
// toLocaleString('ru-RU'), т.к. в WebView Telegram (особенно на Android)
// локальные данные ICU часто старее и группируют обычным широким пробелом.
function groupInt(digits){ return digits.replace(/\B(?=(\d{3})+(?!\d))/g, NBSP_THIN); }
function fmt(n, suffix){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const rounded = Math.round(n);
  return (rounded<0?'-':'')+groupInt(Math.abs(rounded).toString())+(suffix?(' '+suffix):'');
}
function num(v){ const n=parseFloat(String(v).replace(',','.')); return isNaN(n)?0:n; }
// Живое форматирование числовых полей ввода той же группировкой — формат
// только отображается, а в состояние формы (f[key]) всегда пишется «чистое»
// значение без пробелов, которое понимает num().
function formatNumInput(raw){
  const s = String(raw==null?'':raw).replace(/[^\d.,]/g,'');
  if(!s) return '';
  const parts = s.split(/[.,]/);
  const intPart = groupInt(parts[0]||'');
  return parts.length>1 ? intPart+','+parts.slice(1).join('') : intPart;
}
function cleanNumInput(v){ return String(v==null?'':v).replace(/[^\d.,]/g,''); }
const GROUPED_NUM_FIELDS = ['carPrice','extraCosts','volumeCm3','power','mileage','customsManual','deliveryManual','brokerFee','agentFee','customsValueManual'];
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function openExternal(url){

  else{ window.open(url, '_blank'); }
}

function applyAutoRate(r, raw){
  r.autoRaw = raw; r.autoUpdatedAt = Date.now(); r.fetchError = false;
  if(!r.manualOverride){ r.raw = raw; r.value = raw + r.adjustment; r.updatedAt = r.autoUpdatedAt; }
}

async function fetchAutoRates(){
  const proxyTargets = Object.keys(CONFIG.rates).filter(id => CONFIG.rates[id].autoAvailable && !CONFIG.rates[id].direct);
  const directTargets = Object.keys(CONFIG.rates).filter(id => CONFIG.rates[id].autoAvailable && CONFIG.rates[id].direct);

  if(proxyTargets.length){
    try{
      const res = await fetch(CONFIG.proxyUrl, {cache:'no-store'});
      if(!res.ok) throw new Error('proxy http '+res.status);
      const data = await res.json();
      proxyTargets.forEach(id=>{
        const r = CONFIG.rates[id];
        const raw = data[r.proxyKey];
        if(raw!==undefined && raw!==null && !isNaN(raw)) applyAutoRate(r, raw);
        else { r.fetchError = true; }
      });
    }catch(e){ proxyTargets.forEach(id=> CONFIG.rates[id].fetchError = true); }
  }

  await Promise.all(directTargets.map(async id=>{
    const r = CONFIG.rates[id];
    try{
      const res = await fetch(r.directUrl, {cache:'no-store'});
      if(!res.ok) throw new Error('http '+res.status);
      const data = await res.json();
      const raw = r.directPath.split('.').reduce((o,k)=>(o&&o[k]!==undefined)?o[k]:undefined, data);
      if(raw===undefined || isNaN(raw)) throw new Error('path not found');
      applyAutoRate(r, parseFloat(raw));
    }catch(e){ r.fetchError = true; }
  }));

  saveConfig();
  refreshRatesUI();
}

/* ---------------------------------------------------------------------
   4b. Duty + utilisation fee — live official calc via api/customs.js
   (server-side: TKS.RU's own paid "Расчёт авто" API first, alta.ru/
   auto-vat/ as an automatic fallback — see api/customs.js file header)
--------------------------------------------------------------------- */
const CUSTOMS_AGE_CODE = { lt3:'age0', t3to5:'age3', gt5:'age5' };

async function fetchCustomsQuote(route, f){
  // Таможенную стоимость сервер конвертирует сам по официальному курсу ЦБ РФ
  // (то же самое использует и сам tks.ru) — поэтому здесь передаём цену в
  // исходной валюте сделки, БЕЗ нашей комиссии банка (это наша маржа, не
  // часть стоимости авто для таможни) и без наших собственных курсов ВТБ/АТБ.
  const routeCfg = CONFIG.routes[route];
  // Таможенная стоимость по каталогу (для авто младше 3 лет, когда цена по
  // факту ниже каталожной) — если тумблер включён и значение введено, именно
  // оно уходит в расчёт пошлины/утильсбора вместо цены сделки. Цена сделки и
  // итоговая стоимость для клиента (calcDeal) от этого не меняются.
  const catalogValue = num(f.customsValueManual);
  const carValue = (f.customsValueOverride && catalogValue > 0) ? catalogValue : (num(f.carPrice) + num(f.extraCosts));
  const carCurrency = routeCfg.currency === 'USDT' ? 'USD' : routeCfg.currency;
  const em = ENGINE_TYPES[f.engineType] || ENGINE_TYPES.ben;
  const isElectric = em.dtype === 'electric';

  const payload = {
    ageCode: CUSTOMS_AGE_CODE[f.age],
    carValue,
    carCurrency,
    volumeCm3: isElectric ? 0 : num(f.volumeCm3),
    dtype: em.dtype,
    // Единственное поле мощности на форме ("Мощность электродвигателя" для
    // электро, "Мощность двигателя" для остальных) всегда пишет в
    // f.power. TKS всегда берёт мощность из "power" независимо от типа
    // двигателя (раньше здесь стоял 0 для электро — TKS получал мощность 0
    // и не мог посчитать акциз/утильсбор, отсюда пустой ответ). Дублируем
    // то же значение в powerElectric для чистого электро — это поле alta.ru
    // уже использовало для электромобилей до этого фикса и давало верный
    // результат, так что оставляем и его для надёжности резерва.
    power: num(f.power),
    powerUnit: f.powerUnit,
    powerElectric: isElectric ? num(f.power) : 0,
    powerElectricUnit: f.powerUnit
  };

  const res = await fetch(CONFIG.customsProxyUrl, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data; // { duty, util, dutyItems, utilBasis }
}

/* ---------------------------------------------------------------------
   6. Route → RUB conversion chains
--------------------------------------------------------------------- */
function convertToRub(route, carPrice, extraCosts, bankPct){
  const R = CONFIG.rates;
  const subtotal = (carPrice + extraCosts) * (1 + bankPct/100);
  if(route==='japan') return subtotal * R.JPY.value;
  if(route==='korea'){ const usd = subtotal / R.KRW_USDT.value; return usd * R.USDT_RUB.value; }
  if(route==='china') return subtotal * R.CNY.value;
  if(route==='eaeu')  return subtotal * R.USDT_RUB.value;
  return 0;
}

/* ---------------------------------------------------------------------
   7. Main calculation
--------------------------------------------------------------------- */
function calcDeal(route, f){
  const carPrice = num(f.carPrice), extra = num(f.extraCosts);
  const bankPct = CONFIG.routes[route].bankCommissionPct;
  const invoiceRub = convertToRub(route, carPrice, extra, bankPct);
  const invoiceRubNoCommission = convertToRub(route, carPrice, extra, 0);
  const bankCommissionRub = invoiceRub - invoiceRubNoCommission;
  const routeCfg = CONFIG.routes[route];

  const customsTotal = f.customsOverride ? num(f.customsManual) : num(f.customsAuto);

  const broker = num(f.brokerFee);
  const agent = num(f.agentFee);
  const delivery = f.deliveryEnabled ? (f.deliveryOverride ? num(f.deliveryManual) : deliveryPrice(f.deliveryCity, f.bodyTypeIdx)) : 0;
  const downPayment = broker; // by policy, the deposit always equals the broker fee

  const total = invoiceRub + customsTotal + broker + agent + delivery;
  // Для текста "Поделиться" клиенту нужны цена/комиссия в исходной валюте и
  // эффективный курс — считаем их здесь же, чтобы не дублировать формулу.
  const nativeTotal = carPrice + extra;
  const nativeCommission = nativeTotal * bankPct / 100;
  const effectiveRate = nativeTotal > 0 ? invoiceRubNoCommission / nativeTotal : 0;
  return {
    invoiceRub, customsTotal, broker, agent, delivery, total, downPayment,
    bankPct, bankCommissionRub, nativeTotal, nativeCommission, effectiveRate,

function renderDateLine(){
  const d = new Date();
  document.getElementById('dateLine').textContent = d.toLocaleDateString('ru-RU',{weekday:'long', day:'2-digit', month:'long', year:'numeric'});
}

function refreshRatesUI(){ if(state.view==='rates') renderContent(); }

function renderRatesView(c){
  const R = CONFIG.rates;
  c.innerHTML = `
    <div class="card">
      <h2>Курсы валют</h2>
      <p style="font-size:12px;color:var(--muted);margin:0;">Автообновляемые курсы подтягиваются через сервер при каждом открытии приложения. Ручная правка всегда в приоритете — нажмите на курс, чтобы поправить.</p>
    </div>
    ${Object.keys(R).map(id=>{
      const r = R[id];
      const stale = r.fetchError;
      return `<div class="card" data-rate="${id}" style="cursor:pointer;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:600; font-size:14.5px;">${r.label}</div>
            <div style="font-size:11.5px; color:${stale?'var(--danger)':'var(--muted)'}; margin-top:2px;">
              ${stale ? 'Не удалось обновить — используется последнее значение' : (r.manualOverride ? 'Вручную' : (r.autoAvailable ? 'Автообновление' : 'Только вручную'))}
              ${r.updatedAt ? ' · '+new Date(r.updatedAt).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''}
            </div>
          </div>
          <div class="mono" style="font-size:19px; font-weight:600; color:${stale?'var(--danger)':'var(--good)'};">${id==='KRW_USDT' ? groupInt(Math.round(r.value).toString()) : r.value.toFixed(4)}</div>
        </div>
      </div>`;
    }).join('')}
    <button class="btn secondary" id="refreshRatesBtn2">Обновить сейчас</button>
  `;
  document.getElementById('refreshRatesBtn2').onclick = async ()=>{ toast('Обновляю…'); await fetchAutoRates(); toast('Готово'); };
  c.querySelectorAll('[data-rate]').forEach(el=> el.onclick = ()=> openRateEditor(el.dataset.rate));
}

function renderTabs(){
  const tabs = document.getElementById('routeTabs');
  // Вкладки направлений нужны только на расчёте — на истории есть свой
  // набор (с «Общие»), на курсах/настройках направление не при чём.
  if(state.view!=='calc'){ tabs.style.display='none'; tabs.innerHTML=''; return; }
  tabs.style.display='';
  tabs.innerHTML = Object.keys(CONFIG.routes).map(id=>{
    const r = CONFIG.routes[id];
    return `<button class="tab ${state.route===id?'active':''}" data-route="${id}">${r.label} ${ROUTE_FLAG[id]||''}</button>`;
  }).join('');
  tabs.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{
      state.formCache[state.route] = state.form; // черновик текущего направления не теряется при переключении
      state.route = el.dataset.route;
      state.form = state.formCache[state.route] || defaultForm(state.route);
      renderTabs(); renderContent();
    };
  });
}

function renderContent(){
  const c = document.getElementById('content');
  if(state.view==='calc') return renderCalc(c);
  if(state.view==='rates') return renderRatesView(c);
  if(state.view==='history') return renderHistory(c);
  if(state.view==='settings') return renderSettingsView(c);
}

function field(label, inputHtml){ return `<div class="field"><label>${label}</label>${inputHtml}</div>`; }

function cityOptions(selected){
  return CONFIG.delivery.cities.map(c=>`<option value="${c.name}" ${c.name===selected?'selected':''}>${c.name}</option>`).join('');
}

// Сжимаем фото перед отправкой на сервер: Vercel ограничивает тело запроса
// (~4.5 МБ), а фото с телефона легко больше. Для чтения текста/таблиц
// разрешения 1800px по длинной стороне более чем достаточно.
function resizeImageToBase64(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('не удалось прочитать файл'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('не удалось декодировать изображение'));
      img.onload = ()=>{
        // Vercel обрывает соединение на слишком большом теле запроса (~4.5 МБ)
        // ещё до ответа — браузер видит это как generic "Load failed", а не
        // понятную ошибку. Поэтому сжимаем итеративно, ступень за ступенью,
        // пока base64 не влезет с запасом, а не одним фиксированным качеством.
        const MAX_BASE64 = 2.5 * 1024 * 1024;
        const attempts = [
          {dim:maxDim, q:quality}, {dim:1400, q:0.75}, {dim:1100, q:0.6}, {dim:900, q:0.5}
        ];
        let result = null;
        for(const a of attempts){
          let w = img.width, h = img.height;
          if(w > a.dim || h > a.dim){
            const scale = a.dim / Math.max(w, h);
            w = Math.round(w*scale); h = Math.round(h*scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          result = canvas.toDataURL('image/jpeg', a.q).split(',')[1];
          if(result.length <= MAX_BASE64) break;
        }
        if(!result || result.length > MAX_BASE64){
          reject(new Error('фото слишком большое даже после сжатия — попробуйте переснять при более простом освещении или обрезать лишнее по краям'));
          return;
        }
        resolve({ base64: result, mimeType: 'image/jpeg' });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Общая логика для текстового и фото-разбора объявления: шлёт payload на
// /api/parse-listing и подставляет результат в форму f (только в пустые
// поля — см. комментарий у FIELD_DEFAULTS). Никогда не бросает исключение —
// всегда возвращает готовый статус-текст для показа пользователю.
async function runListingParse(payload, f){
  try{
    const res = await fetch(CONFIG.parseListingUrl, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    // engineType/powerUnit в defaultForm НЕ пустые ('ben'/'ls' — значения по
    // умолчанию для селектов без явного "не выбрано"), поэтому для них
    // "пусто" — это "всё ещё значение по умолчанию", а не truthy-проверка.
    const FIELD_DEFAULTS = { engineType:'ben', powerUnit:'ls' };
    const FIELD_MAP = ['model','carTrim','mileage','prodMonth','prodYear','drivetrain','transmission',
      'engineType','volumeCm3','power','powerUnit','condition','notes'];
    let filled = 0;
    FIELD_MAP.forEach(k=>{
      const v = data[k];
      if(v===null || v===undefined || v==='') return;
      const isEmpty = k in FIELD_DEFAULTS ? f[k]===FIELD_DEFAULTS[k] : !f[k];
      if(!isEmpty) return;
      if(k==='drivetrain' && !DRIVETRAIN_LABELS[v]) return;
      if(k==='transmission' && !TRANSMISSION_LABELS[v]) return;
      if(k==='engineType' && !ENGINE_TYPES[v]) return;
      if(k==='powerUnit' && v!=='ls' && v!=='kvt') return;
      f[k] = (k==='mileage' || k==='volumeCm3' || k==='power') ? String(Math.round(num(v))) : String(v);
      filled++;
    });
    if(filled>0) f.showCarDetails = true;
    const sourceNote = data.source==='heuristic' ? ' · резервный разбор без ИИ (GigaChat недоступен'+(data.aiError?': '+data.aiError:'')+'), часть полей могла не заполниться' : '';
    const statusText = (filled>0 ? ('Заполнено полей: '+filled) : 'Новых данных не нашли — либо их нет в тексте, либо все поля уже заполнены') + sourceNote;
    return { statusText, statusColor: filled>0 ? 'var(--good)' : 'var(--muted)' };
  }catch(e){
    return { statusText: 'Ошибка: '+e.message, statusColor: 'var(--danger)' };
  }
}

      el.oninput = ()=>{
        const clean = cleanNumInput(el.value);
        f[k] = clean;
        const digitsBeforeCursor = cleanNumInput(el.value.slice(0, el.selectionStart)).length;
        const formatted = formatNumInput(clean);
        el.value = formatted;
        let seen = 0, pos = formatted.length;
        for(let i=0;i<formatted.length;i++){
          if(/[\d.,]/.test(formatted[i])) seen++;
          if(seen>=digitsBeforeCursor){ pos = i+1; break; }
        }
        el.setSelectionRange(pos, pos);
      };

      el.oninput = ()=> f[k]=el.value;

      return;
    }
    parseImgBtn.disabled = true; parseImgBtn.textContent = 'Распознаю…';
    let statusText = '', statusColor = 'var(--muted)';
    try{
      const {base64, mimeType} = await resizeImageToBase64(file, 1800, 0.85);
      const result = await runListingParse({image:base64, mimeType}, f);
      statusText = result.statusText; statusColor = result.statusColor;
    }catch(e){
      statusText = 'Ошибка: '+e.message;
      statusColor = 'var(--danger)';
    }
    renderCalc(c);
    const statusEl = document.getElementById('parseListingImageStatus');
    if(statusEl){ statusEl.textContent = statusText; statusEl.style.color = statusColor; }
  };
  const transEl = document.getElementById('f_transmission'); if(transEl) transEl.onchange = ()=>{ f.transmission=transEl.value; };
  const cityEl = document.getElementById('f_city'); if(cityEl) cityEl.onchange = ()=>{ f.deliveryCity=cityEl.value; renderCalc(c); };
  const bodyEl = document.getElementById('f_body'); if(bodyEl) bodyEl.onchange = ()=>{ f.bodyTypeIdx=+bodyEl.value; renderCalc(c); };
  const delT = document.getElementById('delOverrideToggle'); if(delT) delT.onclick = ()=>{ f.deliveryOverride=!f.deliveryOverride; renderCalc(c); };
  // Вложенный тумблер "вручную" и его значение раньше переживали выключение
  // родительского "Учитывать доставку" — секция просто скрывалась, а флаг
  // оставался true, и при повторном включении доставка неожиданно снова
  // была "вручную". Каждое переключение родителя теперь сбрасывает вложенный
  // тумблер и его значение — включать "вручную" можно только заново самому.
  const delEnT = document.getElementById('deliveryEnabledToggle'); if(delEnT) delEnT.onclick = ()=>{ f.deliveryEnabled=!f.deliveryEnabled; f.deliveryOverride=false; f.deliveryManual=''; renderCalc(c); };
  const customsT = document.getElementById('customsOverrideToggle'); if(customsT) customsT.onclick = ()=>{ f.customsOverride=!f.customsOverride; renderCalc(c); };

  document.getElementById('calcBtn').onclick = async ()=>{
    const btn = document.getElementById('calcBtn');
    btn.disabled = true; btn.textContent = 'Запрашиваю расчёт в TKS…';
    let statusText = '', statusColor = 'var(--muted)';
    try{
      const res = await fetchCustomsQuote(route, f);
      const autoTotal = (isEaeu ? 0 : (res.duty||0)) + (res.util||0);
      f.customsAuto = String(Math.round(autoTotal));
      const dutyBreakdown = (!isEaeu && res.dutyItems && res.dutyItems.length)
        ? res.dutyItems.map(x=>x.label.replace(/:$/,'')+' '+fmt(x.amount)).join(' + ')+' + Утильсбор '+fmt(res.util||0)
        : 'Утильсбор '+fmt(res.util||0);
      const sourceLabel = res.source==='alta'
        ? 'alta.ru (резерв, TKS был недоступен'+(res.tksError ? ': '+res.tksError : '')+')'
        : 'официального API TKS.RU';
      const catalogNote = (f.customsValueOverride && num(f.customsValueManual)>0)
        ? ' · по каталожной стоимости '+fmt(num(f.customsValueManual))+' '+suf
        : '';
      statusText = 'Получено из '+sourceLabel+': '+dutyBreakdown+catalogNote+' · '+ new Date().toLocaleTimeString('ru-RU');
    }catch(e){
      statusText = 'Не удалось получить расчёт ('+e.message+') — используется значение из поля «вручную» (если включено) или 0.';
      statusColor = 'var(--danger)';
    }
    btn.disabled = false; btn.textContent = 'Рассчитать';
    renderCalc(c);
    const statusEl = document.getElementById('customsStatus');
    if(statusEl){ statusEl.textContent = statusText; statusEl.style.color = statusColor; }
    showResult(route, f);
  };
}

function carDetailLines(f, route){
  if(!f.showCarDetails) return [];
  const lines = [];
  if(f.carTrim) lines.push(['Комплектация', f.carTrim]);
  // Для Японии аукционные листы (и то, что с них считывается) показывают дату
  // первой регистрации, а не дату выпуска — эти даты могут отличаться, и
  // выдавать за клиенту одно как другое было бы неточно. См. обсуждение с
  // владельцем: для остальных направлений это по-прежнему дата производства.
  const prodDateLabel = route==='japan' ? 'Дата первой регистрации' : 'Дата производства';
  if(f.prodMonth || f.prodYear) lines.push([prodDateLabel, [f.prodMonth?String(f.prodMonth).padStart(2,'0'):'', f.prodYear].filter(Boolean).join('.')]);
  if(f.mileage) lines.push(['Пробег', fmt(num(f.mileage),'км')]);
  if(f.drivetrain) lines.push(['Привод', DRIVETRAIN_LABELS[f.drivetrain] || f.drivetrain]);
  if(f.transmission) lines.push(['Трансмиссия', TRANSMISSION_LABELS[f.transmission] || f.transmission]);
  if(f.condition) lines.push(['Состояние', f.condition]);
  if(f.notes) lines.push(['Примечания', f.notes]);
  return lines;
}

// Формат курса: у копеечных курсов (напр. вона) 2 знака после запятой
// стирают всю величину, поэтому мелким курсам даём больше точности.
function fmtRate(rate){
  return (rate>=1 ? rate.toFixed(2) : rate.toFixed(4)).replace('.', ',');
}

/* ---------------------------------------------------------------------
   8b. Фото-КП клиенту — та же логика "показывать/не показывать", что и
   в тексте (см. shareResult): "Параметры автомобиля" целиком появляется
   только при f.showCarDetails, а сами поля внутри — там, где для текста
   было бы "не показывать пустое", здесь (это готовая карточка/таблица,
   строки нельзя просто убрать без дыры в вёрстке) показываем "—".

function buildKpHtml(route, f, r){

  // а строку доставки и блок страхования (он именно про "в пути по РФ")

  const destCity = f.deliveryEnabled && f.deliveryCity ? f.deliveryCity : 'Владивосток';
  const destGenitive = CITY_GENITIVE[destCity] || destCity;

  const rows4 = [

    { n:3, title:r.customsLabel, sub:'таможенные платежи физлица', amount:r.customsTotal },
    { n:4, title:'Расходы РФ', sub:'оформление, агент, доставка', amount:r.broker+r.agent+r.delivery, subItems:[
        ['Таможенное оформление (брокер, ЭПТС, СБКТС)', r.broker],

  ];
  const rowsHtml = rows4.map((row,i)=>`
    <div class="kp-row${i===rows4.length-1?' kp-row-last':''}">

        <div class="kp-row-title">${esc(row.title)}</div>

      </div>
      <div class="kp-row-amt">${fmt(row.amount,'₽')}</div>
    </div>`).join('');

  let paramsHtml = '';
  if(f.showCarDetails){
    const extra = [];
    if(f.carTrim) extra.push(['Комплектация', esc(f.carTrim)]);
    if(f.condition) extra.push(['Состояние', esc(f.condition)]);
    if(f.notes) extra.push(['Примечания', esc(f.notes)]);
    paramsHtml = `
      <div class="kp-section">
        <div class="kp-h2">Параметры автомобиля</div>

  // Направление в шапке — по тем же правилам, что в тексте клиенту:

        <div class="kp-stat"><div class="kp-stat-l">${RATE_STAT_LABEL[route]}</div><div class="kp-stat-v">${fmtRate(r.effectiveRate)} ₽</div></div>
        <div class="kp-stat"><div class="kp-stat-l">ЦЕНА АВТО</div><div class="kp-stat-v">${suf}${groupInt(Math.round(r.nativeTotal).toString())}</div></div>

          </div>
        </div>
      </div>
      ${f.deliveryEnabled ? `
      <div class="kp-insurance">

// html2canvas рисует только то, что реально в DOM — оффскрин-контейнер
// (не display:none, у него нет layout) с фиксированной шириной, чтобы
// картинка не зависела от размера экрана телефона.
async function renderKpImageBlob(route, f, r){
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed; left:-99999px; top:0; width:1080px; z-index:-1;';
  holder.innerHTML = buildKpHtml(route, f, r);
  document.body.appendChild(holder);
  try{
    const img = holder.querySelector('.kp-logo');
    if(img && !img.complete){ await new Promise(res=>{ img.onload = res; img.onerror = res; }); }
    const canvas = await html2canvas(holder.firstElementChild, { scale:6, backgroundColor:'#f7f9fc', letterRendering:true });
    return await new Promise(res=> canvas.toBlob(res, 'image/png'));
  } finally {
    document.body.removeChild(holder);
  }
}

async function shareResult(route, f, r){
  const suf = CUR_SUFFIX[route];
  // По просьбе владельца: клиенту направление ЕАЭС всегда подписывается
  // "Китай" в тексте расчёта — по факту это тот же китайский автомобиль,
  // ЕАЭС/Киргизия — таможенный маршрут для нас, а не страна для клиента.
  // Флаг при этом берём настоящий (ROUTE_FLAG[route], т.е. глобус для ЕАЭС),
  // а не флаг Китая — флаг отражает фактический маршрут, а не текст подписи.
  const shareRouteLabel = route==='eaeu' ? 'Китай' : CONFIG.routes[route].label;
  const dateStr = new Date().toLocaleDateString('ru-RU');
  // Кнопка отправки теперь одна на все три мессенджера (раньше у WhatsApp
  // была своя ссылка wa.me и свой формат с *звёздочками* — жирным шрифтом),
  // так что формат текста тоже один: без звёздочек (WhatsApp их видел бы,
  // но Telegram/MAX — нет) и с тире перед строками курса/комиссии для
  // читаемости без жирного шрифта.
  const b = s => s;
  const dash = '- ';
  // Значения из "Доп. данных" (ручной ввод или разбор ИИ) могут случайно
  // содержать "*" — непарный символ выглядел бы странно в тексте.
  const esc = s => String(s).replace(/\*/g, '');

  const em = ENGINE_TYPES[f.engineType] || ENGINE_TYPES.ben;
  const isElectric = em.dtype === 'electric';
  let engineLine = null;
  if(isElectric){
    engineLine = 'Электричество';
  } else {
    const parts = [];
    if(num(f.volumeCm3)>0) parts.push((num(f.volumeCm3)/1000).toFixed(1).replace('.', ',')+' л');
    if(num(f.power)>0) parts.push(fmt(num(f.power))+' '+(f.powerUnit==='kvt'?'квт':'лс'));
    if(parts.length) engineLine = parts.join(' / ');
  }

  const prodDateLabel = route==='japan' ? 'Дата первой регистрации' : 'Дата производства';
  const details = [
    f.carTrim ? ['Комплектация', esc(f.carTrim)] : null,
    (f.prodMonth || f.prodYear) ? [prodDateLabel, [f.prodMonth?String(f.prodMonth).padStart(2,'0'):'', f.prodYear].filter(Boolean).join('.')] : null,
    f.mileage ? ['Пробег', fmt(num(f.mileage),'км')] : null,
    engineLine ? ['Двигатель', engineLine] : null,
    f.drivetrain ? ['Привод', DRIVETRAIN_LABELS[f.drivetrain]||f.drivetrain] : null,
    f.transmission ? ['Трансмиссия', TRANSMISSION_LABELS[f.transmission]||f.transmission] : null,
    f.condition ? ['Состояние', esc(f.condition)] : null,
    f.notes ? ['Примечания', esc(f.notes)] : null
  ].filter(Boolean);

  // Комиссию за перевод в валюте сделки просят показывать только для
  // Китая/ЕАЭС; для Японии/Кореи — как и раньше, только в рублях.
  const commissionLine = (route==='china' || route==='eaeu')
    ? `Комиссия за перевод (${r.bankPct}%): ${fmt(r.nativeCommission, suf)}`
    : `Комиссия за перевод (${r.bankPct}%): ${fmt(r.bankCommissionRub, '₽')}`;

  // Город "под ключ" — реально посчитанный город доставки, если доставку
  // считали; если нет — по умолчанию Владивосток (там принимаем авто).
  const destCity = f.deliveryEnabled && f.deliveryCity ? f.deliveryCity : 'Владивосток';
  const destGenitive = CITY_GENITIVE[destCity] || destCity;

  const lines = [b(`${shareRouteLabel} ${ROUTE_FLAG[route]||''} (${dateStr})`), '', `🚘 ${b(f.model ? esc(f.model) : 'Расчёт')}`];
  if(f.showCarDetails && details.length) lines.push(...details.map(([k,v])=>`${b(k+':')} ${v}`));
  lines.push('');
  lines.push(`${b('Цена ТС с расходами до РФ:')} ${fmt(r.invoiceRub,'₽')}`);
  lines.push(`${dash}Цена в валюте: ${fmt(r.nativeTotal, suf)}`);
  lines.push(`${dash}${commissionLine}`);
  lines.push(`${dash}Курс на дату расчета: ${fmtRate(r.effectiveRate)} ₽/${suf}`);
  lines.push(`${b(r.customsLabel+':')} ${fmt(r.customsTotal,'₽')}`);
  lines.push(`${b('Брокер:')} ${fmt(r.broker,'₽')}`);
  lines.push(`${b('Комиссия:')} ${fmt(r.agent,'₽')}`);
  if(f.deliveryEnabled) lines.push(`${b('Доставка по РФ:')} ${fmt(r.delivery,'₽')} (страхование авто в пути, по желанию (рекомендуется) / к оплате дополнительно - 0,3% от заявленной стоимости ТС)`);
  lines.push('');
  lines.push(b(`ИТОГО цена под ключ: ${fmt(r.total,'₽')}`));
  lines.push(`с учётом всех расходов до ${destGenitive} на дату расчета`);
  const text = lines.join('\n');

  // Фото-КП идёт вложением — прикрепить файл умеет только системное окно
  // "Поделиться" (ни у wa.me, ни у switchInlineQuery/t.me нет способа
  // нести вложение), поэтому кнопка одна на все три мессенджера, отправка
  // всегда через него.
  let file = null;
  try{
    toast('Готовим фото КП…', 1500);
    const blob = await renderKpImageBlob(route, f, r);
    if(blob) file = new File([blob], 'baikal-auto-kp.png', {type:'image/png'});
  } catch(e){ /* не получилось — отправим хотя бы текст */ }

  const title = 'Расчёт стоимости авто';
  const fullData = file ? {files:[file], text, title} : {text, title};
  // canShare проверяем на ПОЛНЫЙ набор данных (файл+текст вместе), а не
  // только на файл отдельно: у отдельных приложений (например, замечена
  // проблема с WhatsApp) комбинация "файл + текст" не проходит, хотя файл
  // один или текст один — проходят. Если совместный шер невозможен или
  // не удался, отправляем хотя бы текст, чтобы сообщение не терялось.
  const canFull = !!(file && navigator.canShare && navigator.canShare(fullData));
  const primaryData = canFull ? fullData : {text, title};

  if(navigator.share){
    try{
      await navigator.share(primaryData);
    }catch(e){
      if(primaryData.files){
        try{ await navigator.share({text, title}); }catch(e2){ /* пользователь мог просто отменить шер */ }
      }
    }
    return;
  }
  navigator.clipboard && navigator.clipboard.writeText(text).then(()=> toast('Скопировано в буфер обмена'+(primaryData.files?' (фото не прикреплено)':'')));
}

  </div>`;

  const listHtml = filtered.length ? filtered.map(h=>{
    const d = new Date(h.date);
    return `<div class="histcard" data-id="${h.id}">
      <div class="l"><div class="m">${h.model}</div><div class="d">${CONFIG.routes[h.route].label} · ${d.toLocaleDateString('ru-RU')}</div></div>
      <div class="r"><div class="t">${fmt(h.total,'₽')}</div><button class="btn secondary small" data-del="${h.id}" style="margin-top:5px;padding:4px 9px;">Удалить</button></div>
    </div>`;
  }).join('') + `<button class="btn secondary" id="clearHist" style="margin-top:4px;">${filter==='all'?'Очистить всю историю':'Очистить историю «'+CONFIG.routes[filter].label+'»'}</button>`
    : `<div class="emptystate"><div class="big">Пока пусто</div>Сохранённые расчёты появятся здесь</div>`;

  c.innerHTML = filterHtml + listHtml;

  c.querySelectorAll('#histFilterSeg .tab').forEach(b=> b.onclick = ()=>{ state.historyFilter = b.dataset.f; renderHistory(c); });

  c.querySelectorAll('.histcard').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('[data-del]')) return;
      const h = state.history.find(x=>x.id==el.dataset.id);
      state.route = h.route; state.form = {...defaultForm(h.route), ...h.form};
      state.formCache[h.route] = state.form;
      state.view='calc';
      document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view==='calc'));
      renderTabs(); renderContent();
      setTimeout(()=> showResult(h.route, state.form), 50);
    };
  });
  c.querySelectorAll('[data-del]').forEach(b=> b.onclick = (e)=>{
    e.stopPropagation();
    state.history = state.history.filter(x=>x.id!=b.dataset.del);
    saveHistory();
    renderHistory(c);
    toast('Удалено');
  });
  const cl = document.getElementById('clearHist');
  if(cl) cl.onclick = ()=>{
    if(filter==='all'){ state.history=[]; } else { state.history = state.history.filter(x=>x.route!==filter); }
    saveHistory(); renderHistory(c);
  };
}

/* ---------------------------------------------------------------------
   9. Settings
--------------------------------------------------------------------- */
const SETTINGS_SECTIONS = [
  {id:'admin', label:'Доступ к приложению', ownerOnly:true},
  {id:'rates', label:'Курсы валют'},
  {id:'routes', label:'Маршруты — комиссии по умолчанию'},
  {id:'customs', label:'Расчёт TKS'},
  {id:'delivery', label:'Таблица доставки по РФ'}
];

function renderSettingsView(c){
  const section = state.settingsSection;

  if(!section){
    const items = SETTINGS_SECTIONS.filter(s=> !s.ownerOnly || (ACCESS && ACCESS.isOwner));
    c.innerHTML = `<div class="settings-menu">` +
      items.map(s=>`<div class="settings-row" data-s="${s.id}"><div class="lbl">${s.label}</div><div class="arrow">›</div></div>`).join('') +
      `</div>
      <button class="btn secondary" id="resetCfgBtn">Сбросить настройки к значениям по умолчанию</button>`;
    c.querySelectorAll('.settings-row').forEach(el=> el.onclick = ()=>{ state.settingsSection = el.dataset.s; renderSettingsView(c); });
    document.getElementById('resetCfgBtn').onclick = openResetConfirm;
    return;
  }

  const back = `<button class="btn secondary small" id="settingsBack" style="margin-bottom:14px;">← Назад</button>`;
  let body = '';

  if(section==='admin' && ACCESS && ACCESS.isOwner){
    body = `<div class="card" id="adminCard"><h2>Доступ к приложению</h2><div style="font-size:12px;color:var(--muted);">Загрузка…</div></div>`;
  } else if(section==='rates'){
    body = `<div class="card">
      <h2>Курсы валют</h2>
      <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">Источники и ручная корректировка — на отдельной вкладке «Курсы» в нижнем меню.</p>
      <button class="btn secondary" id="refreshRatesBtn">Обновить автоматические курсы</button>
    </div>`;
  } else if(section==='routes'){
    body = `<div class="card">
      <h2>Маршруты — комиссии по умолчанию</h2>
      ${Object.keys(CONFIG.routes).map(id=>routeSettingsBlock(id)).join('<div style="height:14px"></div>')}
    </div>`;
  } else if(section==='customs'){
    body = `<div class="card">
      <h2>Расчёт TKS</h2>
      <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">На вкладке «Расчёт» таможенные платежи считаются автоматически на сервере (<code>api/customs.js</code>) через официальный API TKS.RU «Расчёт авто» (по лицензионному ключу) — сбор за оформление, пошлина и утилизационный сбор по Решению ЕЭК №107 и Постановлению №1291. Форму на tks.ru/auto/calc использовать напрямую нельзя, она защищена антибот-капчей, поэтому это отдельный API. Если TKS вдруг недоступен, автоматически подключается резервный источник alta.ru/auto-vat/ (тот же официальный расчёт, независимо проверен и даёт идентичные цифры). Значение всегда можно поправить вручную тумблером «Указать вручную» в карточке «Таможенные платежи».</p>
      ${CONFIG.customsCalculators.map(x=>`<a class="linkbtn" href="javascript:void(0)" onclick="openExternal('${x.url}')">${x.label} ↗</a>`).join('')}
    </div>`;
  } else if(section==='delivery'){
    body = `<div class="card">
      <h2>Таблица доставки по РФ (₽)</h2>
      <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">Отправка из: ${CONFIG.delivery.originLabel}. Можно отредактировать любые значения или добавить город.</p>
      ${deliveryTable()}
      <button class="btn secondary small" id="addCityBtn" style="margin-top:10px;">+ Добавить город</button>
    </div>`;
  }

  c.innerHTML = back + body;
  document.getElementById('settingsBack').onclick = ()=>{ state.settingsSection = null; renderSettingsView(c); };

  if(section==='admin' && ACCESS && ACCESS.isOwner) loadAdminCard();
  if(section==='rates'){
    document.getElementById('refreshRatesBtn').onclick = async ()=>{ toast('Обновляю…'); await fetchAutoRates(); toast('Готово'); };
  }
  if(section==='routes') bindRouteSettings();
  if(section==='delivery'){
    bindDeliveryTable();
    document.getElementById('addCityBtn').onclick = ()=>{
      CONFIG.delivery.cities.push({name:'Новый город', prices:[0,0,0,0]});
      saveConfig(); renderSettingsView(c);
    };
  }
}

function openResetConfirm(){
  openSheet(`
    <h3>Сбросить все настройки?</h3>
    <p style="font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.5;">Комиссии по маршрутам, таблица доставки и все источники курсов вернутся к значениям по умолчанию. Отменить это будет нельзя.</p>
    <button class="btn" id="resetConfirmBtn" style="background:var(--danger);margin-bottom:8px;">Да, сбросить всё</button>
    <button class="btn secondary" id="resetCancelBtn">Отмена</button>
  `);
  document.getElementById('resetConfirmBtn').onclick = ()=>{
    closeSheet();
    CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    saveConfig();
    state.settingsSection = null;
    renderAll();
    toast('Настройки сброшены');
  };
  document.getElementById('resetCancelBtn').onclick = closeSheet;
}

async function fetchAdminUsers(){
  const res = await fetch('/api/admin', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({initData:getInitData(), action:'list'})});
  return res.json();
}
async function adminAction(action, targetId){
  const res = await fetch('/api/admin', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({initData:getInitData(), action, targetId})});
  return res.json();
}
function renderAdminUsersList(users){
  if(!users.length) return `<div style="font-size:12px;color:var(--muted);">Пока никто не заходил.</div>`;
  return users.map(u=>{
    const label = u.name || ('id '+u.id);
    const uname = u.username ? ' · @'+u.username : '';
    const statusColor = u.isOwner ? 'var(--accent)' : (u.status==='approved' ? 'var(--good)' : u.status==='pending' ? '#d9b25f' : 'var(--danger)');
    const statusText = u.isOwner ? 'владелец' : (u.status==='approved' ? 'доступ открыт' : u.status==='pending' ? 'ожидает подтверждения' : 'доступ закрыт');
    const btn = u.isOwner ? '' : (u.status==='approved'
      ? `<button class="btn secondary small" data-revoke="${u.id}">Закрыть</button>`
      : `<button class="btn small" data-approve="${u.id}">Разрешить</button>`);
    return `<div class="histcard" style="cursor:default;">
      <div class="l"><div class="m">${label}${uname}</div><div class="d" style="color:${statusColor};">${statusText}</div></div>
      <div class="r">${btn}</div>
    </div>`;
  }).join('');
}
async function loadAdminCard(){
  const cardEl = document.getElementById('adminCard');
  if(!cardEl) return;
  try{
    const {users, error} = await fetchAdminUsers();
    if(error){ cardEl.innerHTML = `<h2>Доступ к приложению</h2><div class="notice warn">${error}</div>`; return; }
    cardEl.innerHTML = `<h2>Доступ к приложению</h2>` + renderAdminUsersList(users||[]);
    cardEl.querySelectorAll('[data-approve]').forEach(b=> b.onclick = async ()=>{ b.disabled=true; await adminAction('approve', b.dataset.approve); toast('Доступ открыт'); loadAdminCard(); });
    cardEl.querySelectorAll('[data-revoke]').forEach(b=> b.onclick = async ()=>{ b.disabled=true; await adminAction('revoke', b.dataset.revoke); toast('Доступ закрыт'); loadAdminCard(); });
  }catch(e){
    cardEl.innerHTML = `<h2>Доступ к приложению</h2><div class="notice warn">Не удалось загрузить: ${e.message}</div>`;
  }
}

function routeSettingsBlock(id){
  const r = CONFIG.routes[id];
  return `
    <div class="sub-h">${r.label}</div>
    <div class="row3">
      ${field('Брокер, ₽', `<input type="number" class="rs" data-route="${id}" data-key="brokerFee" value="${r.brokerFee}">`)}
      ${field('Комиссия, ₽', `<input type="number" class="rs" data-route="${id}" data-key="agentFee" value="${r.agentFee}">`)}
      ${field('Банк, %', `<input type="number" class="rs" data-route="${id}" data-key="bankCommissionPct" value="${r.bankCommissionPct}" step="0.1">`)}
    </div>
  `;
}
function bindRouteSettings(){
  document.querySelectorAll('.rs').forEach(el=>{
    el.oninput = ()=>{ CONFIG.routes[el.dataset.route][el.dataset.key] = num(el.value); saveConfig(); };
  });
}

function deliveryTable(){
  const heads = CONFIG.delivery.bodyTypes.map(b=>`<th>${b}</th>`).join('');
  const rows = CONFIG.delivery.cities.map((city,ci)=>`
    <tr>
      <td class="name"><input type="text" class="dcname" data-i="${ci}" value="${city.name}" style="width:100px;"></td>
      ${city.prices.map((p,pi)=>`<td><input type="number" class="dcprice" data-i="${ci}" data-p="${pi}" value="${p}" style="width:64px;"></td>`).join('')}
      <td><button class="btn secondary small" data-del="${ci}" style="padding:5px 8px;">✕</button></td>
    </tr>`).join('');
  return `<div style="overflow-x:auto;"><table class="tablecfg"><thead><tr><th>Город</th>${heads}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function bindDeliveryTable(){
  document.querySelectorAll('.dcname').forEach(el=> el.oninput = ()=>{ CONFIG.delivery.cities[+el.dataset.i].name = el.value; saveConfig(); });
  document.querySelectorAll('.dcprice').forEach(el=> el.oninput = ()=>{ CONFIG.delivery.cities[+el.dataset.i].prices[+el.dataset.p] = num(el.value); saveConfig(); });
  document.querySelectorAll('[data-del]').forEach(el=> el.onclick = ()=>{
    CONFIG.delivery.cities.splice(+el.dataset.del,1); saveConfig(); renderSettingsView(document.getElementById('content'));
  });
}

/* ---------------------------------------------------------------------
   10. Rate editor sheet
--------------------------------------------------------------------- */
function openSheet(html){ document.getElementById('sheetBody').innerHTML = `<div class="sheet-handle"></div>` + html; document.getElementById('sheetOverlay').classList.add('open'); }
function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('open'); }
document.getElementById('sheetOverlay').onclick = (e)=>{ if(e.target.id==='sheetOverlay') closeSheet(); };

function openRateEditor(id){
  const r = CONFIG.rates[id];
  openSheet(`
    <h3>${r.label}</h3>
    <a class="linkbtn" href="javascript:void(0)" id="openSrc">Открыть источник ↗</a>
    <div class="src-line">${r.sourceNote}</div>
    ${r.autoAvailable ? `
      <div class="field" style="margin-top:14px;"><label>Автообновление (2 раза в сутки, при открытии приложения)</label>
        <div style="font-size:12.5px; color:var(--muted);">Последнее авто-значение: ${r.autoRaw!=null?r.autoRaw:'—'}${r.autoUpdatedAt ? ' · '+new Date(r.autoUpdatedAt).toLocaleString('ru-RU') : ''}</div>
      </div>
      <div class="toggle-row field" style="margin-top:10px;">
        <div style="font-size:12.5px;">Ручная корректировка ${r.manualOverride?'(активна — авто-курс игнорируется)':''}</div>
        <div class="switch ${r.manualOverride?'on':''}" id="manualToggle"><div class="knob"></div></div>
      </div>
    ` : `<div class="notice warn" style="margin-top:14px;">Автообновление недоступно для этого источника — вводите значение вручную после проверки по ссылке выше.</div>`}
    ${field('Значение (сырое)', `<input type="number" id="r_raw" value="${r.raw}" step="0.0001" ${r.autoAvailable && !r.manualOverride ? 'disabled' : ''}>`)}
    ${r.adjustment ? `<div style="font-size:12px;color:var(--muted);margin:-4px 0 10px;">Применяется корректировка: <b style="color:var(--text)">${r.adjustmentLabel}</b> → итоговое значение <b id="r_computed" style="color:var(--text)">${(r.raw+r.adjustment).toFixed(4)}</b></div>` : ''}
    <button class="btn" id="saveRateBtn" style="margin-top:6px;">Сохранить</button>
  `);
  document.getElementById('openSrc').onclick = ()=> openExternal(r.sourceUrl);
  const rawEl = document.getElementById('r_raw');
  const compEl = document.getElementById('r_computed');
  if(rawEl && compEl) rawEl.oninput = ()=>{ compEl.textContent = (num(rawEl.value)+r.adjustment).toFixed(4); };
  const toggleEl = document.getElementById('manualToggle');
  if(toggleEl) toggleEl.onclick = ()=>{
    if(r.manualOverride){ clearManualOverride(id); } else { r.manualOverride = true; saveConfig(); }
    openRateEditor(id);
  };
  document.getElementById('saveRateBtn').onclick = ()=>{
    if(r.autoAvailable && !r.manualOverride){ closeSheet(); refreshRatesUI(); return; }
    setRawValue(id, document.getElementById('r_raw').value);
    closeSheet(); refreshRatesUI();
    toast('Курс обновлён');
  };
}

document.querySelectorAll('.navbtn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
    state.view = btn.dataset.view;
    if(state.view==='settings') state.settingsSection = null;
    renderTabs(); renderContent();
    // Страница скроллится сама (напр. до чека расчёта); при переключении
    // вкладки снизу нужно возвращаться к началу новой вкладки, а не
    // оставаться на том же scrollY — иначе на более коротких страницах
    // (например, история) это выглядит как "перекинуло вниз списка".
    window.scrollTo(0, 0);
  };
});
function toast(msg, ms){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), ms||1800); }
function renderAll(){ renderDateLine(); renderTabs(); renderContent(); }
function startApp(){ renderAll(); fetchAutoRates(); }

/* ---------------------------------------------------------------------
   12. Доступ через Telegram — приложение работает только как Mini App.
   Без initData (открыто не из Telegram) нет способа безопасно узнать,
   кто это — поэтому доступ вообще не выдаём, а не просто "работаем как
   гость". См. api/_lib/access.js: первый, кто когда-либо откроет
   приложение, автоматически становится владельцем и может открывать/
   закрывать доступ остальным во вкладке «Настройки».
--------------------------------------------------------------------- */
function renderGate(kind, info){
  info = info || {};
  document.getElementById('routeTabs').style.display = 'none';
  const bn = document.querySelector('.bottomnav'); if(bn) bn.style.display = 'none';
  const c = document.getElementById('content');
  if(kind === 'no-telegram'){
    c.innerHTML = `<div class="emptystate"><div class="big">Откройте через Telegram</div>Это приложение работает только внутри Telegram — откройте вашего бота и нажмите кнопку меню (или ссылку на мини-приложение).</div>`;
  } else if(kind === 'pending'){
    c.innerHTML = `<div class="emptystate"><div class="big">Доступ ожидает подтверждения</div>${info.name?('Здравствуйте, '+info.name+'. '):''}Владелец увидит запрос во вкладке «Настройки» и откроет доступ. Загляните чуть позже.<br><button class="btn secondary" id="recheckBtn" style="margin-top:16px;">Проверить ещё раз</button></div>`;
    document.getElementById('recheckBtn').onclick = ()=> location.reload();
  } else {
    c.innerHTML = `<div class="emptystate"><div class="big">Не удалось проверить доступ</div>${info.error || 'Неизвестная ошибка'}<br><button class="btn secondary" id="recheckBtn" style="margin-top:16px;">Повторить</button></div>`;
    document.getElementById('recheckBtn').onclick = ()=> location.reload();
  }
}

async function bootGate(){
  const hasTelegram = !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData);
  if(!hasTelegram){ renderGate('no-telegram'); return; }

  const tg = window.Telegram.WebApp;
  try{ tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#121a1b'); tg.setBackgroundColor && tg.setBackgroundColor('#121a1b'); }catch(e){}
  try{
    // Telegram рисует свои кнопки (закрыть/свернуть/⋯) поверх окна мини-приложения,
    // а не в отдельной полосе — если не оставить место, они налезают на контент.
    // contentSafeAreaInset (Bot API 8.0+) даёт точный отступ; если недоступен — берём
    // разумный запас по умолчанию.
    const inset = (tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) || (tg.safeAreaInset && tg.safeAreaInset.top) || 0;
    document.documentElement.style.setProperty('--tg-top-pad', Math.max(inset, 44) + 'px');
  }catch(e){ document.documentElement.style.setProperty('--tg-top-pad', '44px'); }

  let authRes;
  try{
    const r = await fetch('/api/auth', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({initData: tg.initData})});
    authRes = await r.json();
  }catch(e){ authRes = {status:'error', error:'Нет связи с сервером'}; }

  ACCESS = authRes;

  if(authRes.status === 'pending'){ renderGate('pending', authRes); return; }
  if(authRes.status !== 'approved'){ renderGate('error', authRes); return; }

  try{
    const r2 = await fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({initData: tg.initData, action:'get'})});
    const data = await r2.json();
    if(data && data.config){
      CONFIG = applyStoredConfig(data.config);
      Store.set('cfg_v2', CONFIG);
    } else {
      fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({initData: tg.initData, action:'saveConfig', config:CONFIG})}).catch(()=>{});
    }
    if(data && Array.isArray(data.history)){
      state.history = data.history;
      Store.set('history_v2', state.history);
    } else if(state.history.length){
      fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({initData: tg.initData, action:'saveHistory', history:state.history})}).catch(()=>{});
    }
  }catch(e){ /* работаем с тем, что было в localStorage, пока не появится связь */ }

  document.getElementById('routeTabs').style.display = '';
  const bn2 = document.querySelector('.bottomnav'); if(bn2) bn2.style.display = '';
  startApp();
}

bootGate();
</script>
