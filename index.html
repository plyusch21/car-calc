    // Страница скроллится сама (напр. до чека расчёта); при переключении
    // вкладки снизу нужно возвращаться к началу новой вкладки, а не
    // оставаться на том же scrollY — иначе на более коротких страницах
    // (например, история) это выглядит как "перекинуло вниз списка".
    window.scrollTo(0, 0);
  };
});
function toast(msg, ms){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), ms||1800); }
// Показ/скрытие нативного BackButton (ЗАДАНИЕ.md Блок 10). MainButton для
// "Рассчитать" не прижился — на реальном устройстве Telegram рисует его
// отдельной плашкой НИЖЕ нашего bottomnav (а не вместо него), и она не
// пряталась на вкладках "История"/"Настройки" из-за прямых вызовов
// renderContent() в обходе renderAll(). Кнопка "Рассчитать" вернулась к
// обычной, в разметке страницы, без нативного дублёра.
// syncTelegramUI вызывается после любого перехода, меняющего "куда сейчас
// смотрит пользователь" — переключение вкладки, вход/выход из подраздела
// настроек, открытие/закрытие шита.
function syncTelegramUI(){
  const tg = getTg();
  if(!tg || !tg.BackButton) return;
  const overlay = document.getElementById('sheetOverlay');
  const sheetOpen = !!(overlay && overlay.classList.contains('open'));
  const inSettingsSub = state.view==='settings' && !!state.settingsSection;
  if(sheetOpen || inSettingsSub) tg.BackButton.show(); else tg.BackButton.hide();
}
function renderAll(){ renderTabs(); renderContent(); syncTelegramUI(); }
function startApp(){ renderAll(); fetchAutoRates(); }

/* ---------------------------------------------------------------------
   12. Доступ — два способа подтвердить, кто это (ТЗ 15):
   • внутри Telegram — initData мини-приложения (как и раньше);
   • в обычном браузере (Safari/Chrome/«на экран Домой») — вход кнопкой
     «Войти через Telegram»: Telegram OpenID Connect, переход всей страницы
     на oauth.telegram.org и обратно на /?code=…&state=…, сервер
     (api/login.js) обменивает код на id_token и выдаёт сессию на 90 дней
     (localStorage bk_session_v1). Это тот же Telegram user id, что и в
     мини-приложении — те же доступы, тема, история, сделки.
   Без того и другого доступ не выдаём вовсе. См. api/_lib/access.js:
   первый, кто когда-либо откроет приложение, автоматически становится
   владельцем и может открывать/закрывать доступ остальным в «Настройках».
--------------------------------------------------------------------- */
function logout(){
  // Серверного списка сессий нет — «Выйти» просто стирает строку и
  // перезапускает страницу, bootGate() покажет экран входа.
  setSession('');
  location.replace(location.pathname);
}
async function startLogin(btn, errEl){
  if(btn){ btn.disabled = true; btn.textContent = 'Открываю Telegram…'; }
  try{
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'start'}), signal:AbortSignal.timeout(15000)});
    const d = await r.json();
    if(!r.ok || !d.url) throw new Error(d.error || 'Сервер не дал адрес входа');
    // Переход всей страницы, не window.open: в приложении «с экрана Домой»
    // на iPhone всплывающие окна ненадёжны, переход туда-обратно работает.
    location.href = d.url;
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = 'Повторить'; }
    if(errEl) errEl.textContent = (e && e.name === 'TimeoutError') ? 'Сервер не отвечает' : ((e && e.message) || 'Нет связи с сервером');
  }
}
function renderGate(kind, info){
  info = info || {};
  document.getElementById('routeTabs').style.display = 'none';
  const bn = document.querySelector('.bottomnav'); if(bn) bn.style.display = 'none';
  const c = document.getElementById('content');
  // Вне Telegram на экранах «ожидает»/«ошибка» есть «Выйти», чтобы можно
  // было войти другим аккаунтом; внутри мини-приложения выходить некуда.
  const logoutBtn = inTelegram() ? '' : `<button class="btn secondary small mt-3" id="gateLogoutBtn">Выйти</button>`;
  if(kind === 'login'){
    c.innerHTML = `<div class="emptystate login-gate">
      <img class="login-logo" src="${LOGO_URL}" alt="">
      <div class="big">Байкал Авто · Калькулятор</div>
      <button class="btn primary mt-4" id="loginBtn">Войти через Telegram</button>
      <div class="login-err" id="loginErr">${escapeHtml(info.error || '')}</div>
      <div class="login-note">Вход для сотрудников. Доступ выдаёт владелец.</div>
    </div>`;
    const btn = document.getElementById('loginBtn'), err = document.getElementById('loginErr');
    if(info.error) btn.textContent = 'Повторить';
    btn.onclick = ()=> startLogin(btn, err);
  } else if(kind === 'pending'){
    c.innerHTML = `<div class="emptystate"><div class="big">Доступ ожидает подтверждения</div>${info.name?('Здравствуйте, '+escapeHtml(info.name)+'. '):''}Владелец увидит запрос во вкладке «Настройки» и откроет доступ. Загляните чуть позже.<br><button class="btn secondary mt-4" id="recheckBtn">Проверить ещё раз</button>${logoutBtn}</div>`;
    document.getElementById('recheckBtn').onclick = ()=> location.reload();
  } else {
    c.innerHTML = `<div class="emptystate"><div class="big">Не удалось проверить доступ</div>${escapeHtml(info.error || 'Неизвестная ошибка')}<br><button class="btn secondary mt-4" id="recheckBtn">Повторить</button>${logoutBtn}</div>`;
    document.getElementById('recheckBtn').onclick = ()=> location.reload();
  }
  const lo = document.getElementById('gateLogoutBtn'); if(lo) lo.onclick = logout;
}

// Возврат с oauth.telegram.org: /?code=…&state=… (или ?error=… — отказ).
// Параметры сразу убираем из адреса, чтобы обновление страницы не
// пыталось повторить одноразовый обмен кода.
async function finishLoginFromUrl(){
  const q = new URLSearchParams(location.search);
  const code = q.get('code'), st = q.get('state'), oauthErr = q.get('error');
  if(!code && !oauthErr) return null;
  try{ history.replaceState(null, '', location.pathname + location.hash); }catch(e){}
  if(oauthErr) return { error: oauthErr === 'access_denied' ? 'Вход отменён в Telegram' : ('Telegram не подтвердил вход (' + oauthErr + ')') };
  if(!st) return { error: 'Неполный ответ от Telegram — попробуйте войти ещё раз' };
  try{
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'callback', code, state:st}), signal:AbortSignal.timeout(20000)});
    const d = await r.json();
    if(!r.ok || !d.session) return { error: d.error || 'Не удалось войти' };
    setSession(d.session);
    return { ok:true };
  }catch(e){ return { error: 'Нет связи с сервером' }; }
}

async function bootGate(){
  const tg = getTg();
  if(inTelegram()){
    // Шапка и фон Telegram — в цвет var(--bg) текущей темы (BkTheme.apply в
    // <head>, ТЗ 09); если они не совпадают с фоном, на телефоне над самим
    // приложением видна полоса другого цвета.
    try{ tg.ready(); tg.expand(); BkTheme.apply(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }catch(e){}
    // BackButton — обработчик регистрируется один раз на весь запуск приложения
    // (повторный onClick только добавлял бы новый колбэк поверх старого, а не
    // заменял его). См. ЗАДАНИЕ.md Блок 10 — MainButton для "Рассчитать" не
    // прижился (см. комментарий у syncTelegramUI) и был убран. Вне Telegram
    // кнопки назад нет — листы и подразделы закрываются кнопками на экране.
    try{
      if(tg.BackButton) tg.BackButton.onClick(()=>{
        const overlay = document.getElementById('sheetOverlay');
        if(overlay && overlay.classList.contains('open')){ closeSheet(); return; }
        if(state.view==='settings' && state.settingsSection){ state.settingsSection = null; renderSettingsView(document.getElementById('content')); return; }
      });
    }catch(e){}
  } else {
    // Обычный браузер (ТЗ 15). --tg-top-pad остаётся 0px (только --safe-top).
    const fin = await finishLoginFromUrl();
    if(fin && fin.error){ setSession(''); renderGate('login', fin); return; }
    if(!getSession()){ renderGate('login'); return; }
  }
  loadDeliveryPrefsFromCloud();
  if(inTelegram()) try{
    // Telegram рисует свои кнопки (закрыть/свернуть/⋯) поверх окна мини-приложения,
    // а не в отдельной полосе — если не оставить место, они налезают на контент.
    // С Bot API 8.0 сам Telegram кладёт точный отступ под конкретное устройство
    // в CSS-переменную --tg-content-safe-area-inset-top — используем её вместо
    // собственного вычисления. На старых клиентах переменной ещё нет, тогда
    // считаем как раньше (contentSafeAreaInset/safeAreaInset, а если и их нет —
    // разумный запас по умолчанию).
    const probe = getComputedStyle(document.documentElement)
      .getPropertyValue('--tg-content-safe-area-inset-top').trim();
    if(probe){
      document.documentElement.style.setProperty('--tg-top-pad', 'var(--tg-content-safe-area-inset-top)');
    } else {
      const inset = (tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) || (tg.safeAreaInset && tg.safeAreaInset.top) || 0;
      document.documentElement.style.setProperty('--tg-top-pad', Math.max(inset, 44) + 'px');
    }
  }catch(e){ document.documentElement.style.setProperty('--tg-top-pad', '44px'); }

  let authRes, authHttp = 0;
  try{
    const r = await fetch('/api/auth', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(authFields()), signal:AbortSignal.timeout(15000)});
    authHttp = r.status;
    authRes = await r.json();
  }catch(e){ authRes = {status:'error', error:'Нет связи с сервером'}; }

  // Вне Telegram 401 — сессия истекла или SESSION_SECRET сменили: стираем
  // её и показываем вход, а не бесконечную «Не удалось проверить доступ».
  if(!inTelegram() && authHttp === 401){ setSession(''); renderGate('login', {error:'Сессия истекла — войдите снова'}); return; }

  ACCESS = authRes;

  if(authRes.status === 'pending'){ renderGate('pending', authRes); return; }
  if(authRes.status !== 'approved'){ renderGate('error', authRes); return; }
  // Тема за аккаунтом (ТЗ 13): до этого стояла из локального кэша.
  BkTheme.sync(authRes.theme);

  try{
    const r2 = await fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...authFields(), action:'get'}), signal:AbortSignal.timeout(15000)});
    const data = await r2.json();
    CONFIG_VERSION = (data && Number.isFinite(data.configVersion)) ? data.configVersion : 0;
    if(data && data.config){
      CONFIG = applyStoredConfig(data.config);
      Store.set('cfg_v2', CONFIG);
    } else {
      fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...authFields(), action:'saveConfig', config:CONFIG, configVersion:CONFIG_VERSION})}).catch(()=>{});
    }
    if(data && Array.isArray(data.history)){
      state.history = data.history;
      Store.set('history_v2', state.history);
    } else if(state.history.length){
      fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...authFields(), action:'saveHistory', history:state.history})}).catch(()=>{});
    }
    if(data && Array.isArray(data.archive)){
      state.archive = data.archive;
      Store.set('archive_v1', state.archive);
    } else if(state.archive.length){
      fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...authFields(), action:'saveArchive', archive:state.archive})}).catch(()=>{});
    }
  }catch(e){ /* работаем с тем, что было в localStorage, пока не появится связь */ }

  document.getElementById('routeTabs').style.display = '';
  const bn2 = document.querySelector('.bottomnav'); if(bn2) bn2.style.display = '';

  // Вкладку «Сделки» показываем только тем, кому раздел открыт (сам доступ
  // всё равно проверяет сервер — здесь только про внешний вид меню).
  const dealsBtn = document.querySelector('.navbtn[data-page="/deals"]');
  if(dealsBtn && authRes.dealsLevel === 'none') dealsBtn.style.display = 'none';

  // Возврат со страницы сделок: /#history открывает сразу нужную вкладку,
  // а не главный экран, иначе кнопки «История»/«Настройки» там вели бы
  // человека не туда, куда он нажал.
  const hashView = (location.hash || '').replace('#', '');
  if(hashView === 'history' || hashView === 'settings' || hashView === 'calc'){
    state.view = hashView;
    document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view === hashView));
  }

  // Пересчёт забронированного расчёта сделки по свежим курсам — deals.html
  // кладёт route/form сюда и переходит на "/" обычной навигацией (тот же
  // Telegram WebView, та же вкладка). Разовая передача: снимаем ключ сразу,
  // чтобы обновление страницы не запускало пересчёт повторно молча.
  try{
    const raw = localStorage.getItem('bk_recalc_v1');
    if(raw){
      localStorage.removeItem('bk_recalc_v1');
      const payload = JSON.parse(raw);
      if(payload && payload.dealId && payload.calcId && CONFIG.routes[payload.route]){
        state.route = payload.route;
        state.form = Object.assign(defaultForm(payload.route), payload.form || {});
        state.formCache[payload.route] = state.form;
        state.view = 'calc';
        document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view === 'calc'));
        // ratesLock — курс инвойса, зафиксированный оплатой инвойса (ТЗ 04):
        // пока он в контексте, calcDeal считает по нему (см. lockedRates).
        RECALC_CTX = { dealId: payload.dealId, dealNum: payload.dealNum || '', calcId: payload.calcId,
          ratesLock: (payload.ratesLock && payload.ratesLock.values) ? payload.ratesLock : null };
      }
    }
  }catch(e){ /* битый payload — просто открываем калькулятор как обычно */ }

  startApp();
}

bootGate();
</script>
