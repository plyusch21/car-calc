<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Растаможка · Калькулятор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="/lib/calc.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* Тема оформления (ТЗ 09). Стоит до <style>, чтобы data-theme на <html>
   оказался на месте до первой отрисовки — без вспышки тёмного у тех, кто
   выбрал светлую. Выбор — личная настройка пользователя (ТЗ 13): хранится
   в KV access/<uid>.theme, а localStorage bk_theme_v1 = {mode:'dark'|
   'light'|'auto'} — кэш последнего известного значения, чтобы не мигало
   при открытии; нет ключа — тёмная. Не CONFIG. «auto» берёт у Telegram (или у системы) только «светло/темно»,
   палитра всегда наша. Копия этого блока — в deals.html, держать одинаковыми. */
(function(){
  var KEY = 'bk_theme_v1', BG = { dark:'#070c14', light:'#ebebee' }, memMode = null;
  function tg(){ return window.Telegram && window.Telegram.WebApp; }
  function getInitData(){ var t = tg(); return (t && t.initData) || ''; }
  // Поля авторизации для запроса к серверу (ТЗ 15): внутри Telegram —
  // initData мини-приложения, вне его — сессия из localStorage (bk_session_v1,
  // выдаёт /api/login). Копия общей authFields() ниже по файлу: этот скрипт
  // выполняется раньше неё.
  function authFields(){
    var d = getInitData(); if(d) return { initData:d };
    var sess = ''; try{ sess = localStorage.getItem('bk_session_v1') || ''; }catch(e){}
    return { session:sess };
  }
  function mode(){
    try{ var v = JSON.parse(localStorage.getItem(KEY)); if(v && /^(dark|light|auto)$/.test(v.mode)) return v.mode; }catch(e){}
    return memMode || 'dark';
  }
  function systemTheme(){
    var t = tg();
    if(t && (t.colorScheme === 'light' || t.colorScheme === 'dark')) return t.colorScheme;
    try{ return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }catch(e){ return 'dark'; }
  }
  function effective(){ var m = mode(); return m === 'auto' ? systemTheme() : m; }
  // Ставит тему на страницу и красит шапку/фон Telegram в --bg этой темы
  // (только внутри Telegram — в обычном браузере красить нечего).
  function apply(){
    var th = effective(), t = tg();
    document.documentElement.setAttribute('data-theme', th);
    try{ if(t && getInitData()){ t.setHeaderColor && t.setHeaderColor(BG[th]); t.setBackgroundColor && t.setBackgroundColor(BG[th]); } }catch(e){}
    return th;
  }
  function setMode(m){
    memMode = m;
    try{ localStorage.setItem(KEY, JSON.stringify({ mode:m })); }catch(e){}
    apply();
  }
  // Выбор уходит на сервер (api/state.js, saveTheme). Промис отклоняется
  // при ошибке — страница показывает тост, локальный выбор остаётся.
  function save(m){
    var opt = { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({ action:'saveTheme', theme:m }, authFields())) };
    try{ opt.signal = AbortSignal.timeout(15000); }catch(e){}
    return fetch('/api/state', opt).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); });
  }
  // Тема из ответа сервера при загрузке (/api/auth или bootstrap). Есть —
  // она главнее локального кэша; нет (null) — пользователь её ещё не
  // сохранял, и локальный выбор, если он не по умолчанию, один раз
  // становится аккаунтным.
  function sync(serverTheme){
    if(serverTheme === 'dark' || serverTheme === 'light' || serverTheme === 'auto'){
      if(serverTheme !== mode()){ setMode(serverTheme); if(api.onChange) try{ api.onChange(); }catch(e){} }
    } else if(mode() !== 'dark'){
      save(mode()).catch(function(){});
    }
  }
  var api = window.BkTheme = { mode:mode, effective:effective, apply:apply, setMode:setMode, save:save, sync:sync, onChange:null };
  apply();
  // Тема телефона сменилась на лету — перекрашиваемся, если выбрано «как на телефоне».
  function onSystemChange(){ if(mode() !== 'auto') return; apply(); if(api.onChange) try{ api.onChange(); }catch(e){} }
  try{ var t = tg(); if(t && t.onEvent) t.onEvent('themeChanged', onSystemChange); }catch(e){}
  try{
    var mq = matchMedia('(prefers-color-scheme: light)');
    if(mq.addEventListener) mq.addEventListener('change', onSystemChange); else if(mq.addListener) mq.addListener(onSystemChange);
  }catch(e){}
})();
</script>
<style>
:root{
  /* Оформление «Кобальт» (ТЗ 08): глубина тоном — фон → карточка → поле */
  --bg:#070c14;
  --bg-glow: radial-gradient(120% 60% at 50% -10%, #12306a 0%, transparent 60%);
  --panel: rgba(255,255,255,.045);      /* карточка */
  --panel-2: rgba(255,255,255,.07);     /* поле ввода, дорожка переключателя */
  --panel-3: rgba(255,255,255,.12);     /* дорожка л.с./кВт, дорожка тумблера */
  --border: rgba(255,255,255,.07);      /* обводка карточки */
  --line: rgba(255,255,255,.08);        /* разделители строк */
  --border-strong:#2a3b52;              /* кружки этапов, тумблеры, шит */
  --text:#eef3f8;
  --muted:#8fa4b8;
  --dim:#5f748a;
  --accent:#4a94ff;
  --accent-text:#8fc0ff;
  --accent-soft: rgba(74,148,255,.16);
  --on-accent:#07101d;
  --teal:#3ec48a;
  --teal-soft: rgba(62,196,138,.14);
  --danger:#d1573f;
  --danger-soft:#d1573f22;
  --warn:#d9b25f;
  --warn-soft:#d9b25f22;
  --good:#3ec48a;
  --card-shadow: none;                  /* в светлой глубина карточек — тенью (ТЗ 09) */
  --radius:18px;   /* карточки */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tg-top-pad: 0px; /* доп. место под кнопки закрыть/свернуть/⋯ в Telegram Mini App, см. bootGate() */
  /* Типографика — 7 ступеней, база 16px */
  --fs-xs:   0.6875rem;  /* 11px  — подписи, хинты, служебные пометки */
  --fs-sm:   0.75rem;    /* 12px  — метки полей, шапки карточек */
  --fs-base: 0.875rem;   /* 14px  — основной текст, значения полей */
  --fs-md:   1rem;       /* 16px  — имена и названия в списках */
  --fs-lg:   1.125rem;   /* 18px  — заголовки экранов и шитов */
  --fs-xl:   1.375rem;   /* 22px  — крупные числа */
  --fs-2xl:  1.75rem;    /* 28px  — итоговая сумма в чеке */
  /* Отступы — 6 ступеней */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  /* Радиусы */
  --r-sm:   12px;  /* поля ввода, сегменты */
  --r-btn:  14px;  /* кнопки */
  --r-md:   16px;  /* строки списков (сделки, история) */
  --r-pill: 99px;  /* чипы, тумблеры */
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
/* Ни один элемент не должен раздвигать страницу шире экрана (ТЗ 09, п. 0).
   clip, а не hidden, где браузер умеет: hidden делает элемент контейнером
   прокрутки, и position:sticky внутри перестаёт работать. */
html,body{ overflow-x:hidden; overflow-x:clip; }
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
/* Табличные цифры — на контейнерах приложения, не на body: карточка фото-КП
   монтируется прямо в body (renderKpImageBlob) и должна остаться как была. */
.app, .sheet, .toast{ font-variant-numeric:tabular-nums; }
/* Кобальтовый свет сверху — отдельный слой, прибитый к экрану: на iOS
   background-attachment:fixed не работает, поэтому псевдоэлемент. */
body::before{ content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; background:var(--bg-glow), var(--bg); }
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding-bottom:calc(64px + var(--safe-bottom));
  position:relative;
  overflow-x:hidden; overflow-x:clip;
}
.mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.serif{font-family:'Fraunces',serif;}

/* Шапка экрана: отступ под кнопки закрыть/свернуть/⋯ Telegram и чёлку,
   слева заголовок экрана, справа дата (только на «Расчёте») — см. renderTopbar(). */
.topbar{
  padding:calc(14px + var(--safe-top) + var(--tg-top-pad)) var(--sp-4) var(--sp-3);
  display:flex; align-items:baseline; justify-content:space-between; gap:var(--sp-3);
}
.topbar h1{ margin:0; font-family:'Fraunces',serif; font-weight:600; font-size:var(--fs-xl); line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .date{ color:var(--muted); font-size:var(--fs-sm); white-space:nowrap; }

.rate-widget{ margin-bottom:var(--sp-4); cursor:pointer; background:var(--panel); border:1px solid var(--border); border-radius:var(--r-sm); padding:9px 14px; box-shadow:var(--card-shadow); }
.rate-widget .rw-row{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:var(--sp-2); }
.rate-widget .rw-status{ display:flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-sm); justify-self:start; }
.rate-widget .rw-dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; box-shadow:0 0 0 3px color-mix(in srgb, currentColor 20%, transparent); }
.rate-widget .rw-value{ font-family:'IBM Plex Mono',monospace; font-size:var(--fs-md); font-weight:600; font-variant-numeric:tabular-nums; justify-self:center; }
.rate-widget .rw-pair{ font-size:var(--fs-xs); color:var(--dim); letter-spacing:.06em; text-transform:uppercase; justify-self:end; white-space:nowrap; }

/* Вкладки: на «Расчёте» — сегмент в одну строку (.tabs.segtabs), в
   остальных местах, где не помещаются, — тихие пилюли с прокруткой. */
.tabs{ display:flex; gap:var(--sp-2); padding:0 var(--sp-4) var(--sp-4); overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex:0 0 auto; padding:var(--sp-2) var(--sp-4); border-radius:var(--r-pill); background:var(--panel-2); border:none;
  color:var(--muted); font-size:var(--fs-sm); font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap;
}
.tab.active{ background:var(--accent-soft); color:var(--accent-text); }
.segtabs{ display:flex; gap:2px; background:var(--panel-2); border-radius:var(--r-sm); padding:3px; overflow:hidden; }
.segtabs .tab{ flex:1 1 0; min-width:0; background:transparent; border-radius:10px; padding:8px 2px; text-align:center; font-size:var(--fs-sm); font-weight:500; color:var(--muted); }
.segtabs .tab.active{ background:var(--accent); color:var(--on-accent); font-weight:600; }
.segtabs.fit .tab{ flex:1 1 auto; padding:8px 4px; }
.routeseg-wrap{ padding:0 var(--sp-4) var(--sp-4); }

.content{flex:1; padding:0 var(--sp-4) var(--sp-5);}

.card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:var(--sp-4); margin-bottom:var(--sp-4); box-shadow:var(--card-shadow); }
.card h2{
  background:linear-gradient(90deg, rgba(74,148,255,.22), rgba(74,148,255,.06)); color:#dbe8ff; text-align:center; text-transform:uppercase;
  font-size:var(--fs-sm); font-weight:600; letter-spacing:0.08em; padding:var(--sp-3) var(--sp-4);
  margin:calc(var(--sp-4) * -1) calc(var(--sp-4) * -1) var(--sp-4); border-bottom:1px solid rgba(74,148,255,.35);
  border-radius:calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
}
.receipt-title{
  background:linear-gradient(90deg, rgba(74,148,255,.26), rgba(74,148,255,.08)); color:#dbe8ff; text-align:center; text-transform:uppercase;
  font-size:var(--fs-sm); font-weight:600; letter-spacing:0.08em; padding:var(--sp-3) var(--sp-4);
  margin:0; border-bottom:1px solid rgba(74,148,255,.35); border-radius:calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;
}
.field{margin-bottom:var(--sp-3);}
.field:last-child{margin-bottom:0;}
.field label{ display:block; font-size:var(--fs-sm); color:var(--muted); margin-bottom:var(--sp-1); }
.carried-hint{ font-size:var(--fs-xs); color:var(--muted); margin-top:var(--sp-1); }
.unfilled-hint{ font-size:var(--fs-xs); color:var(--warn); margin-top:var(--sp-1); }
input.unfilled-input, select.unfilled-input{ border-color:var(--warn); border-style:dashed; }
.row2{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3);}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--sp-3);}
input[type=text], input[type=number], select, textarea{
  width:100%; background:var(--panel-2); border:1px solid transparent; color:var(--text); border-radius:var(--r-sm);
  padding:5px 10px; min-height:36px; font-size:var(--fs-base); font-family:'IBM Plex Mono',monospace; outline:none;
}
select{font-family:'Inter',sans-serif; color-scheme:dark;}
select option{ background:#0d1626; color:var(--text); }
textarea{font-family:'Inter',sans-serif; resize:vertical; padding:var(--sp-2) 10px;}
input:focus, select:focus, textarea:focus{border-color:var(--accent);}
input:disabled{ color:var(--muted); }
.textfield-btn{
  width:100%; background:var(--panel-2); border:1px solid transparent; color:var(--text); border-radius:var(--r-sm);
  padding:5px 10px; min-height:36px; font-size:var(--fs-base); font-family:'Inter',sans-serif; text-align:left; cursor:pointer;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;
}
.textfield-btn .ph{ color:var(--muted); }

.seg{ display:flex; gap:2px; background:var(--panel-2); border-radius:var(--r-sm); padding:3px; border:none; }
.seg button{ flex:1; background:transparent; border:none; color:var(--muted); padding:8px 0; border-radius:10px; font-size:var(--fs-sm); font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap; }
.seg button.active{background:var(--accent); color:var(--on-accent); font-weight:600;}

/* Поле мощности со встроенным переключателем л.с./кВт (как .input .useg в макете):
   контейнер выглядит как поле, сам <input> — без фона и обводки. */
.inputbox{ display:flex; align-items:center; gap:var(--sp-2); background:var(--panel-2); border:1px solid transparent; border-radius:var(--r-sm); min-height:36px; padding:0 6px 0 0; }
.inputbox:focus-within{ border-color:var(--accent); }
.inputbox input[type=text]{ flex:1; min-width:0; background:transparent; border:none; min-height:34px; }
.inputbox.unfilled-box{ border-color:var(--warn); border-style:dashed; }
.useg{ display:flex; flex:0 0 auto; gap:2px; background:var(--panel-3); border-radius:var(--r-pill); padding:2px; }
.useg button{ background:transparent; border:none; color:var(--muted); font-size:10.5px; line-height:1.3; padding:2px 7px; border-radius:var(--r-pill); cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap; }
.useg button.active{ background:var(--accent); color:var(--on-accent); font-weight:600; }

.toggle-row{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3);}
.advanced-toggle{ display:flex; align-items:center; justify-content:space-between; cursor:pointer; font-size:var(--fs-sm); color:var(--muted); padding:var(--sp-2) 0; }
.advanced-chevron{ transition:transform .15s ease; }
.advanced-chevron.open{ transform:rotate(90deg); }
#advancedBody{ margin-top:var(--sp-1); }
.switch{ width:40px; height:24px; border-radius:var(--r-pill); background:var(--panel-3); border:none; position:relative; cursor:pointer; flex:0 0 auto; }
.switch .knob{ position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:var(--muted); transition:left .15s; }
.switch.on{background:var(--accent);}
.switch.on .knob{left:19px; background:#fff;}

.btn{ width:100%; min-height:46px; background:linear-gradient(135deg,#5aa2ff,#2f6fe0); color:var(--on-accent); border:none; border-radius:var(--r-btn); padding:var(--sp-2) var(--sp-3); font-size:var(--fs-base); font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; box-shadow:0 8px 22px -10px rgba(74,148,255,.55); }
.btn.secondary{ background:rgba(255,255,255,.06); border:none; color:var(--muted); box-shadow:none; }
.btn.small{min-height:36px; padding:var(--sp-1) var(--sp-2); font-size:var(--fs-sm);}
.btn:disabled{ opacity:.6; }
.row3 .btn{ padding:var(--sp-2) var(--sp-1); font-size:var(--fs-sm); }
.btn-send{
  background:linear-gradient(100deg,#2c9a63,#3d86ff 55%,#7a62ff);
  color:#fff; font-weight:600; box-shadow:none; border-radius:var(--r-btn);
}
.btn-send:active{ opacity:.88; }
.send-hint{ font-size:var(--fs-xs); color:var(--muted); text-align:center; margin-top:var(--sp-2); line-height:1.4; }
.linkbtn{
  display:flex; align-items:center; justify-content:space-between; gap:var(--sp-2);
  background:var(--teal-soft); border:none; color:var(--teal);
  border-radius:var(--r-sm); padding:var(--sp-3) var(--sp-3); font-size:var(--fs-base); font-weight:600; cursor:pointer; text-decoration:none;
  margin-bottom:var(--sp-2);
}
.linkbtn:last-child{margin-bottom:0;}
.linkbtn small{display:block; font-weight:400; color:var(--teal); opacity:0.8; font-size:var(--fs-xs); margin-top:1px;}

.smartfill{ background:transparent; border:1px dashed var(--border-strong); border-radius:var(--r-sm); padding:var(--sp-3); }
.smartfill textarea{ margin-bottom:var(--sp-3); }
.smartfill .btn{ margin-bottom:0; }
.smartfill .row2 .btn{ margin-bottom:0; }
.smartfill-status{ font-size:var(--fs-xs); color:var(--muted); margin-top:var(--sp-2); }
.smartfill-status:empty{ display:none; }
.smartfill-divider{ display:flex; align-items:center; gap:var(--sp-2); margin:var(--sp-3) 0 var(--sp-3); color:var(--muted); font-size:var(--fs-xs); }
.smartfill-divider::before, .smartfill-divider::after{ content:''; flex:1; height:1px; background:var(--line); }
.filepick{
  display:flex; align-items:center; justify-content:center; text-align:center;
  background:var(--panel-2); border:1px solid transparent; border-radius:var(--r-btn); min-height:46px;
  padding:var(--sp-2) var(--sp-2); font-size:var(--fs-sm); color:var(--muted); cursor:pointer; font-family:'Inter',sans-serif;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.filepick.has-file{ color:var(--text); border-color:var(--accent); }
.smartfill-hint{ font-size:var(--fs-xs); color:var(--muted); margin-top:var(--sp-3); line-height:1.4; }

/* Чек-«билет»: тонированная шапка и перфорация — два круга цвета фона по бокам. */
.receipt{ position:relative; background:rgba(20,40,80,.35); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:var(--sp-4); }
.receipt::before, .receipt::after{ content:''; position:absolute; top:32px; width:16px; height:16px; border-radius:50%; background:var(--bg); }
.receipt::before{ left:-9px; }
.receipt::after{ right:-9px; }
#resultZone > .receipt{ margin-top:var(--sp-4); }
.receipt-head{ padding:var(--sp-4) var(--sp-4) var(--sp-2); }
.receipt-head .model{font-family:'Fraunces',serif; font-size:20px; font-weight:600; line-height:1.15;}
.receipt-head .meta{color:var(--muted); font-size:var(--fs-sm); margin-top:var(--sp-1);}
.receipt-body{padding:0 var(--sp-4);}
.rline{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:var(--fs-base); }
.rline:last-child{border-bottom:none;}
.rline .k{color:var(--muted);}
.rline .k .hint{display:block; font-size:var(--fs-xs); color:var(--dim); margin-top:1px;}
.rline .v{font-family:'IBM Plex Mono',monospace; font-weight:500; white-space:nowrap;}
/* Данные по авто в чеке (ТЗ 09, п. 0): переносятся, а не раздвигают
   страницу; nowrap остаётся только у денежных строк. «Состояние» и
   «Примечания» (.text) — абзацем под подписью, обычным шрифтом. */
.rline.car .k{ flex:0 0 auto; }
.rline.car .v{ font-weight:400; white-space:normal; min-width:0; overflow-wrap:anywhere; text-align:right; }
.rline.text{ flex-direction:column; align-items:stretch; gap:2px; }
.rline.text .v{ font-family:'Inter',sans-serif; font-weight:400; font-size:var(--fs-base); white-space:normal; overflow-wrap:anywhere; line-height:1.45; text-align:left; color:var(--text); }
.receipt-total{ margin:var(--sp-1) var(--sp-4) 0; padding:var(--sp-3) 0 var(--sp-4); display:flex; justify-content:space-between; align-items:baseline; gap:var(--sp-3); border-top:1px dashed rgba(74,148,255,.5); }
.receipt-total .lbl{font-size:var(--fs-sm); color:var(--muted); text-transform:uppercase; letter-spacing:.08em;}
.receipt-total .amt{font-family:'IBM Plex Mono',monospace; font-size:var(--fs-2xl); font-weight:600; color:var(--accent-text); white-space:nowrap;}

.bottomnav{ position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(7,12,20,.9); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line); padding-bottom:var(--safe-bottom); }
.bottomnav .inner{ max-width:480px; margin:0 auto; display:flex; }
.navbtn{ flex:1; background:none; border:none; color:var(--muted); padding:var(--sp-3) var(--sp-1) var(--sp-2); font-size:var(--fs-xs); display:flex; flex-direction:column; align-items:center; gap:var(--sp-1); cursor:pointer; font-family:'Inter',sans-serif; }
.navbtn.active{color:var(--accent);}
.navicon{width:20px; height:20px; display:block;}

.sheet-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:40; display:none; align-items:flex-end; justify-content:center; }
.sheet-overlay.open{display:flex;}
.sheet{ background:#0d1626; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; border:1px solid var(--border-strong); border-bottom:none; padding:10px 16px calc(24px + var(--safe-bottom)); }
.sheet-handle{width:36px; height:4px; background:var(--border-strong); border-radius:2px; margin:var(--sp-2) auto var(--sp-4);}
/* Кнопка ✕ в шапке листа — только вне Telegram (ТЗ 15): там нет нативной
   кнопки «назад», а не у каждого листа есть своя кнопка закрытия. */
.sheet-top{ position:relative; }
.sheet-close{ position:absolute; right:-4px; top:-2px; width:32px; height:32px; padding:0; border:none; border-radius:16px; background:rgba(255,255,255,.06); color:var(--muted); font-size:15px; line-height:32px; cursor:pointer; font-family:'Inter',sans-serif; }
.sheet h3{font-family:'Fraunces',serif; font-size:var(--fs-lg); margin:var(--sp-1) 0 var(--sp-4);}
.sub-h{font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); margin:var(--sp-4) 0 var(--sp-2);}
.sub-h:first-child{margin-top:2px;}

.tablecfg{width:100%; border-collapse:collapse; font-size:var(--fs-xs);}
.tablecfg th{text-align:left; color:var(--muted); font-weight:500; font-size:var(--fs-xs); padding:var(--sp-1) var(--sp-1);}
.tablecfg td{padding:var(--sp-1) var(--sp-1);}
.tablecfg input{padding:var(--sp-2) var(--sp-2); font-size:var(--fs-xs);}
.tablecfg td.name{font-size:var(--fs-xs); padding-right:var(--sp-2); white-space:nowrap;}

.emptystate{ text-align:center; padding:50px var(--sp-5); color:var(--muted); }
.emptystate .big{font-family:'Fraunces',serif; font-size:var(--fs-md); color:var(--text); margin-bottom:var(--sp-2);}
/* Экран входа вне Telegram (ТЗ 15): логотип, название, одна кнопка. */
.login-gate{ padding-top:calc(60px + var(--safe-top)); }
.login-gate .login-logo{ width:150px; max-width:60%; height:auto; display:block; margin:0 auto var(--sp-4); }
.login-gate .big{ font-size:var(--fs-lg); }
.login-gate .btn{ max-width:320px; margin-left:auto; margin-right:auto; }
.login-gate .login-err{ color:var(--danger, #ff6b6b); font-size:var(--fs-sm); min-height:1.2em; margin-top:var(--sp-2); }
.login-gate .login-note{ font-size:var(--fs-xs); margin-top:var(--sp-3); }

.histcard-wrap{ position:relative; border-radius:var(--r-md); overflow:hidden; margin-bottom:var(--sp-3); }
.histcard-wrap .histcard{ margin-bottom:0; }
.histcard-del{ position:absolute; top:0; right:0; bottom:0; width:88px; background:var(--danger); color:#fff; display:flex; align-items:center; justify-content:center; font-size:var(--fs-base); font-weight:600; cursor:pointer; }
/* Карточка полупрозрачная — кнопка «Удалить» под ней видна, пока карточку
   не сдвинули свайпом; прячем её до сдвига (где браузер умеет :has). */
@supports selector(:has(a)){
  .histcard-del{ visibility:hidden; }
  .histcard-wrap:has(> .histcard[style*="translateX(-"]) .histcard-del{ visibility:visible; }
}
.histcard{ position:relative; background:var(--panel); border:1px solid var(--border); border-radius:var(--r-md); padding:var(--sp-3) var(--sp-4); margin-bottom:var(--sp-3); display:flex; justify-content:space-between; align-items:center; cursor:pointer; touch-action:pan-y; will-change:transform; box-shadow:var(--card-shadow); }
.histcard .l .m{font-weight:600; font-size:var(--fs-base);}
.histcard .l .d{color:var(--muted); font-size:var(--fs-xs); margin-top:2px;}
.histcard .r{text-align:right;}
.histcard .r .t{font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--accent-text); white-space:nowrap;}
.histcard .r .c{font-size:var(--fs-xs); color:var(--muted);}

.settings-menu{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; margin-bottom:var(--sp-4); box-shadow:var(--card-shadow); }
.settings-row{ display:flex; justify-content:space-between; align-items:center; padding:var(--sp-4) var(--sp-4); cursor:pointer; border-bottom:1px solid var(--line); }
.settings-row:last-child{border-bottom:none;}
.settings-row .lbl{font-size:var(--fs-base); font-weight:500;}
.settings-row .arrow{color:var(--muted); font-size:var(--fs-lg);}
.settings-row .check{color:var(--accent-text); font-size:var(--fs-md); font-weight:600; min-width:1em; text-align:right;}
/* Настройки → Тема оформления (ТЗ 09) */
.theme-auto .t{font-size:var(--fs-base); font-weight:500;}
.theme-auto .h{font-size:var(--fs-xs); color:var(--muted); margin-top:2px;}
.theme-list{ margin:var(--sp-4) 0 0; }
.theme-list.auto .settings-row{ opacity:.5; }

.toast{ position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:var(--sp-3) var(--sp-4); border-radius:var(--r-sm); font-size:var(--fs-base); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s; }
.toast.show{opacity:1;}

.notice{ background:var(--danger-soft); border:1px solid var(--danger); color:var(--danger); border-radius:var(--r-sm); padding:var(--sp-3) var(--sp-3); font-size:var(--fs-sm); margin-bottom:var(--sp-3); line-height:1.45; }
.notice.info{background:var(--teal-soft); border-color:var(--teal); color:var(--teal);}
.notice.warn{background:var(--warn-soft); border-color:var(--warn); color:var(--warn);}
.src-line{font-size:var(--fs-xs); color:var(--muted); margin-top:var(--sp-2); line-height:1.5; word-break:break-all;}
.src-line b{color:var(--text);}

/* -----------------------------------------------------------------------
   Фото-КП клиенту — рисуется офф-скрин и превращается в JPEG (html2canvas).
   Дизайн «Кобальт», макет ТЗ/14-макет-фото-кп.html (сборка D1).
   Цвета захардкожены (не через переменные темы приложения): картинка одна
   и та же независимо от того, тёмная тема сейчас в калькуляторе или нет.
   Ширина 1080 px, мелкий текст не меньше 17 px — мессенджеры ужимают
   картинку примерно вдвое по ширине, и 14 px после сжатия не читались.
----------------------------------------------------------------------- */
.kp-card{ width:1080px; font-family:'Inter',sans-serif; background:#ebebee; color:#15171e; }
.kp-hero{ background:linear-gradient(160deg,#0d1626 0%,#12306a 70%,#1a4db5 100%); padding-bottom:36px; }
.kp-header{ padding:40px 48px 28px; display:flex; align-items:center; justify-content:space-between; gap:26px; border-bottom:3px solid rgba(102,179,66,.75); }
.kp-header-left{ display:flex; align-items:center; gap:26px; }
.kp-logo{ height:64px; display:block; }
.kp-header-div{ width:2px; align-self:stretch; background:rgba(255,255,255,.22); }
.kp-h-title{ color:#eef3f8; font-size:36px; font-weight:800; }
.kp-h-route{ color:#fff; background:rgba(255,255,255,.14); padding:10px 20px; border-radius:99px; font-size:24px; font-weight:700; white-space:nowrap; }
.kp-model{ padding:32px 48px 0; }
.kp-model-label{ color:#8fc0ff; font-size:16px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
.kp-model-name{ color:#fff; font-size:46px; font-weight:800; margin-top:6px; line-height:1.2; }
.kp-stats{ display:flex; gap:16px; padding:28px 48px 0; }
.kp-stat{ flex:1; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); border-radius:14px; padding:20px 22px; text-align:center; }
.kp-stat-l{ color:rgba(255,255,255,.7); font-size:16px; font-weight:600; letter-spacing:.03em; }
.kp-stat-v{ color:#fff; font-size:30px; font-weight:700; margin-top:8px; font-variant-numeric:tabular-nums; }
.kp-section{ padding:32px 48px 0; }
.kp-h2{ font-size:27px; font-weight:700; margin-bottom:16px; }
.kp-card-white{ background:#fff; border-radius:18px; padding:6px 30px; box-shadow:0 2px 4px rgba(20,22,30,.06), 0 18px 34px -18px rgba(20,22,30,.45); }
.kp-row{ display:flex; align-items:flex-start; gap:20px; padding:26px 0; position:relative; }
.kp-row:not(.kp-row-last)::before{ content:''; position:absolute; left:22px; top:72px; bottom:-26px; width:2px; background:#c9d6f5; }
.kp-badge{ flex:0 0 auto; width:46px; height:46px; border-radius:50%; background:#fff; border:3px solid #1f56c9; color:#1f56c9; font-weight:800; font-size:21px; display:flex; align-items:center; justify-content:center; position:relative; }
.kp-row-body{ flex:1; min-width:0; }
.kp-row-title{ font-weight:600; font-size:22px; }
.kp-row-sub{ color:#444a57; font-size:18px; margin-top:4px; }
.kp-row-amt{ font-weight:700; font-size:25px; white-space:nowrap; padding-top:2px; font-variant-numeric:tabular-nums; }
.kp-sub-items{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
.kp-sub-item{ display:flex; justify-content:space-between; gap:16px; font-size:18px; color:#444a57; }
.kp-sub-item b{ color:#15171e; font-weight:600; white-space:nowrap; }
.kp-total{ margin:24px 48px 0; background:linear-gradient(135deg,#12306a,#1f56c9); border-radius:18px; padding:28px 30px; box-shadow:0 18px 34px -18px rgba(31,86,201,.7); }
.kp-total-row{ display:flex; align-items:center; justify-content:space-between; gap:20px; }
.kp-total-label{ color:#fff; font-size:28px; font-weight:800; letter-spacing:.02em; }
.kp-total-note{ color:rgba(255,255,255,.72); font-size:17px; margin-top:6px; }
.kp-total-right{ text-align:right; flex:0 0 auto; }
.kp-total-amt{ color:#fff; font-size:46px; font-weight:800; white-space:nowrap; font-variant-numeric:tabular-nums; }
.kp-badge-pill{ margin-top:8px; display:inline-block; background:rgba(255,255,255,.18); color:#fff; font-size:16px; font-weight:700; padding:8px 16px; border-radius:99px; white-space:nowrap; }
.kp-insurance{ margin:20px 48px 0; background:#fff7e6; border-left:5px solid #c98a1f; border-radius:14px; padding:20px 26px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
.kp-ins-title{ color:#8a5a12; font-weight:700; font-size:19px; }
.kp-ins-sub{ color:#8f7a4a; font-size:17px; margin-top:4px; line-height:1.5; }
.kp-ins-amt{ color:#15171e; font-weight:800; font-size:24px; white-space:nowrap; }
.kp-params .kp-prow{ padding:18px 0; border-bottom:1px solid #dcdde3; display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
.kp-params .kp-prow:last-child{ border-bottom:none; }
.kp-prow-2{ display:flex; gap:40px; }
.kp-prow-2>div{ flex:1; display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
.kp-plabel{ color:#33394a; font-size:18px; font-weight:600; }
.kp-pval{ font-weight:600; font-size:19px; text-align:right; }
.kp-pval-wrap{ text-align:right; font-weight:600; max-width:640px; line-height:1.5; }
.kp-footer{ margin-top:36px; background:#0d1626; color:#8fa4b8; font-size:17px; text-align:center; line-height:1.6; padding:26px 48px; }

/* Утилитарные классы — шкала отступов/шрифтов, см. tools/mapgen.sh note in CLAUDE.md */
.mt-2{margin-top:var(--sp-2);}   .mb-2{margin-bottom:var(--sp-2);}
.mt-3{margin-top:var(--sp-3);}   .mb-3{margin-bottom:var(--sp-3);}
.mt-4{margin-top:var(--sp-4);}   .mb-4{margin-bottom:var(--sp-4);}
.u-hint{font-size:var(--fs-sm); color:var(--muted);}
.u-note{font-size:var(--fs-base); color:var(--muted); line-height:1.5; margin:0 0 var(--sp-5);}
.btn.compact{width:auto; padding:var(--sp-1) var(--sp-2);}
.btn.danger{ background:var(--danger); }
/* -----------------------------------------------------------------------
   Светлая тема «Кобальт» (ТЗ 09, макет ТЗ/08-макет-кобальт.html, .vAl).
   Те же переменные — другие значения; ниже — то, что отличается правилом,
   а не значением: плотный шрифт, тени, белая пилюля активного сегмента.
   Фото-КП (.kp-*) сюда не входит — у него свои цвета.
----------------------------------------------------------------------- */
:root[data-theme="light"]{
  --bg:#ebebee;
  --bg-glow: radial-gradient(120% 45% at 50% -10%, #c9d6f5 0%, rgba(201,214,245,0) 60%);
  --panel:#ffffff;  --panel-2:#eeeef1;  --panel-3:#e0e0e5;
  --border: transparent;                 /* обводки карточек нет — глубина тенью */
  --card-shadow: 0 2px 4px rgba(20,22,30,.06), 0 18px 34px -18px rgba(20,22,30,.45);
  --line:#dcdde3;  --border-strong:#c5cbd6;
  --text:#15171e;  --muted:#444a57;  --dim:#6f7583;
  --accent:#1f56c9;  --accent-text:#1a4db5;  --accent-soft:#e7efff;  --on-accent:#ffffff;
  --teal:#178a55;  --good:#178a55;  --teal-soft: rgba(23,138,85,.14);
  --danger:#c94b34;  --danger-soft: rgba(201,75,52,.12);  --warn:#a8811a;  --warn-soft: rgba(168,129,26,.14);
}
/* Шапка экрана, карточки */
[data-theme="light"] .topbar .date{ color:#444a57; font-weight:500; }
[data-theme="light"] .card h2{ font-weight:700; color:#33394a; background:#f4f4f6; border-bottom:1px solid #e6e6ea; }
/* Поля */
[data-theme="light"] .field label{ color:#33394a; font-weight:600; }
[data-theme="light"] input[type=text], [data-theme="light"] input[type=number], [data-theme="light"] select, [data-theme="light"] textarea, [data-theme="light"] .textfield-btn, [data-theme="light"] .inputbox{
  border:1px solid #d9d9df; box-shadow:inset 0 1px 2px rgba(18,30,51,.07);
}
[data-theme="light"] input[type=text], [data-theme="light"] input[type=number], [data-theme="light"] select, [data-theme="light"] .textfield-btn{ font-weight:600; }
[data-theme="light"] .inputbox input[type=text]{ border:none; box-shadow:none; }
[data-theme="light"] input:focus, [data-theme="light"] select:focus, [data-theme="light"] textarea:focus, [data-theme="light"] .inputbox:focus-within{ border-color:var(--accent); }
[data-theme="light"] input.unfilled-input, [data-theme="light"] select.unfilled-input, [data-theme="light"] .inputbox.unfilled-box{ border-color:var(--warn); border-style:dashed; }
[data-theme="light"] select{ color-scheme:light; }
[data-theme="light"] select option{ background:#fff; }
/* Сегменты: маршруты, возраст, л.с./кВт — активный белой пилюлей */
[data-theme="light"] .seg, [data-theme="light"] .segtabs, [data-theme="light"] .useg{ background:#dedfe5; box-shadow:inset 0 1px 2px rgba(18,30,51,.08); }
[data-theme="light"] .seg button, [data-theme="light"] .segtabs .tab, [data-theme="light"] .useg button{ font-weight:600; color:#444a57; }
[data-theme="light"] .seg button.active, [data-theme="light"] .segtabs .tab.active, [data-theme="light"] .useg button.active{ background:#fff; color:#1a4db5; box-shadow:0 1px 3px rgba(18,30,51,.22); }
/* Тумблер */
[data-theme="light"] .switch{ background:#dedfe5; }
[data-theme="light"] .switch .knob{ background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); }
[data-theme="light"] .switch.on{ background:var(--accent); }
/* Кнопки */
[data-theme="light"] .btn{ background:#1f56c9; color:#fff; box-shadow:0 1px 2px rgba(31,86,201,.35), 0 10px 20px -10px rgba(31,86,201,.65); }
[data-theme="light"] .btn.secondary{ background:#f0f0f3; color:#33394a; font-weight:600; box-shadow:none; }
[data-theme="light"] .btn.danger{ background:var(--danger); box-shadow:none; }
[data-theme="light"] .btn-send{ background:linear-gradient(100deg,#2f8f62,#3b78d6 55%,#6f66d9); box-shadow:0 8px 18px -10px rgba(59,120,214,.6); }
/* Виджет курса */
[data-theme="light"] .rate-widget .rw-status{ color:#444a57; font-weight:500; }
[data-theme="light"] .rate-widget .rw-value{ font-weight:700; }
[data-theme="light"] .rate-widget .rw-dot{ box-shadow:0 0 0 3px color-mix(in srgb, currentColor 18%, transparent); }
/* Чек */
[data-theme="light"] .receipt{ background:#fff; border:1px solid #d3dff4; box-shadow:0 2px 4px rgba(18,30,51,.05), 0 20px 36px -20px rgba(26,77,181,.55); }
[data-theme="light"] .receipt::before, [data-theme="light"] .receipt::after{ border:1px solid #d3dff4; }
[data-theme="light"] .receipt-title{ background:#e8efff; color:#1a3f8f; font-weight:700; border-bottom:1px solid #d3dff4; }
[data-theme="light"] .receipt-head .model{ color:#0d1a33; }
[data-theme="light"] .receipt-head .meta{ color:#444a57; font-weight:500; }
[data-theme="light"] .rline{ border-bottom-color:#dcdde3; }
[data-theme="light"] .rline .k{ color:#33394a; font-weight:500; }
[data-theme="light"] .rline .v{ font-weight:600; }
[data-theme="light"] .rline.car .v{ font-weight:500; }
[data-theme="light"] .rline.text .v{ font-weight:500; }
[data-theme="light"] .receipt-total{ border-top:1px dashed #a9c0ea; }
[data-theme="light"] .receipt-total .lbl{ color:#33394a; font-weight:600; }
[data-theme="light"] .receipt-total .amt{ color:#1a4db5; font-weight:700; }
/* Списки, нижнее меню, шит */
[data-theme="light"] .histcard .l .m{ font-weight:600; }
[data-theme="light"] .histcard .r .t{ font-weight:700; }
[data-theme="light"] .settings-row .lbl{ font-weight:600; }
[data-theme="light"] .bottomnav{ background:#ffffff; border-top:1px solid #e0e6ef; box-shadow:0 -8px 20px -16px rgba(18,30,51,.35); }
[data-theme="light"] .navbtn{ font-weight:500; }
[data-theme="light"] .navbtn.active{ color:var(--accent); }
[data-theme="light"] .sheet{ background:#fff; border-color:#e3e3e8; box-shadow:0 -10px 30px -20px rgba(0,0,0,.35); }
[data-theme="light"] .sheet-handle{ background:#c5cbd6; }
[data-theme="light"] .sheet-close{ background:#f0f0f3; color:#33394a; }
/* Логотип logo-kp.png — белые буквы без фона; в светлой теме ему нужна
   кобальтовая плашка (как шапка фото-КП), иначе его не видно. */
[data-theme="light"] .login-gate .login-logo{ background:linear-gradient(135deg,#1f56c9,#163f95); border-radius:16px; padding:14px 18px; box-sizing:content-box; }
/* Меню «Тема оформления» стоит внутри карточки — вторая тень там лишняя. */
[data-theme="light"] .card .settings-menu{ box-shadow:none; border:1px solid #e6e6ea; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar"><h1 id="screenTitle"></h1><span class="date" id="screenDate"></span></div>
  <div class="routeseg-wrap" id="routeTabs"></div>
  <div class="content" id="content"></div>
</div>

<div class="bottomnav">
  <div class="inner">

<script>
/* =========================================================================
   CAR IMPORT COST CALCULATOR — internal tool

   - Duty (пошлина) and utilisation fee (утилизационный сбор) are computed
     automatically, server-side, by submitting the same inputs to
     alta.ru/auto-vat/ (api/customs.js) and reading the numbers back off
     its result table. Why alta.ru and not tks.ru/auto/calc directly:
     tks.ru's own calculator form is protected by an anti-bot "cap" widget
     (proof-of-work captcha) — automating past that would mean bypassing
     bot-detection, which this app won't do, and TKS's separate paid
     "Расчёт авто" API product has no published request/response docs to
     build against safely. alta.ru is a free, non-captcha calculator that
     cites and applies the exact same legal sources tks.ru's own page names
     (Решение Совета ЕЭК №107 от 20.12.2017 for duty, Постановление
     Правительства РФ №1291 от 26.12.2013 for the utilisation fee) — so it
     is, in practice, the same official numbers. The util fee in particular
     is NOT a flat figure any more (a 2024+ reform made it depend on engine
     volume and power brackets too), which is exactly why this proxies live
     instead of hard-coding a rate table that would go stale.
     Both fields stay editable after the auto-fetch — manual correction
     always wins until the next "Рассчитать" tap.
   - Currency rates are always pulled from the specific sources below via
     a small server-side proxy (api/rates.js) because these sites cannot
     be fetched directly from a browser (no CORS). Each rate has its own
     manual-override switch (see openRateEditor) — when it's on, the
     manual value is used and further auto-refreshes no longer overwrite
     it until you turn the switch back off.
       ЮАНЬ/₽   — VTB Online currency-rates API (public JSON, no auth —
                   see api/rates.js header for how the TLS/robots.txt
                   assumptions that used to block this were wrong)
       ЙЕНА/₽   — ATB "для денежных переводов" exchange page
       USDT/ВОНА— Naver search result for "usdt"  (raw value − 5)
       USDT/₽   — Investing.com USDT/RUB page      (raw value + 3)
   ========================================================================= */

const memStore = {};
const Store = {
  get(key, fallback){ try{ const raw=localStorage.getItem(key); if(raw!=null) return JSON.parse(raw);}catch(e){} return key in memStore?memStore[key]:fallback; },
  set(key, val){ memStore[key]=val; try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
};

// Город/тип кузова доставки запоминаются между расчётами — личная привычка
// того, кто считает (обычно возит из одного города), не общая настройка
// организации (для тех живёт /api/state), поэтому Telegram.WebApp.
// CloudStorage — общее между устройствами хранилище САМОГО пользователя, с
// откатом на localStorage там, где CloudStorage недоступен. Сам тумблер
// «Учитывать доставку по РФ» при этом остаётся выключенным по умолчанию —
// запоминаем только куда/каким кузовом, а не включаем доставку сама по себе.
let SAVED_DELIVERY_PREFS = Store.get('delivery_prefs_v1', null);
function saveDeliveryPrefs(city, bodyTypeIdx){
  const prefs = { city, bodyTypeIdx };
  SAVED_DELIVERY_PREFS = prefs;
  Store.set('delivery_prefs_v1', prefs);
  // Вне Telegram (ТЗ 15) CloudStorage нет — скрипт Telegram пишет об этом
  // ошибку в консоль, поэтому даже не пробуем; остаётся localStorage.
  if(!inTelegram()) return;
  try{
    const cs = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage;
    if(cs && cs.setItem) cs.setItem('delivery_prefs_v1', JSON.stringify(prefs));
  }catch(e){}
}
function loadDeliveryPrefsFromCloud(){
  if(!inTelegram()) return;
  try{
    const cs = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.CloudStorage;
    if(!cs || !cs.getItem) return;
    cs.getItem('delivery_prefs_v1', (err, val)=>{
      if(err || !val) return;
      try{
        const parsed = JSON.parse(val);
        const hadLocal = !!SAVED_DELIVERY_PREFS;
        SAVED_DELIVERY_PREFS = parsed;
        Store.set('delivery_prefs_v1', parsed);
        // Локального кэша ещё не было — форма уже открылась со стандартным
        // городом (см. defaultForm), донастраиваем её тоже, раз владелец
        // ещё явно её не трогал, а не только следующий расчёт.
        if(!hadLocal && state.form){
          if(parsed.city) state.form.deliveryCity = parsed.city;
          if(parsed.bodyTypeIdx!=null) state.form.bodyTypeIdx = parsed.bodyTypeIdx;
          if(state.view==='calc') renderCalc(document.getElementById('content'));
        }
      }catch(e){}
    });
  }catch(e){}
}

/* ---------------------------------------------------------------------
   1. Default configuration
--------------------------------------------------------------------- */
// DEFAULT_CONFIG (маршруты, курсы, таблица доставки), слияние с сохранёнными
// настройками (mergeRatesState/mergeRoutesState/deepMerge — только реально
// редактируемые поля берутся из сохранённого, остальное всегда из кода) и
// сама формула живут в lib/calc.js (подключён в <head>), чтобы страница
// сделок считала тем же кодом. Здесь — псевдонимы с прежними именами.
const DEFAULT_CONFIG = BkCalc.DEFAULT_CONFIG;
function applyStoredConfig(stored){ return BkCalc.applyStoredConfig(stored); }

let CONFIG = applyStoredConfig(Store.get('cfg_v2', null));

// Доступ и синхронизация между устройствами через Telegram Mini App —
// см. bootGate() в конце файла и api/auth.js, api/state.js, api/admin.js.
// ACCESS = null, пока проверка не завершилась; иначе {status, isOwner, name}.
let ACCESS = null;
// Заполняется в bootGate() при переходе из карточки сделки "пересчитать по
// курсам" — пока не null, showResult() предлагает один объединённый пункт
// "сохранить в сделку и отправить" вместо обычных "сохранить в
// историю"/"отправить в мессенджер". См. api/deals.js action recalcDealCalc.
let RECALC_CTX = null;
function getInitData(){ return (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || ''; }
function getTg(){ return window.Telegram && window.Telegram.WebApp; }
// Внутри Telegram — есть initData; в обычном браузере (Safari/Chrome/«на
// экран Домой», ТЗ 15) объект Telegram.WebApp есть, но initData пустой.
function inTelegram(){ return !!getInitData(); }
// Сессия приложения для входа вне Telegram — выдаёт /api/login после входа
// через Telegram OpenID Connect, 90 дней (см. api/_lib/session.js).
const SESSION_KEY = 'bk_session_v1';
function getSession(){ try{ return localStorage.getItem(SESSION_KEY) || ''; }catch(e){ return ''; } }
function setSession(s){ try{ if(s) localStorage.setItem(SESSION_KEY, s); else localStorage.removeItem(SESSION_KEY); }catch(e){} }
// Единственный источник полей авторизации для ЛЮБОГО запроса к серверу:
// {initData} внутри Telegram, {session} вне его. Ни одного fetch к /api без
// ...authFields() — сервер (authenticate в api/_lib/access.js) принимает оба.
function authFields(){ const d = getInitData(); return d ? { initData:d } : { session:getSession() }; }
// Нативная обратная связь (ЗАДАНИЕ.md Блок 10) — тонкая обёртка, т.к. вне
// настоящего Telegram-клиента HapticFeedback отсутствует и не должен ронять
// остальной код.
function tgHaptic(kind, style){
  try{
    const tg = getTg();
    if(!tg || !tg.HapticFeedback || !inTelegram()) return;
    if(kind==='notification') tg.HapticFeedback.notificationOccurred(style||'success');
    else if(kind==='selection') tg.HapticFeedback.selectionChanged();
    else tg.HapticFeedback.impactOccurred(style||'light');
  }catch(e){}
}

// Заполненной считаем форму, в которую человек уже что-то ввёл руками или
// распознал из объявления. Поля, которые переносятся между расчётами
// (объём, мощность, тип двигателя, возраст, привод, трансмиссия), сами по
// себе заполненности не означают — они остаются после каждой отправки.
function formHasData(f){
  return ['model','carPrice','extraCosts','mileage','carTrim','listingText','condition','notes']
    .some(k => String(f[k] || '').trim() !== '');
}
function updateClosingGuard(){
  const tg = getTg();
  if(!tg || !tg.enableClosingConfirmation) return;
  if(formHasData(state.form)) tg.enableClosingConfirmation();
  else tg.disableClosingConfirmation();
}

let configSyncTimer = null;
// Версия настроек для оптимистичной блокировки (ЗАДАНИЕ.md Блок 9) — растёт
// на каждое успешное сохранение на сервере (api/state.js), присылается назад
// сервером. Настройки общие на всю организацию — без этой проверки кто-то,
// кто открыл приложение раньше и ещё не сохранился, мог тихо затереть более
// свежую правку другого менеджера.
let CONFIG_VERSION = 0;
function saveConfig(){
  Store.set('cfg_v2', CONFIG);
  if(ACCESS && ACCESS.status==='approved'){
    clearTimeout(configSyncTimer);
    configSyncTimer = setTimeout(async ()=>{
      try{
        const res = await fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...authFields(), action:'saveConfig', config:CONFIG, configVersion:CONFIG_VERSION})});
        const data = await res.json();
        if(res.ok && data.ok){ CONFIG_VERSION = data.configVersion; }
        else if(res.status===409){ toast(data.error || 'Настройки изменил кто-то другой — перезагрузите приложение'); }
      }catch(e){}
    }, 600);
  }
}
function saveHistory(){
  Store.set('history_v2', state.history);
  if(ACCESS && ACCESS.status==='approved'){
    fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...authFields(), action:'saveHistory', history:state.history})}).catch(()=>{});
  }
}
// Архив — отдельный от истории ключ (см. api/state.js): сюда автоматически,
// без нажатия кнопок, попадает КАЖДЫЙ расчёт, доведённый до результата
// (см. pushArchive в showResult), капа в 50 хватает с запасом на "что я
// вообще считал сегодня", не заменяет осознанное "Сохранить в историю".
function saveArchive(){
  Store.set('archive_v1', state.archive);
  if(ACCESS && ACCESS.status==='approved'){
    fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...authFields(), action:'saveArchive', archive:state.archive})}).catch(()=>{});
  }
}

/* ---------------------------------------------------------------------
   2. State
--------------------------------------------------------------------- */
const state = { view:'calc', route:'china', history: Store.get('history_v2', []), archive: Store.get('archive_v1', []), form: defaultForm('china'), formCache: {}, settingsSection: null };

function defaultForm(route){
  const r = CONFIG.routes[route];
  return {
    model:'', carPrice:'', extraCosts:r.defaultExtraCosts||'', volumeCm3:'', age:'t3to5',
    engineType:'ben', power:'', powerUnit:'ls',
    customsAuto:'', customsManual:'', customsOverride:false, eaeuFullDuty:false,
    customsValueOverride:false, customsValueManual:'',
    deliveryCity: (SAVED_DELIVERY_PREFS && SAVED_DELIVERY_PREFS.city) || (CONFIG.delivery.cities[0] ? CONFIG.delivery.cities[0].name : ''),
    bodyTypeIdx: (SAVED_DELIVERY_PREFS && SAVED_DELIVERY_PREFS.bodyTypeIdx!=null) ? SAVED_DELIVERY_PREFS.bodyTypeIdx : 1,
    deliveryOverride:false, deliveryManual:'', deliveryEnabled:false,
    brokerFee: r.brokerFee, agentFee: r.agentFee, bankPct: r.bankCommissionPct,
    showCarDetails:false,
    carTrim:'', prodMonth:'', prodYear:'', mileage:'', drivetrain:'', transmission:'', condition:'', notes:'',
    listingText:''
  };
}
// Поля, которые НЕ чистятся при сбросе формы после отправки/сохранения
// (см. resetAfterDone в showResult) — двигатель/привод обычно тот же в
// рамках одной сессии подбора для клиента, а не переспрашивать заново.
const FORM_CARRY_FIELDS = ['volumeCm3','power','powerUnit','engineType','age','drivetrain','transmission'];
const ENGINE_TYPES = BkCalc.ENGINE_TYPES;
const TRANSMISSION_LABELS = { auto:'Автомат', robot:'Робот', variator:'Вариатор', reductor:'Редуктор', manual:'Механика' };
const DRIVETRAIN_LABELS = { front:'Передний', rear:'Задний', full:'Полный' };

/* ---------------------------------------------------------------------
   3. Helpers
--------------------------------------------------------------------- */
const NBSP_THIN = '\u202f'; // узкий неразрывный пробел (U+202F)
// Своя группировка по тысячам этим символом — не полагаемся на
// toLocaleString('ru-RU'), т.к. в WebView Telegram (особенно на Android)
// локальные данные ICU часто старее и группируют обычным широким пробелом.
function groupInt(digits){ return digits.replace(/\B(?=(\d{3})+(?!\d))/g, NBSP_THIN); }
function fmt(n, suffix){
  if(n===null||n===undefined||isNaN(n)) return '—';
  const rounded = Math.round(n);
  return (rounded<0?'-':'')+groupInt(Math.abs(rounded).toString())+(suffix?(' '+suffix):'');
}
function num(v){ return BkCalc.num(v); }
// Изменение любого поля, от которого зависит запрос в TKS (цена, объём,
// мощность, тип двигателя, возраст, каталожная стоимость, полная пошлина
// ЕАЭС) — сбрасывает уже посчитанную таможню и прячет чек. Иначе после
// правки цены клиенту может уйти КП с таможней, посчитанной для СТАРОЙ
// цены — тихая и дорогая ошибка (см. ЗАДАНИЕ.md Блок 4). Если включено
// «Указать вручную» — это значение владельца, не трогаем.
function invalidateCustomsAuto(f){
  if(f.customsOverride) return;
  f.customsAuto = '';
  const zone = document.getElementById('resultZone');
  if(zone) zone.innerHTML = '';
}
// Возраст по дате выпуска (ЗАДАНИЕ.md Блок 10) — меньше 36 мес. → lt3,
// меньше 60 → t3to5, иначе gt5. Месяц может быть неизвестен (распознавание
// иногда находит только год) — берём середину года: в пределах трёхлетних
// бакетов ошибиться из-за этого можно только у самой границы, а не имея
// месяца вообще точнее не посчитать.
function computeAgeFromDate(prodYear, prodMonth){
  const year = parseInt(prodYear, 10);
  if(!year) return null;
  const month = parseInt(prodMonth, 10) || 6;
  const months = (new Date().getFullYear() - year) * 12 + (new Date().getMonth() - (month - 1));
  if(months < 36) return 'lt3';
  if(months < 60) return 't3to5';
  return 'gt5';
}
// Дата "побеждает" ручной выбор при каждом СВОЁМ изменении (см. вызовы у
// f_prodMonth/f_prodYear), а ручной выбор в сегменте "Возраст автомобиля"
// побеждает дату вплоть до следующей её правки — f._ageAuto отслеживает,
// кто сейчас главный, чтобы подпись под сегментом не врала.
function applyAgeFromDate(f){
  const computed = computeAgeFromDate(f.prodYear, f.prodMonth);
  if(computed){ f.age = computed; f._ageAuto = true; }
}
// Живое форматирование числовых полей ввода той же группировкой — формат
// только отображается, а в состояние формы (f[key]) всегда пишется «чистое»
// значение без пробелов, которое понимает num().
function formatNumInput(raw){
  const s = String(raw==null?'':raw).replace(/[^\d.,]/g,'');
  if(!s) return '';
  const parts = s.split(/[.,]/);
  const intPart = groupInt(parts[0]||'');
  return parts.length>1 ? intPart+','+parts.slice(1).join('') : intPart;
}
function cleanNumInput(v){ return String(v==null?'':v).replace(/[^\d.,]/g,''); }
const GROUPED_NUM_FIELDS = ['carPrice','extraCosts','volumeCm3','power','mileage','customsManual','deliveryManual','brokerFee','agentFee','customsValueManual'];
// Экранируем и кавычки, не только &/</> — escapeHtml используется в том
// числе внутри атрибутов (value="${escapeHtml(...)}"), а не только в тексте;
// без этого кавычка в распознанном тексте объявления обрезала бы значение
// атрибута — именно тот баг, который и правит это место (ЗАДАНИЕ.md Блок 10).
function escapeHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function openExternal(url){
  // openLink есть у объекта и в обычном браузере (скрипт подключён всегда),
  // но работает только внутри Telegram — вне его обычная новая вкладка.
  const tg = getTg();
  if(tg && tg.openLink && inTelegram()){ tg.openLink(url); }
  else{ window.open(url, '_blank'); }
}

/* ---------------------------------------------------------------------
   4. Currency rates — fetch via server-side proxy, manual always wins
--------------------------------------------------------------------- */
// Коридор правдоподобия и порог "скачка" — ЗАДАНИЕ.md Блок 8. Значение вне
// коридора вообще не применяется; скачок больше 15% от прошлого авто-курса —
// тоже, вместо тихой подмены. "Застой 3 дня" здесь не проверяем — для этого
// нужна история за несколько дней, а не одно свежее значение; это делает
// ежедневный сторож (api/rates-refresh.js), у которого есть доступ к истории.
const RATE_CORRIDORS = { JPY:[0.3,0.9], CNY:[8,20], KRW_USDT:[1000,2000], USDT_RUB:[50,200] };
const RATE_SPIKE_PCT = 15;

// Лог истории — best-effort, не блокирует и не валит обновление курса, если
// не получилось записать (см. api/_lib/rateHistory.js).
function logRateHistory(id, r){
  if(!(ACCESS && ACCESS.status==='approved')) return;
  fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
    ...authFields(), action:'logRate', rateId:id, entry:{raw:r.autoRaw, value:r.value, source:'auto'}
  })}).catch(()=>{});
}

function applyAutoRate(id, r, raw){
  const corridor = RATE_CORRIDORS[id];
  if(corridor && (raw < corridor[0] || raw > corridor[1])){
    r.fetchError = true; r.problemFlag = true; r.rejectedRaw = raw;
    r.problemReason = 'вне коридора правдоподобия ('+corridor[0]+'–'+corridor[1]+'): получено '+raw;
    return;
  }
  // Сравниваем с прошлым АВТО-значением (не с r.raw — при включённой ручной
  // корректировке там значение владельца, а не то, с чем сравнивать новое
  // авто). r.updatedAt пуст, пока не было ни одного настоящего успешного
  // автообновления (в отличие от autoRaw — у него всегда есть значение-
  // заглушка из кода), поэтому именно им отличаем "есть с чем сравнивать"
  // от "это первое обновление вообще".
  if(r.updatedAt!=null && r.autoRaw>0){
    const diffPct = Math.abs(raw - r.autoRaw) / r.autoRaw * 100;
    if(diffPct > RATE_SPIKE_PCT){
      r.fetchError = true; r.problemFlag = true; r.rejectedRaw = raw;
      r.problemReason = 'скачок больше 15% (было '+r.autoRaw+', стало '+raw+')';
      return;
    }
  }
  r.problemFlag = false; r.problemReason = null; r.rejectedRaw = null;
  r.autoRaw = raw; r.autoUpdatedAt = Date.now(); r.fetchError = false;
  if(!r.manualOverride){ r.raw = raw; r.value = raw + r.adjustment; r.updatedAt = r.autoUpdatedAt; }
  logRateHistory(id, r);
}

async function fetchAutoRates(){
  const proxyTargets = Object.keys(CONFIG.rates).filter(id => CONFIG.rates[id].autoAvailable && !CONFIG.rates[id].direct);
  const directTargets = Object.keys(CONFIG.rates).filter(id => CONFIG.rates[id].autoAvailable && CONFIG.rates[id].direct);

  if(proxyTargets.length){
    try{
      const res = await fetch(CONFIG.proxyUrl, {cache:'no-store', signal:AbortSignal.timeout(15000)});
      if(!res.ok) throw new Error('proxy http '+res.status);
      const data = await res.json();
      proxyTargets.forEach(id=>{
        const r = CONFIG.rates[id];
        const raw = data[r.proxyKey];
        if(raw!==undefined && raw!==null && !isNaN(raw)) applyAutoRate(id, r, raw);
        else { r.fetchError = true; }
      });
    }catch(e){ proxyTargets.forEach(id=> CONFIG.rates[id].fetchError = true); }
  }

  await Promise.all(directTargets.map(async id=>{
    const r = CONFIG.rates[id];
    try{
      const res = await fetch(r.directUrl, {cache:'no-store', signal:AbortSignal.timeout(15000)});
      if(!res.ok) throw new Error('http '+res.status);
      const data = await res.json();
      const raw = r.directPath.split('.').reduce((o,k)=>(o&&o[k]!==undefined)?o[k]:undefined, data);
      if(raw===undefined || isNaN(raw)) throw new Error('path not found');
      applyAutoRate(id, r, parseFloat(raw));
    }catch(e){ r.fetchError = true; }
  }));

  saveConfig();
  refreshRatesUI();
}

async function fetchCustomsQuote(route, f){
  // Тело запроса (цена в валюте сделки без комиссии банка, каталожная
  // стоимость, объём/мощность по типу двигателя) собирает lib/calc.js —

  const payload = Object.assign(authFields(), BkCalc.customsPayload(CONFIG, route, f));

  const res = await fetch(CONFIG.customsProxyUrl, {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload),
    signal: AbortSignal.timeout(25000) // сервер сам может ждать TKS 8с + резерв alta.ru
  });
  // Сервер теперь может ответить не только 200 (напр. 401 при непройденной
  // авторизации) — тело всё равно JSON с понятным полем error, читаем его
  // в любом случае, а не показываем голый код статуса.
  let data;
  try{ data = await res.json(); }catch(e){ throw new Error('HTTP '+res.status); }
  if(data.error) throw new Error(data.error);
  if(!res.ok) throw new Error('HTTP '+res.status);
  return data; // { duty, util, dutyItems, utilBasis }
}

function isUpdatedToday(iso){
  if(!iso) return false;
  const d = new Date(iso), now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();

  return `<div class="unfilled-hint" id="unfilled_${key}">${label} не указан${suffix} в объявлении — впишите вручную</div>`;
}
function unfilledClass(f, key){ return (f._unfilled && f._unfilled.includes(key)) ? ' unfilled-input' : ''; }
// Вызывается из живых обработчиков ввода/изменения поля — снимает обе
// подписи (и "перенесено", и "не указано") сразу же, без ре-рендера всей
// формы, чтобы не сбивать фокус/курсор во время набора текста.
function clearFieldHints(f, key){
  removeFromArr(f._carried, key);
  removeFromArr(f._unfilled, key);
  const el1 = document.getElementById('carried_'+key); if(el1) el1.remove();
  const el2 = document.getElementById('unfilled_'+key); if(el2) el2.remove();
  const inputEl = document.getElementById('f_'+key); if(inputEl) inputEl.classList.remove('unfilled-input');
}

// Сжимаем фото перед отправкой на сервер: Vercel ограничивает тело запроса
// (~4.5 МБ), а фото с телефона легко больше. Для чтения текста/таблиц
// разрешения 1800px по длинной стороне более чем достаточно.
function resizeImageToBase64(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('не удалось прочитать файл'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('не удалось декодировать изображение'));
      img.onload = ()=>{
        // Vercel обрывает соединение на слишком большом теле запроса (~4.5 МБ)
        // ещё до ответа — браузер видит это как generic "Load failed", а не
        // понятную ошибку. Поэтому сжимаем итеративно, ступень за ступенью,
        // пока base64 не влезет с запасом, а не одним фиксированным качеством.
        const MAX_BASE64 = 2.5 * 1024 * 1024;
        const attempts = [
          {dim:maxDim, q:quality}, {dim:1400, q:0.75}, {dim:1100, q:0.6}, {dim:900, q:0.5}
        ];
        let result = null;
        for(const a of attempts){
          let w = img.width, h = img.height;
          if(w > a.dim || h > a.dim){
            const scale = a.dim / Math.max(w, h);
            w = Math.round(w*scale); h = Math.round(h*scale);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          result = canvas.toDataURL('image/jpeg', a.q).split(',')[1];
          if(result.length <= MAX_BASE64) break;
        }
        if(!result || result.length > MAX_BASE64){
          reject(new Error('фото слишком большое даже после сжатия — попробуйте переснять при более простом освещении или обрезать лишнее по краям'));
          return;
        }
        resolve({ base64: result, mimeType: 'image/jpeg' });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Общая логика для текстового и фото-разбора объявления: шлёт payload на
// /api/parse-listing и подставляет результат в форму f (только в пустые
// поля — см. комментарий у FIELD_DEFAULTS). Никогда не бросает исключение —
// всегда возвращает готовый статус-текст для показа пользователю.
// Поля-цели автозаполнения, у которых есть свой видимый инпут/селект на
// форме (и поэтому имеет смысл подсвечивать пунктиром, если распознавание
// их не нашло) — см. UNFILLED_LABELS ниже. powerUnit (переключатель без
// состояния "не выбрано") и prodMonth (мелкое парное поле — см. prodYear,
// где "дата выпуска" трактуется целиком) сюда намеренно не входят.
// [название, окончание причастия "не указан…"] — род/число у полей разные
// (Марка — жен., Пробег — муж., Состояние — ср., Примечания — мн.).
const UNFILLED_LABELS = {
  model:['Марка/модель','а'], carTrim:['Комплектация','а'], mileage:['Пробег',''], prodYear:['Дата выпуска','а'],
  drivetrain:['Привод',''], transmission:['Трансмиссия','а'], engineType:['Тип двигателя',''], volumeCm3:['Объём двигателя',''],
  power:['Мощность','а'], carPrice:['Цена','а'], condition:['Состояние','о'], notes:['Примечания','ы']
};
async function runListingParse(payload, f, route){
  try{
    const res = await fetch(CONFIG.parseListingUrl, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...payload, ...authFields()}),
      signal: AbortSignal.timeout(30000) // фото + разбор ИИ (Gemini/GigaChat) может идти небыстро
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    const FIELD_MAP = ['model','carTrim','mileage','prodMonth','prodYear','drivetrain','transmission',
      'engineType','volumeCm3','power','powerUnit','carPrice','condition','notes'];
    // Курс маршрута для сверки price/priceCurrency (Блок 10 ЗАДАНИЯ.md) — та
    // же нормализация USDT→USD, что уже используется в calcDeal (см. carCurrency).
    const routeCfg = route ? CONFIG.routes[route] : null;
    const routeCurrency = routeCfg ? (routeCfg.currency==='USDT' ? 'USD' : routeCfg.currency) : null;
    let filled = 0;
    if(!f._unfilled) f._unfilled = [];
    FIELD_MAP.forEach(k=>{
      let v = data[k];
      // carPrice приходит напрямую только со структурного разбора Encar;
      // общая ИИ-схема отдаёт price+priceCurrency — подставляем только при
      // совпадении валюты с маршрутом, иначе цена в форме окажется в чужой
      // валюте молча.
      if(k==='carPrice' && (v===null || v===undefined || v==='') && data.price!=null && data.price!=='' && data.priceCurrency && data.priceCurrency===routeCurrency){
        v = data.price;
      }
      if(v===null || v===undefined || v==='') v = null;
      else if(k==='drivetrain' && !DRIVETRAIN_LABELS[v]) v = null;
      else if(k==='transmission' && !TRANSMISSION_LABELS[v]) v = null;
      else if(k==='engineType' && !ENGINE_TYPES[v]) v = null;
      else if(k==='powerUnit' && v!=='ls' && v!=='kvt') v = null;
      // Распознанное всегда побеждает — раньше подставлялось только в пустые
      // поля, но это оставляло на форме случайные обрывки от предыдущего
      // расчёта (см. Блок 3 ЗАДАНИЯ.md: перенесённые поля и так помечены
      // отдельной подписью "перенесено", а не должны молча мешать новому
      // распознаванию).
      if(v!==null){
        f[k] = (k==='mileage' || k==='volumeCm3' || k==='power' || k==='carPrice') ? String(Math.round(num(v))) : String(v);
        filled++;
        removeFromArr(f._carried, k);
        removeFromArr(f._unfilled, k);
      } else if(k in UNFILLED_LABELS && !f._unfilled.includes(k)){
        f._unfilled.push(k);
      }
    });
    // "Дата выпуска" в форме — одно смысловое поле (prodMonth+prodYear), а
    // подпись/пунктир вешаем только на prodYear (см. UNFILLED_LABELS) —
    // но только если распознавание не нашло НИ месяца, ни года.
    if(data.prodYear!=null && data.prodYear!=='') removeFromArr(f._unfilled, 'prodYear');
    if(filled>0) f.showCarDetails = true;
    applyAgeFromDate(f); // возраст пересчитывается из распознанной даты — см. ЗАДАНИЕ.md Блок 10
    const sourceNote = data.source==='heuristic' ? ' · резервный разбор без ИИ (GigaChat недоступен'+(data.aiError?': '+data.aiError:'')+'), часть полей могла не заполниться' : '';
    const statusText = (filled>0 ? ('Заполнено полей: '+filled) : 'Новых данных не нашли — либо их нет в тексте, либо все поля уже заполнены') + sourceNote;
    return { statusText, statusColor: filled>0 ? 'var(--good)' : 'var(--muted)' };
  }catch(e){
    return { statusText: 'Ошибка: '+e.message, statusColor: 'var(--danger)' };
  }
}
