  `;

  bindRateWidget(route);

  // Эти пять полей влияют на запрос в TKS — их правка обнуляет уже
  // посчитанную таможню (см. invalidateCustomsAuto). Остальные поля цикла
  // (комиссии, доп. данные для клиента и т.п.) на таможню не влияют.
  const CUSTOMS_AFFECTING = ['carPrice','extraCosts','volumeCm3','power','customsValueManual'];
  ['model','carPrice','extraCosts','volumeCm3','power','customsManual','deliveryManual','agentFee','brokerFee',
   'customsValueManual','carTrim','mileage','prodMonth','prodYear'].forEach(k=>{
    const el = document.getElementById('f_'+k);
    if(!el) return;
    if(GROUPED_NUM_FIELDS.includes(k)){
      el.oninput = ()=>{
        clearFieldHints(f, k);
        if(CUSTOMS_AFFECTING.includes(k)) invalidateCustomsAuto(f);
        const clean = cleanNumInput(el.value);
        f[k] = clean;
        updateClosingGuard();
        const digitsBeforeCursor = cleanNumInput(el.value.slice(0, el.selectionStart)).length;
        const formatted = formatNumInput(clean);
        el.value = formatted;
        let seen = 0, pos = formatted.length;
        for(let i=0;i<formatted.length;i++){
          if(/[\d.,]/.test(formatted[i])) seen++;
          if(seen>=digitsBeforeCursor){ pos = i+1; break; }
        }
        el.setSelectionRange(pos, pos);
      };
    } else {
      el.oninput = ()=>{ clearFieldHints(f, k); f[k]=el.value; updateClosingGuard(); };
    }
  });
  // Возраст пересчитывается из даты выпуска (ЗАДАНИЕ.md Блок 10) по onchange
  // (не oninput) — иначе перерисовка формы на каждый введённый символ сбивала
  // бы фокус посреди набора года/месяца.
  const prodMonthEl = document.getElementById('f_prodMonth'); if(prodMonthEl) prodMonthEl.onchange = ()=>{ applyAgeFromDate(f); invalidateCustomsAuto(f); renderCalc(c); };
  const prodYearEl = document.getElementById('f_prodYear'); if(prodYearEl) prodYearEl.onchange = ()=>{ applyAgeFromDate(f); invalidateCustomsAuto(f); renderCalc(c); };
  const drivetrainEl = document.getElementById('f_drivetrain'); if(drivetrainEl) drivetrainEl.onchange = ()=>{ clearFieldHints(f,'drivetrain'); f.drivetrain=drivetrainEl.value; };
  document.querySelectorAll('#ageSeg button').forEach(b=> b.onclick = ()=>{ clearFieldHints(f,'age'); f.age=b.dataset.age; f._ageAuto=false; invalidateCustomsAuto(f); renderCalc(c); });
  const engineEl = document.getElementById('f_engineType'); if(engineEl) engineEl.onchange = ()=>{ clearFieldHints(f,'engineType'); f.engineType=engineEl.value; invalidateCustomsAuto(f); renderCalc(c); };
  document.querySelectorAll('#powerUnitSeg button').forEach(b=> b.onclick = ()=>{ clearFieldHints(f,'powerUnit'); f.powerUnit=b.dataset.unit; invalidateCustomsAuto(f); renderCalc(c); });
  const advancedT = document.getElementById('advancedToggle'); if(advancedT) advancedT.onclick = ()=>{ f._advancedOpen=!f._advancedOpen; renderCalc(c); };
  const conditionBtn = document.getElementById('f_condition_btn'); if(conditionBtn) conditionBtn.onclick = ()=> openTextFieldSheet(f, 'condition', 'Состояние', ()=>renderCalc(c));
  const notesBtn = document.getElementById('f_notes_btn'); if(notesBtn) notesBtn.onclick = ()=> openTextFieldSheet(f, 'notes', 'Примечания', ()=>renderCalc(c));
  const eaeuFullDutyT = document.getElementById('eaeuFullDutyToggle'); if(eaeuFullDutyT) eaeuFullDutyT.onclick = ()=>{ f.eaeuFullDuty=!f.eaeuFullDuty; invalidateCustomsAuto(f); renderCalc(c); };
  const customsValT = document.getElementById('customsValueOverrideToggle'); if(customsValT) customsValT.onclick = ()=>{ f.customsValueOverride=!f.customsValueOverride; invalidateCustomsAuto(f); renderCalc(c); };
  const carDetailsT = document.getElementById('carDetailsToggle'); if(carDetailsT) carDetailsT.onclick = ()=>{ f.showCarDetails=!f.showCarDetails; renderCalc(c); };
  const listingTa = document.getElementById('f_listingText'); if(listingTa) listingTa.oninput = ()=>{ f.listingText = listingTa.value; updateClosingGuard(); };
  const parseBtn = document.getElementById('parseListingBtn');
  if(parseBtn) parseBtn.onclick = async ()=>{
    const text = (f.listingText||'').trim();
    if(!text){
      const st0 = document.getElementById('parseListingStatus');
      if(st0){ st0.textContent = 'Вставьте текст объявления'; st0.style.color = 'var(--danger)'; }
      return;
    }
    parseBtn.disabled = true; parseBtn.textContent = 'Распознаю…';
    const {statusText, statusColor} = await runListingParse({text}, f, route);
    updateClosingGuard();
    renderCalc(c);
    const statusEl = document.getElementById('parseListingStatus');
    if(statusEl){ statusEl.textContent = statusText; statusEl.style.color = statusColor; }
  };
  const listingImgInput = document.getElementById('f_listingImage');
  if(listingImgInput) listingImgInput.onchange = ()=>{
    const lbl = document.getElementById('listingImageLabel');
    const file = listingImgInput.files && listingImgInput.files[0];
    if(lbl){ lbl.textContent = file ? file.name : 'Выбрать фото'; lbl.classList.toggle('has-file', !!file); }
  };
  const parseImgBtn = document.getElementById('parseListingImageBtn');
  if(parseImgBtn) parseImgBtn.onclick = async ()=>{
    const fileInput = document.getElementById('f_listingImage');
    const file = fileInput && fileInput.files && fileInput.files[0];
    const st0 = document.getElementById('parseListingImageStatus');
    if(!file){
      if(st0){ st0.textContent = 'Выберите фото аукционного листа'; st0.style.color = 'var(--danger)'; }
      return;
    }
    parseImgBtn.disabled = true; parseImgBtn.textContent = 'Распознаю…';
    let statusText = '', statusColor = 'var(--muted)';
    try{
      const {base64, mimeType} = await resizeImageToBase64(file, 1800, 0.85);
      const result = await runListingParse({image:base64, mimeType}, f, route);
      statusText = result.statusText; statusColor = result.statusColor;
    }catch(e){
      statusText = 'Ошибка: '+e.message;
      statusColor = 'var(--danger)';
    }
    updateClosingGuard();
    renderCalc(c);
    const statusEl = document.getElementById('parseListingImageStatus');
    if(statusEl){ statusEl.textContent = statusText; statusEl.style.color = statusColor; }
  };
  const transEl = document.getElementById('f_transmission'); if(transEl) transEl.onchange = ()=>{ clearFieldHints(f,'transmission'); f.transmission=transEl.value; };
  const cityEl = document.getElementById('f_city'); if(cityEl) cityEl.onchange = ()=>{ f.deliveryCity=cityEl.value; saveDeliveryPrefs(f.deliveryCity, f.bodyTypeIdx); renderCalc(c); };
  const bodyEl = document.getElementById('f_body'); if(bodyEl) bodyEl.onchange = ()=>{ f.bodyTypeIdx=+bodyEl.value; saveDeliveryPrefs(f.deliveryCity, f.bodyTypeIdx); renderCalc(c); };
  const delT = document.getElementById('delOverrideToggle'); if(delT) delT.onclick = ()=>{ f.deliveryOverride=!f.deliveryOverride; renderCalc(c); };
  // Вложенный тумблер "вручную" и его значение раньше переживали выключение
  // родительского "Учитывать доставку" — секция просто скрывалась, а флаг
  // оставался true, и при повторном включении доставка неожиданно снова
  // была "вручную". Каждое переключение родителя теперь сбрасывает вложенный
  // тумблер и его значение — включать "вручную" можно только заново самому.
  const delEnT = document.getElementById('deliveryEnabledToggle'); if(delEnT) delEnT.onclick = ()=>{ f.deliveryEnabled=!f.deliveryEnabled; f.deliveryOverride=false; f.deliveryManual=''; renderCalc(c); };
  const customsT = document.getElementById('customsOverrideToggle'); if(customsT) customsT.onclick = ()=>{ f.customsOverride=!f.customsOverride; renderCalc(c); };

  const doCalc = async ()=>{
    const btn = document.getElementById('calcBtn');
    btn.disabled = true; btn.textContent = 'Запрашиваю расчёт в TKS…';
    let statusText = '', statusColor = 'var(--muted)';
    try{
      const res = await fetchCustomsQuote(route, f);
      f.customsAuto = String(BkCalc.customsAutoTotal(CONFIG, route, f, res));
      const dutyBreakdown = (!isEaeu && res.dutyItems && res.dutyItems.length)
        ? res.dutyItems.map(x=>x.label.replace(/:$/,'')+' '+fmt(x.amount)).join(' + ')+' + Утильсбор '+fmt(res.util||0)
        : 'Утильсбор '+fmt(res.util||0);
      const sourceLabel = res.source==='alta'
        ? 'alta.ru (резерв, TKS был недоступен'+(res.tksError ? ': '+res.tksError : '')+')'
        : 'официального API TKS.RU';
      const catalogNote = (f.customsValueOverride && num(f.customsValueManual)>0)
        ? ' · по каталожной стоимости '+fmt(num(f.customsValueManual))+' '+suf
        : '';
      statusText = 'Получено из '+sourceLabel+': '+dutyBreakdown+catalogNote+' · '+ new Date().toLocaleTimeString('ru-RU');
    }catch(e){
      statusText = 'Не удалось получить расчёт ('+e.message+') — используется значение из поля «вручную» (если включено) или 0.';
      statusColor = 'var(--danger)';
    }
    btn.disabled = false; btn.textContent = 'Рассчитать';
    renderCalc(c);
    const statusEl = document.getElementById('customsStatus');
    if(statusEl){ statusEl.textContent = statusText; statusEl.style.color = statusColor; }
    const shown = showResult(route, f);
    if(shown) pushArchive(route, f, shown);
  };
  document.getElementById('calcBtn').onclick = doCalc;
}

function carDetailLines(f, route){
  if(!f.showCarDetails) return [];
  const lines = [];
  if(f.carTrim) lines.push(['Комплектация', f.carTrim]);
  // Для Японии аукционные листы (и то, что с них считывается) показывают дату
  // первой регистрации, а не дату выпуска — эти даты могут отличаться, и
  // выдавать за клиенту одно как другое было бы неточно. См. обсуждение с
  // владельцем: для остальных направлений это по-прежнему дата производства.
  const prodDateLabel = route==='japan' ? 'Дата первой регистрации' : 'Дата производства';
  if(f.prodMonth || f.prodYear) lines.push([prodDateLabel, [f.prodMonth?String(f.prodMonth).padStart(2,'0'):'', f.prodYear].filter(Boolean).join('.')]);
  if(f.mileage) lines.push(['Пробег', fmt(num(f.mileage),'км')]);
  if(f.drivetrain) lines.push(['Привод', DRIVETRAIN_LABELS[f.drivetrain] || f.drivetrain]);
  if(f.transmission) lines.push(['Трансмиссия', TRANSMISSION_LABELS[f.transmission] || f.transmission]);
  // Третий элемент — признак абзаца: в чеке такие строки переносятся под подписью.
  if(f.condition) lines.push(['Состояние', f.condition, {text:true}]);
  if(f.notes) lines.push(['Примечания', f.notes, {text:true}]);
  return lines;
}

// Каждый расчёт, реально показанный пользователю (не открытый заново из
// истории/архива на просмотр — см. вызовы showResult) — автоматически в
// архив, без нажатия кнопок (см. saveArchive/ЗАДАНИЕ.md Блок 3).
function pushArchive(route, f, r){
  state.archive.unshift({ id:Date.now(), route, model:f.model||'Без названия', total:r.total, date:new Date().toISOString(), form:{...f} });
  if(state.archive.length>50) state.archive.length = 50;
  saveArchive();
}
function showResult(route, f, opts){
  const zone = document.getElementById('resultZone');
  // Без этого пустое customsAuto превращается в calcDeal() в 0 — и клиенту
  // может уйти КП, заниженное на всю сумму пошлины. Ручной ввод (f.customsOverride)
  // — это значение владельца, ему всегда доверяем и чек не блокируем.
  if(!f.customsOverride && !num(f.customsAuto)){
    zone.innerHTML = `<div class="notice">Таможенные платежи не рассчитаны. Нажмите «Рассчитать» ещё раз или включите «Указать вручную».</div>`;
    return null;
  }
  const r = calcDeal(route, f);
  const cfg = CONFIG.routes[route];
  const carLines = carDetailLines(f, route);

  zone.innerHTML = `
    <div class="receipt">
      <h2 class="receipt-title">Расчёт</h2>
      <div class="receipt-head">
        <div class="model">${f.model ? escapeHtml(f.model) : 'Без названия'}</div>
        <div class="meta">${cfg.label} · ${AGE_LABELS[f.age]} · ${(ENGINE_TYPES[f.engineType]||ENGINE_TYPES.ben).label}${f.volumeCm3?(' · '+(num(f.volumeCm3)/1000).toFixed(1)+' л'):''}${f.power?(' · '+f.power+' '+(f.powerUnit==='kvt'?'кВт':'л.с.')):''}</div>
      </div>
      ${carLines.length ? `<div class="receipt-body" style="padding-bottom:2px;border-bottom:1px dashed var(--line);">${carLines.map(([k,v,o])=>`<div class="rline car${o && o.text ? ' text' : ''}"><div class="k">${k}</div><div class="v">${escapeHtml(v)}</div></div>`).join('')}</div>` : ''}
      <div class="receipt-body">
        <div class="rline"><div class="k">Цена ТС с расходами до РФ<span class="hint">${lockedRates() ? ('переведено в рубли по курсу на ' + new Date(RECALC_CTX.ratesLock.at).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}) + ' (оплата инвойса), банк. комиссия учтена') : 'переведено в рубли по текущим курсам, банк. комиссия учтена'}</span></div><div class="v">${fmt(r.invoiceRub,'₽')}</div></div>
        <div class="rline"><div class="k">${r.customsLabel}${f.customsOverride?' (вручную)':''}</div><div class="v">${fmt(r.customsTotal,'₽')}</div></div>
        <div class="rline"><div class="k">Брокер</div><div class="v">${fmt(r.broker,'₽')}</div></div>
        <div class="rline"><div class="k">Наша комиссия</div><div class="v">${fmt(r.agent,'₽')}</div></div>
        ${f.deliveryEnabled ? `<div class="rline"><div class="k">Доставка по РФ${f.deliveryOverride?' (вручную)':' · '+f.deliveryCity}</div><div class="v">${fmt(r.delivery,'₽')}</div></div>` : ''}
        <div class="rline"><div class="k">Банковская комиссия (${r.bankPct}%)<span class="hint">уже включена в цену ТС выше, справочно</span></div><div class="v">${fmt(r.bankCommissionRub,'₽')}</div></div>
        <div class="rline"><div class="k">Первоначальный взнос<span class="hint">справочно, равен сумме брокера, не добавляется к итогу</span></div><div class="v">${fmt(r.downPayment,'₽')}</div></div>
      </div>
      <div class="receipt-total"><div class="lbl">Итого</div><div class="amt">${fmt(r.total,'₽')}</div></div>
    </div>
    ${RECALC_CTX ? `
    <div class="field" style="margin:var(--sp-4) 0;">
      <button class="btn btn-send" id="recalcSendBtn">Сохранить в сделку ${escapeHtml(RECALC_CTX.dealNum||'')} и отправить</button>
      <div class="send-hint">Обновит расчёт в сделке на свежую сумму и сразу откроет отправку в мессенджер. В общую историю расчётов этот прогон не попадёт.</div>
    </div>
    ` : `
    <button class="btn secondary" id="saveBtn" style="width:100%;">Сохранить в историю</button>
    <div class="field" style="margin:var(--sp-4) 0;">
      <button class="btn btn-send" id="shareBtn">Отправить в мессенджер</button>
      <div class="send-hint">Уйдёт фото расчёта. Текст скопируется в буфер — вставьте его следом.</div>
    </div>
    `}
  `;
  tgHaptic('notification', 'success'); // готовый расчёт — см. ЗАДАНИЕ.md Блок 10
  // При обычном "Рассчитать" прокручиваем к чеку — это и есть результат,
  // который человек только что запросил. При открытии из истории (opts.
  // scrollTop) чек уже виден без пролистывания — там, наоборот, нужно
  // начать с самого верха, чтобы можно было спокойно просмотреть и при
  // желании скорректировать введённые данные перед пересчётом.
  if(opts && opts.scrollTop){ window.scrollTo(0,0); }
  else { zone.scrollIntoView({behavior:'smooth', block:'nearest'}); }

  // Картинку-КП (html2canvas — заметная асинхронная работа, не мгновенная)
  // готовим сразу, как только показан расчёт, а не по клику на "Отправить".
  // На некоторых платформах Web Share API должен вызываться строго в
  // пределах "свежего" пользовательского жеста (клика) — рендер, начатый
  // только по самому клику, успевает израсходовать это окно раньше, чем
  // доходит до navigator.share(), и шеринг с картинкой рвётся на середине
  // (замечено на WhatsApp). Стартуя рендер заранее, к моменту клика картинка
  // обычно уже готова, и navigator.share() вызывается почти сразу за ним.
  const kpFilePromise = renderKpImageBlob(route, f, r)
    .then(blob => blob ? new File([blob], 'baikal-auto-kp.jpg', {type:'image/jpeg'}) : null)
    .catch(()=>null);

  // После отправки/сохранения форма чистится, КРОМЕ этих полей — обычно
  // это одна и та же машина/лот в рамках одной сессии подбора для клиента,
  // и переспрашивать объём/мощность/привод на каждый пересчёт неудобно.
  // Перенесённые значения помечаются подписью carriedHint (см. field()) до
  // тех пор, пока их не поправят руками или не перезапишет распознавание.
  function resetAfterDone(){
    const nf = defaultForm(route);
    const carried = [];
    FORM_CARRY_FIELDS.forEach(k=>{ if(f[k]!==undefined && f[k]!==''){ nf[k]=f[k]; carried.push(k); } });
    nf._carried = carried;
    state.form = nf;
    state.formCache[route] = state.form;
    updateClosingGuard();
    renderCalc(document.getElementById('content'));
  }

  const saveBtn = document.getElementById('saveBtn');
  if(saveBtn) saveBtn.onclick = ()=>{
    // parts — готовая разбивка наших денег (брокер/агент/доставка по РФ).
    // В сделках доставку по городу пересчитать нечем (deliveryPrice и конфиг
    // живут только здесь), поэтому кладём её уже посчитанной.
    state.history.unshift({ id:Date.now(), route, model:f.model||'Без названия', total:r.total, date:new Date().toISOString(), form:{...f}, parts:{ broker:r.broker, agent:r.agent, delivery:r.delivery } });
    if(state.history.length>300) state.history.length = 300;
    saveHistory();
    toast('Сохранено в историю');
    resetAfterDone();
  };
  const shareBtn = document.getElementById('shareBtn');
  if(shareBtn) shareBtn.onclick = async ()=>{
    const btn = document.getElementById('shareBtn');
    btn.disabled = true;
    // Форма очищается ТОЛЬКО если отправка действительно состоялась. Раньше
    // отмена в системном окне выглядела для кода так же, как успех, и
    // введённые данные пропадали ни за что.
    const sent = await shareResult(route, f, r, kpFilePromise);
    btn.disabled = false;
    if(sent) resetAfterDone();
  };
  // Пересчёт по курсам, вызван из сделки (RECALC_CTX): сохранение в сделку
  // и отправка объединены в одну кнопку — жмут один раз и получают и
  // обновлённую сумму в сделке, и картинку клиенту. В общую историю
  // расчётов (state.history) этот прогон сознательно не попадает — это не
  // новый расчёт, а актуализация уже забронированного.
  const recalcBtn = document.getElementById('recalcSendBtn');
  if(recalcBtn) recalcBtn.onclick = async ()=>{
    const ctx = RECALC_CTX;
    recalcBtn.disabled = true;
    try{
      const res = await fetch('/api/deals', {
        method:'POST', headers:{'Content-Type':'application/json'},
        // Полный пересчёт; в лог сделки идёт дата курсов — зафиксированных
        // оплатой инвойса, если они есть, иначе сегодняшняя. Расчёт,
        // замороженный оплатой таможни, сервер не примет (409) — текст
        // ошибки показываем как есть, это правильный исход.
        body: JSON.stringify({ ...authFields(), action:'recalcDealCalc', dealId:ctx.dealId, calcId:ctx.calcId, mode:'full', total:r.total, form:f, parts:{ broker:r.broker, agent:r.agent, delivery:r.delivery },
          ratesDate: new Date(ctx.ratesLock && ctx.ratesLock.at ? ctx.ratesLock.at : Date.now()).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}) })
      });
      const data = await res.json();
      if(data.error) throw new Error(data.error);
    }catch(e){
      recalcBtn.disabled = false;
      toast('Не удалось сохранить в сделку: ' + e.message);
      return;
    }
    const sent = await shareResult(route, f, r, kpFilePromise);
    recalcBtn.disabled = false;
    if(sent){ RECALC_CTX = null; resetAfterDone(); }
  };

  return r;
}

// Формат курса: у копеечных курсов (напр. вона) 2 знака после запятой
// стирают всю величину, поэтому мелким курсам даём больше точности.
function fmtRate(rate){
  return (rate>=1 ? rate.toFixed(2) : rate.toFixed(4)).replace('.', ',');
}

/* ---------------------------------------------------------------------
   8b. Фото-КП клиенту — та же логика "показывать/не показывать", что и
   в тексте (см. shareResult): "Параметры автомобиля" целиком появляется
   только при f.showCarDetails, а сами поля внутри — там, где для текста
   было бы "не показывать пустое", здесь (это готовая карточка/таблица,
   строки нельзя просто убрать без дыры в вёрстке) показываем "—".
--------------------------------------------------------------------- */
function buildKpHtml(route, f, r){
  const suf = CUR_SUFFIX[route];
  const dateStr = new Date().toLocaleDateString('ru-RU');
  const esc = s => escapeHtml(s);

  const em = ENGINE_TYPES[f.engineType] || ENGINE_TYPES.ben;
  const isElectric = em.dtype === 'electric';
  const prodDateLabel = route==='japan' ? 'Дата первой регистрации' : 'Дата производства';
  const prodDate = (f.prodMonth || f.prodYear) ? [f.prodMonth?String(f.prodMonth).padStart(2,'0'):'', f.prodYear].filter(Boolean).join('.') : '—';
  const liters = (!isElectric && num(f.volumeCm3)>0) ? (num(f.volumeCm3)/1000).toFixed(1).replace('.', ',')+' л.' : '—';
  const powerStr = (!isElectric && num(f.power)>0) ? fmt(num(f.power))+' '+(f.powerUnit==='kvt'?'кВт':'л.с.') : '—';
  const driveTrans = [f.drivetrain?(DRIVETRAIN_LABELS[f.drivetrain]||f.drivetrain):'', f.transmission?(TRANSMISSION_LABELS[f.transmission]||f.transmission):''].filter(Boolean).join(' / ') || '—';
  const mileageStr = f.mileage ? fmt(num(f.mileage),'км') : '—';

  const insurance = (r.invoiceRub + r.customsTotal) * 0.003;
  // Город "под ключ" и страхование — та же логика, что в тексте (см.
  // shareResult): если доставку не считали, город по умолчанию Владивосток,
  // а строку доставки и блок страхования (он именно про "в пути по РФ")
  // вообще не показываем — нечего показывать, раз доставка не считалась.
  const destCity = f.deliveryEnabled && f.deliveryCity ? f.deliveryCity : 'Владивосток';

  const shareRouteLabel = route==='eaeu' ? 'Китай' : CONFIG.routes[route].label;

  return `

      </div>
      ${f.model ? `<div class="kp-model"><div class="kp-model-label">Автомобиль</div><div class="kp-model-name">${esc(f.model)}</div></div>` : ''}
      <div class="kp-stats">
        <div class="kp-stat"><div class="kp-stat-l">ДАТА РАСЧЁТА</div><div class="kp-stat-v">${dateStr}</div></div>
        <div class="kp-stat"><div class="kp-stat-l">${RATE_STAT_LABEL[route]}</div><div class="kp-stat-v">${fmtRate(r.effectiveRate)} ₽</div></div>
        <div class="kp-stat"><div class="kp-stat-l">ЦЕНА АВТО</div><div class="kp-stat-v">${suf}${groupInt(Math.round(r.nativeTotal).toString())}</div></div>

            <div class="kp-total-note">с учётом всех расходов до ${destGenitive} на дату расчета</div>
          </div>
          <div class="kp-total-right">

      ${f.deliveryEnabled ? `

      ${paramsHtml}

    </div>`;

// html2canvas рисует только то, что реально в DOM — оффскрин-контейнер
// (не display:none, у него нет layout) с фиксированной шириной, чтобы
// картинка не зависела от размера экрана телефона.
async function renderKpImageBlob(route, f, r, maxScale){
  const holder = document.createElement('div');
  holder.style.cssText = 'position:fixed; left:-99999px; top:0; width:1080px; z-index:-1;';
  holder.innerHTML = buildKpHtml(route, f, r);
  document.body.appendChild(holder);
  try{
    const img = holder.querySelector('.kp-logo');
    if(img && !img.complete){ await new Promise(res=>{ img.onload = res; img.onerror = res; }); }
    const card = holder.firstElementChild;
    const w = card.scrollWidth, h = card.scrollHeight;
    // Мобильные WebKit-браузеры (в т.ч. встроенный в Telegram на iOS) режут
    // canvas примерно на площади свыше ~16 млн пикселей и на стороне свыше
    // ~4096px. Фиксированный большой scale (было 6) на длинных чеках (с
    // параметрами авто) на реальном телефоне почти наверняка превышал этот
    // предел — рендер тихо проваливался, картинка не прикреплялась вовсе
    // (это и стояло за тем, что "фото не отправляется"). Теперь scale
    // подбирается под фактический размер карточки, чтобы гарантированно
    // остаться в безопасных пределах на любом устройстве. maxScale — для
    // пути через api/share-relay.js (см. shareResult), там картинка едёт
    // через KV с ограничением по размеру, высокое разрешение там не нужно.
    const MAX_SIDE = 4096, MAX_AREA = 16777216;
    let scale = Math.min(maxScale||6, MAX_SIDE/w, MAX_SIDE/h, Math.sqrt(MAX_AREA/(w*h)));
    scale = Math.max(scale, 1);
    // letterRendering убран (ТЗ 14): html2canvas с ним рисует каждую букву
    // отдельно, кернинг гуляет и текст выглядит рваным. JPEG вместо PNG —
    // PNG в 5–8 МБ мессенджеры пережимают жёстче, чем JPEG в ~1 МБ.
    const canvas = await html2canvas(card, { scale, backgroundColor:'#ebebee' });
    return await new Promise(res=> canvas.toBlob(res, 'image/jpeg', 0.92));
  } catch(e){
    console.error('renderKpImageBlob failed', e);
    return null;
  } finally {
    document.body.removeChild(holder);
  }
}

// Единая отправка клиенту — одинаково на всех устройствах и во всех
// мессенджерах: системным «Поделиться» уходит ТОЛЬКО фото, а текст расчёта
// кладётся в буфер обмена, чтобы вставить его следом.
//
// Почему одинаково для всех. Раньше поведение различалось по платформам и
// мессенджерам: WhatsApp на iOS в принципе не принимает файл и текст одной
// посылкой; на части Android-сборок в WebView Telegram нет navigator.share
// вовсе; canShare({files,text}) на разных устройствах отвечает по-разному.
// Из-за этого фото то уходило, то нет, и предсказать это было нельзя.
// Решение владельца: одно понятное поведение везде — фото файлом, текст в
// буфере. Поэтому отдельной ветки под iOS-WhatsApp больше НЕТ: то, что
// раньше было исключением для одной связки, стало общим путём.
//
// Возвращает true, если отправка состоялась (вызывающий код тогда очищает
// форму), и false, если человек отменил её или фото подготовить не вышло.
async function shareResult(route, f, r, kpFilePromise){
  const suf = CUR_SUFFIX[route];
  // Клиенту направление ЕАЭС всегда подписывается «Китай» — по факту это тот
  // же китайский автомобиль, ЕАЭС/Киргизия — таможенный маршрут для нас, а
  // не страна для клиента. Флаг при этом настоящий (глобус для ЕАЭС).
  const shareRouteLabel = route==='eaeu' ? 'Китай' : CONFIG.routes[route].label;
  const dateStr = new Date().toLocaleDateString('ru-RU');
  const b = s => s;
  const dash = '- ';
  // Значения из «Доп. данных» (ручной ввод или разбор ИИ) могут случайно
  // содержать «*» — непарный символ выглядел бы в тексте странно.
  const esc = s => String(s).replace(/\*/g, '');

  const em = ENGINE_TYPES[f.engineType] || ENGINE_TYPES.ben;
  const isElectric = em.dtype === 'electric';
  let engineLine = null;
  if(isElectric){
    engineLine = 'Электричество';
  } else {
    const parts = [];
    if(num(f.volumeCm3)>0) parts.push((num(f.volumeCm3)/1000).toFixed(1).replace('.', ',')+' л');
    if(num(f.power)>0) parts.push(fmt(num(f.power))+' '+(f.powerUnit==='kvt'?'квт':'лс'));
    if(parts.length) engineLine = parts.join(' / ');
  }

  const prodDateLabel = route==='japan' ? 'Дата первой регистрации' : 'Дата производства';
  const details = [
    f.carTrim ? ['Комплектация', esc(f.carTrim)] : null,
    (f.prodMonth || f.prodYear) ? [prodDateLabel, [f.prodMonth?String(f.prodMonth).padStart(2,'0'):'', f.prodYear].filter(Boolean).join('.')] : null,
    f.mileage ? ['Пробег', fmt(num(f.mileage),'км')] : null,
    engineLine ? ['Двигатель', engineLine] : null,
    f.drivetrain ? ['Привод', DRIVETRAIN_LABELS[f.drivetrain]||f.drivetrain] : null,
    f.transmission ? ['Трансмиссия', TRANSMISSION_LABELS[f.transmission]||f.transmission] : null,
    f.condition ? ['Состояние', esc(f.condition)] : null,
    f.notes ? ['Примечания', esc(f.notes)] : null
  ].filter(Boolean);

  // Комиссию за перевод в валюте сделки просят показывать только для
  // Китая/ЕАЭС; для Японии/Кореи — как и раньше, только в рублях.
  const commissionLine = (route==='china' || route==='eaeu')
    ? `Комиссия за перевод (${r.bankPct}%): ${fmt(r.nativeCommission, suf)}`
    : `Комиссия за перевод (${r.bankPct}%): ${fmt(r.bankCommissionRub, '₽')}`;

  // Город «под ключ» — реально посчитанный город доставки, если доставку
  // считали; если нет — по умолчанию Владивосток (там принимаем авто).
  const destCity = f.deliveryEnabled && f.deliveryCity ? f.deliveryCity : 'Владивосток';
  const destGenitive = CITY_GENITIVE[destCity] || destCity;

  const lines = [b(`${shareRouteLabel} ${ROUTE_FLAG[route]||''} (${dateStr})`), '', `🚘 ${b(f.model ? esc(f.model) : 'Расчёт')}`];
  if(f.showCarDetails && details.length) lines.push(...details.map(([k,v])=>`${b(k+':')} ${v}`));
  lines.push('');
  lines.push(`${b('Цена ТС с расходами до РФ:')} ${fmt(r.invoiceRub,'₽')}`);
  lines.push(`${dash}Цена в валюте: ${fmt(r.nativeTotal, suf)}`);
  lines.push(`${dash}${commissionLine}`);
  lines.push(`${dash}Курс на дату расчета: ${fmtRate(r.effectiveRate)} ₽/${suf}`);
  lines.push(`${b(r.customsLabel+':')} ${fmt(r.customsTotal,'₽')}`);
  lines.push(`${b('Брокер:')} ${fmt(r.broker,'₽')}`);
  lines.push(`${b('Комиссия:')} ${fmt(r.agent,'₽')}`);
  if(f.deliveryEnabled) lines.push(`${b('Доставка по РФ:')} ${fmt(r.delivery,'₽')} (страхование авто в пути, по желанию (рекомендуется) / к оплате дополнительно - 0,3% от заявленной стоимости ТС)`);
  lines.push('');
  lines.push(b(`ИТОГО цена под ключ: ${fmt(r.total,'₽')}`));
  lines.push(`с учётом всех расходов до ${destGenitive} на дату расчета`);
  const text = lines.join('\n');
  const title = 'Расчёт стоимости авто';

  // 1. Текст — в буфер сразу, пока мы ещё внутри пользовательского нажатия:
  //    часть платформ разрешает запись в буфер только в этом окне.
  let textCopied = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      textCopied = true;
    }
  }catch(e){ /* буфер недоступен — честно скажем об этом в подсказке ниже */ }

  // Рендер картинки стартовал заранее (см. showResult) — здесь только ждём.
  const file = kpFilePromise ? await kpFilePromise : null;
  if(!file){
    toast(textCopied
      ? 'Фото КП подготовить не удалось. Текст расчёта скопирован — отправьте текстом'
      : 'Фото КП подготовить не удалось, и буфер обмена недоступен', 4000);
    return false;
  }

  const shareData = { files:[file] };
  const canFile = !navigator.canShare || navigator.canShare(shareData);

  // 2. Фото — системным «Поделиться». Ни text, ни title не передаём
  //    сознательно: WhatsApp на iOS подставляет даже title в поле
  //    сообщения, а это снова та самая пара «файл + текст», которую он
  //    не принимает.
  if(navigator.share && canFile){
    try{
      await navigator.share(shareData);
      toast(textCopied ? 'Фото ушло. Текст в буфере — вставьте его следом' : 'Фото ушло, а текст скопировать не вышло', 3500);
      return true;
    }catch(e){
      if(e && e.name === 'AbortError') return false; // человек сам закрыл окно выбора
      // любая другая ошибка — идём запасными путями ниже
    }
  }

  // 3. Android в Telegram: navigator.share там может отсутствовать вовсе
  //    (проверено на устройстве владельца — в обычном Chrome на том же
  //    телефоне всё работает, дело именно в WebView Telegram). Зато
  //    Telegram.WebApp.openLink() открывает настоящий внешний браузер и
  //    сам мини-апп при этом не закрывается. Картинку туда передаём через
  //    короткоживущее хранилище (api/share-relay.js), потому что blob из
  //    памяти одного приложения не виден другому.
  //    Вне Telegram (Safari/Chrome, ТЗ 15) этот путь не нужен: openLink там
  //    не работает, а navigator.share выше уже отработал или его нет —
  //    тогда сразу путь 4.
  const tg = getTg();
  if(tg && tg.openLink && inTelegram()){
    try{
      const relayBlob = await renderKpImageBlob(route, f, r, 2);
      if(relayBlob){
        const dataUrl = await new Promise((res, rej)=>{
          const rd = new FileReader();
          rd.onload = ()=> res(rd.result);
          rd.onerror = rej;
          rd.readAsDataURL(relayBlob);
        });
        const putRes = await fetch('/api/share-relay', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ...authFields(), action:'put', imageDataUrl:dataUrl, text, title }) });
        const putData = await putRes.json();
        if(putData.id){
          tg.openLink(location.origin + '/share?id=' + putData.id);
          toast('Открыл внешний браузер — нажмите там «Отправить фото». Текст уже в буфере', 4000);
          return true;
        }
      }
    }catch(e){ /* не получилось — последний путь ниже */ }
  }

  // 4. Последний путь: показать картинку, чтобы сохранить или переслать её
  //    вручную. Долгое нажатие на изображение работает даже там, где не
  //    хватает JS-API.
  const reader = new FileReader();
  reader.onload = ()=>{
    openSheet(`
      <h3>Фото расчёта готово</h3>
      <p style="font-size:var(--fs-base);color:var(--muted);margin:0 0 var(--sp-4);line-height:1.5;">${textCopied ? 'Текст уже в буфере обмена. ' : ''}Зажмите фото и выберите «Поделиться» или «Сохранить изображение».</p>
      <img src="${reader.result}" style="width:100%;border-radius:var(--r-md);display:block;">
      <button class="btn secondary mt-4" id="closeShareImgSheet">Готово</button>
    `);
    document.getElementById('closeShareImgSheet').onclick = closeSheet;
  };
  reader.readAsDataURL(file);
  return false;
}

// Поля описания самого авто, которые переносятся при "Другое направление" —
// сознательно НЕ весь f целиком: комиссии, таможня и доставка — свойства
// маршрута/сделки, а не машины, для нового направления их нужно взять
// заново из дефолтов, а не притащить старые (например, брокер/агент по
// Японии не должны стать значениями для Китая).
const HIST_CARRY_FIELDS = ['model','carTrim','engineType','volumeCm3','power','powerUnit','drivetrain','transmission','prodMonth','prodYear','mileage','condition','notes','showCarDetails'];

let historySwipeOpen = null;

function bindHistorySwipe(card){
  const REVEAL = 88;
  card._histOpen = false;
  card._histMoved = false;
  let tracking = false, startX = 0, startY = 0, startTranslate = 0, axis = null;
  const setX = (px)=>{ card.style.transform = `translateX(${px}px)`; };
  card.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    tracking = true; axis = null; card._histMoved = false;
    startX = e.clientX; startY = e.clientY;
    startTranslate = card._histOpen ? -REVEAL : 0;
    card.style.transition = 'none';
  });
  card.addEventListener('pointermove', (e)=>{
    if(!tracking) return;
    const dx = e.clientX-startX, dy = e.clientY-startY;
    if(axis===null){
      if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
      axis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
      if(axis==='y'){ tracking=false; return; }
    }
    if(axis!=='x') return;
    card._histMoved = true;
    setX(Math.min(0, Math.max(-REVEAL, startTranslate+dx)));
  });
  const finish = ()=>{
    if(!tracking) return;
    tracking = false;
    if(axis!=='x') return;
    card.style.transition = 'transform .2s ease';
    const m = /translateX\((-?\d+(?:\.\d+)?)/.exec(card.style.transform);
    const cur = m ? parseFloat(m[1]) : 0;
    const open = cur < -REVEAL/2;
    setX(open ? -REVEAL : 0);
    card._histOpen = open;
    if(open){
      if(historySwipeOpen && historySwipeOpen!==card){ historySwipeOpen.style.transition='transform .2s ease'; historySwipeOpen.style.transform='translateX(0px)'; historySwipeOpen._histOpen=false; }
      historySwipeOpen = card;
    } else if(historySwipeOpen===card) historySwipeOpen = null;
  };
  card.addEventListener('pointerup', finish);
  card.addEventListener('pointercancel', finish);
}

function openClearHistoryConfirm(filter, c){
  const label = filter==='all' ? 'всю историю' : `историю «${CONFIG.routes[filter].label}»`;
  openSheet(`
    <h3>Точно очистить ${label}?</h3>
    <p class="u-note">Отменить это будет нельзя.</p>
    <button class="btn danger mb-2" id="clearHistConfirmBtn">Да, очистить</button>
    <button class="btn secondary" id="clearHistCancelBtn">Нет, отмена</button>
  `);
  document.getElementById('clearHistConfirmBtn').onclick = ()=>{
    closeSheet();
    if(filter==='all'){ state.history=[]; } else { state.history = state.history.filter(x=>x.route!==filter); }
    saveHistory();
    renderHistory(c);
    toast('Очищено');
  };
  document.getElementById('clearHistCancelBtn').onclick = closeSheet;
}

function openOtherRoutePicker(h){
  const otherRoutes = Object.keys(CONFIG.routes).filter(id=>id!==h.route);
  openSheet(`
    <h3>Пересчитать в другом направлении</h3>
    <p style="font-size:var(--fs-base);color:var(--muted);margin:0 0 var(--sp-4);line-height:1.5;">${escapeHtml(h.model||'Авто')} — цена авто и расходы в стране очистятся, остальные данные об авто сохранятся.</p>
    ${otherRoutes.map(id=>`<button class="btn secondary mb-2" data-pick-route="${id}">${CONFIG.routes[id].label} ${ROUTE_FLAG[id]||''}</button>`).join('')}
    <button class="btn secondary" id="otherRouteCancel">Отмена</button>
  `);
  document.getElementById('otherRouteCancel').onclick = closeSheet;
  document.querySelectorAll('[data-pick-route]').forEach(pb=> pb.onclick = ()=>{
    const newRoute = pb.dataset.pickRoute;
    closeSheet();
    const carried = {};
    HIST_CARRY_FIELDS.forEach(k=>{ if(h.form[k]!==undefined) carried[k]=h.form[k]; });
    state.route = newRoute;
    state.form = {...defaultForm(newRoute), ...carried};
    state.formCache[newRoute] = state.form;
    state.view = 'calc';
    document.querySelectorAll('.navbtn').forEach(nb=>nb.classList.toggle('active', nb.dataset.view==='calc'));
    renderTabs(); renderContent(); syncTelegramUI();
    toast('Перенесено в «'+CONFIG.routes[newRoute].label+'», укажите цену');
  });
}

// Архив — отдельный список (state.archive, см. pushArchive/saveArchive),
// открывается папкой внутри вкладки «Общие» (только там — привязки к
// направлению у архива нет смысла показывать отдельно). Автоматический,
// без ручного curation, поэтому без свайпа-удаления и без "Другое
// направление" — сюда просто заглядывают посмотреть, что считали.
function renderArchiveList(c){
  renderTopbar();
  historySwipeOpen = null;
  const back = `<button class="btn secondary small mb-4" id="archiveBack">← Назад</button>`;
  const listHtml = state.archive.length ? state.archive.map(h=>{
    const d = new Date(h.date);
    return `<div class="histcard" data-aid="${h.id}">
      <div class="l"><div class="m">${escapeHtml(h.model)}</div><div class="d">${CONFIG.routes[h.route].label} · ${d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>
      <div class="r"><div class="t">${fmt(h.total,'₽')}</div></div>
    </div>`;
  }).join('') : `<div class="emptystate"><div class="big">Пока пусто</div>Сюда попадёт каждый расчёт, доведённый до результата — последние 50</div>`;
  c.innerHTML = back + `<div style="font-size:var(--fs-sm);color:var(--muted);margin:calc(var(--sp-2) * -1) 0 var(--sp-4);">Заполняется автоматически при каждом расчёте, дошедшем до результата. Хранит последние 50 — более старые пропадают без предупреждения. Для того, что нужно сохранить надолго, используйте «Сохранить в историю».</div>` + listHtml;
  document.getElementById('archiveBack').onclick = ()=>{ state.historyArchiveOpen=false; renderHistory(c); };
  c.querySelectorAll('[data-aid]').forEach(el=> el.onclick = ()=>{
    const h = state.archive.find(x=>x.id==el.dataset.aid);
    if(!h) return;
    state.route = h.route; state.form = {...defaultForm(h.route), ...h.form};
    state.formCache[h.route] = state.form;
    state.view='calc';
    document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view==='calc'));
    renderTabs(); renderContent(); syncTelegramUI();
    setTimeout(()=> showResult(h.route, state.form, {scrollTop:true}), 50);
  });
}

function renderHistory(c){
  renderTopbar();
  if(state.historyArchiveOpen) return renderArchiveList(c);
  const filter = state.historyFilter || 'all';
  const filtered = filter==='all' ? state.history : state.history.filter(h=>h.route===filter);
  historySwipeOpen = null;

  const filterHtml = `<div class="tabs segtabs fit" id="histFilterSeg" style="margin:0 0 var(--sp-4);">
    <button class="tab ${filter==='all'?'active':''}" data-f="all">Общие</button>
    ${Object.keys(CONFIG.routes).map(id=>`<button class="tab ${filter===id?'active':''}" data-f="${id}">${ROUTE_FLAG[id]||''} ${CONFIG.routes[id].label}</button>`).join('')}
  </div>`;

  // Папка «Архив» — только на вкладке «Общие» (см. renderArchiveList выше).
  const archiveFolderHtml = filter==='all' ? `<div class="histcard-wrap">
    <div class="histcard" id="archiveFolderBtn">
      <div class="l"><div class="m">📁 Архив</div><div class="d">Все расчёты, доведённые до результата · последние 50</div></div>
      <div class="r"><div style="font-size:var(--fs-lg);color:var(--muted);">›</div></div>
    </div>
  </div>` : '';

  // Свайп влево открывает "Удалить" за карточкой (как избранное на iPhone) —
  // отдельная всегда видимая кнопка удаления больше не нужна, на её месте
  // теперь "Другое направление".
  const listHtml = filtered.length ? filtered.map(h=>{
    const d = new Date(h.date);
    return `<div class="histcard-wrap">
      <div class="histcard-del" data-del="${h.id}">Удалить</div>
      <div class="histcard" data-id="${h.id}">
        <div class="l"><div class="m">${escapeHtml(h.model)}</div><div class="d">${CONFIG.routes[h.route].label} · ${d.toLocaleDateString('ru-RU')}</div></div>
        <div class="r"><div class="t">${fmt(h.total,'₽')}</div><button class="btn secondary small" data-otherroute="${h.id}" style="margin-top:var(--sp-1);padding:var(--sp-1) var(--sp-2);">Другое направление</button></div>
      </div>
    </div>`;
  }).join('') + `<button class="btn secondary" id="clearHist" style="margin-top:var(--sp-1);">${filter==='all'?'Очистить всю историю':'Очистить историю «'+CONFIG.routes[filter].label+'»'}</button>`
    : `<div class="emptystate"><div class="big">Пока пусто</div>Сохранённые расчёты появятся здесь</div>`;

  c.innerHTML = filterHtml + archiveFolderHtml + listHtml;

  const archiveFolderBtn = document.getElementById('archiveFolderBtn');
  if(archiveFolderBtn) archiveFolderBtn.onclick = ()=>{ state.historyArchiveOpen=true; renderHistory(c); };

  c.querySelectorAll('#histFilterSeg .tab').forEach(b=> b.onclick = ()=>{ state.historyFilter = b.dataset.f; renderHistory(c); });

  c.querySelectorAll('.histcard:not(#archiveFolderBtn)').forEach(el=>{
    bindHistorySwipe(el);
    el.onclick = (e)=>{
      if(e.target.closest('[data-otherroute]')) return;
      if(el._histMoved){ el._histMoved=false; return; }
      if(el._histOpen){ el.style.transition='transform .2s ease'; el.style.transform='translateX(0px)'; el._histOpen=false; historySwipeOpen=null; return; }
      const h = state.history.find(x=>x.id==el.dataset.id);
      state.route = h.route; state.form = {...defaultForm(h.route), ...h.form};
      state.formCache[h.route] = state.form;
      state.view='calc';
      document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view==='calc'));
      renderTabs(); renderContent(); syncTelegramUI();
      setTimeout(()=> showResult(h.route, state.form, {scrollTop:true}), 50);
    };
  });
  c.querySelectorAll('[data-del]').forEach(b=> b.onclick = (e)=>{
    e.stopPropagation();
    state.history = state.history.filter(x=>x.id!=b.dataset.del);
    saveHistory();
    renderHistory(c);
    toast('Удалено');
  });
  c.querySelectorAll('[data-otherroute]').forEach(b=> b.onclick = (e)=>{
    e.stopPropagation();
    const h = state.history.find(x=>x.id==b.dataset.otherroute);
    if(h) openOtherRoutePicker(h);
  });
  const cl = document.getElementById('clearHist');
  if(cl) cl.onclick = ()=> openClearHistoryConfirm(filter, c);
}

function renderSettingsView(c){
  const section = state.settingsSection;
  renderTopbar();

  if(!section){
    const items = SETTINGS_SECTIONS.filter(s=>
      (!s.ownerOnly || (ACCESS && ACCESS.isOwner)) &&
      (!s.dealsOnly || (ACCESS && ACCESS.dealsLevel && ACCESS.dealsLevel !== 'none'))
    );
    c.innerHTML = ratesPreviewCardHtml() +
      `<div class="settings-menu">` +
      items.map(s=>`<div class="settings-row" data-s="${s.id}"><div class="lbl">${s.label}</div><div class="arrow">›</div></div>`).join('') +
      `</div>
      <button class="btn secondary" id="resetCfgBtn">Сбросить настройки к значениям по умолчанию</button>`;
    document.getElementById('ratesPreviewCard').onclick = openRatesSheet;
    c.querySelectorAll('.settings-row').forEach(el=> el.onclick = ()=>{ state.settingsSection = el.dataset.s; renderSettingsView(c); });
    document.getElementById('resetCfgBtn').onclick = openResetConfirm;
    return;
  }

  const back = `<button class="btn secondary small mb-4" id="settingsBack">← Назад</button>`;
  let body = '';

  if(section==='theme'){
    body = themeSettingsCard();
  } else if(section==='account'){
    body = accountSettingsCard();
  } else if(section==='admin' && ACCESS && ACCESS.isOwner){
    // Переход на /diag в том же окне: внутри Mini App у страницы есть
    // initData, вне Telegram — та же сессия в localStorage (как у /deals);
    // без того и другого её серверные проверки отвечают 401.
    body = `<div class="card" id="adminCard"><h2>Доступ к приложению</h2><div class="u-hint">Загрузка…</div></div>
      <button class="btn secondary small" type="button" onclick="location.href='/diag'">Диагностика</button>`;
  } else if(section==='routes'){
    body = `<div class="card">
      <h2>Маршруты — комиссии по умолчанию</h2>
      ${Object.keys(CONFIG.routes).map(id=>routeSettingsBlock(id)).join('<div style="height:14px"></div>')}
    </div>`;
  } else if(section==='customs'){
    body = `<div class="card">
      <h2>Расчёт TKS</h2>
      <p style="font-size:var(--fs-sm);color:var(--muted);margin:0 0 var(--sp-3);">На вкладке «Расчёт» таможенные платежи считаются автоматически на сервере (<code>api/customs.js</code>) через официальный API TKS.RU «Расчёт авто» (по лицензионному ключу) — сбор за оформление, пошлина и утилизационный сбор по Решению ЕЭК №107 и Постановлению №1291. Форму на tks.ru/auto/calc использовать напрямую нельзя, она защищена антибот-капчей, поэтому это отдельный API. Если TKS вдруг недоступен, автоматически подключается резервный источник alta.ru/auto-vat/ (тот же официальный расчёт, независимо проверен и даёт идентичные цифры). Значение всегда можно поправить вручную тумблером «Указать вручную» в карточке «Таможенные платежи».</p>
      ${CONFIG.customsCalculators.map(x=>`<a class="linkbtn" href="javascript:void(0)" onclick="openExternal('${x.url}')">${x.label} ↗</a>`).join('')}
    </div>`;
  } else if(section==='delivery'){
    body = `<div class="card">
      <h2>Таблица доставки по РФ (₽)</h2>
      <p style="font-size:var(--fs-sm);color:var(--muted);margin:0 0 var(--sp-3);">Отправка из: ${CONFIG.delivery.originLabel}. Можно отредактировать любые значения или добавить город.</p>
      ${deliveryTable()}
      <button class="btn secondary small mt-3" id="addCityBtn">+ Добавить город</button>
    </div>`;
  } else if(section==='dealsExtra'){
    body = `<div class="card" id="dealsExtraCard"><h2>Сделки — дополнительно</h2><div class="u-hint">Загрузка…</div></div>`;
  }

  c.innerHTML = back + body;
  document.getElementById('settingsBack').onclick = ()=>{ state.settingsSection = null; renderSettingsView(c); };

  if(section==='theme') bindThemeSettings(c);
  if(section==='account'){ const lo = document.getElementById('logoutBtn'); if(lo) lo.onclick = logout; }
  if(section==='admin' && ACCESS && ACCESS.isOwner) loadAdminCard();
  if(section==='dealsExtra') loadDealsExtraCard();
  if(section==='routes') bindRouteSettings();

    bindDeliveryTable();
    document.getElementById('addCityBtn').onclick = ()=>{
      CONFIG.delivery.cities.push({name:'Новый город', prices:[0,0,0,0]});
      saveConfig(); renderSettingsView(c);
    };

}

// Тема оформления (ТЗ 09). Выбор применяется сразу, без «Применить»; пока
// включено «Как на телефоне», строки приглушены, а галочка стоит у темы,
// которую сейчас выбрал телефон. Сброс настроек (openResetConfirm) тему не
// трогает — она живёт не в CONFIG, а в записи пользователя (ТЗ 13).
function themeSettingsCard(){
  const auto = BkTheme.mode() === 'auto';
  const cur = BkTheme.effective();
  const row = (id, label)=> `<div class="settings-row" data-theme-pick="${id}"><div class="lbl">${label}</div><div class="check">${cur===id ? '✓' : ''}</div></div>`;
  return `<div class="card">
    <h2>Тема оформления</h2>
    <div class="toggle-row theme-auto">
      <div><div class="t">Как на телефоне</div><div class="h">светлая или тёмная — как в системе телефона</div></div>
      <div class="switch ${auto ? 'on' : ''}" id="themeAutoToggle"><div class="knob"></div></div>
    </div>
    <div class="settings-menu theme-list${auto ? ' auto' : ''}">${row('dark', 'Тёмная')}${row('light', 'Светлая')}</div>
  </div>`;
}
// Раздел «Аккаунт» (ТЗ 15): имя, способ входа, «Выйти» вне Telegram.
function accountSettingsCard(){
  const name = (ACCESS && ACCESS.name) || 'без имени';
  const how = inTelegram() ? 'Telegram Mini App' : 'через сайт';
  return `<div class="card">
    <h2>Аккаунт</h2>

function saveThemeChoice(){
  BkTheme.save(BkTheme.mode()).catch(()=> toast('Не удалось сохранить тему на сервере', 2600));
}
function bindThemeSettings(c){
  // Выключение «как на телефоне» оставляет ту тему, что сейчас на экране, —
  // иначе экран перекрасился бы от самого нажатия на тумблер.
  document.getElementById('themeAutoToggle').onclick = ()=>{
    BkTheme.setMode(BkTheme.mode() === 'auto' ? BkTheme.effective() : 'auto');
    saveThemeChoice();
    tgHaptic('selection');
    renderSettingsView(c);
  };
  c.querySelectorAll('[data-theme-pick]').forEach(el=> el.onclick = ()=>{
    BkTheme.setMode(el.dataset.themePick);
    saveThemeChoice();

    renderSettingsView(c);
  });
}

BkTheme.onChange = ()=>{

function openResetConfirm(){
  openSheet(`
    <h3>Сбросить все настройки?</h3>
    <p class="u-note">Комиссии по маршрутам, таблица доставки и все источники курсов вернутся к значениям по умолчанию. Отменить это будет нельзя.</p>

    <button class="btn secondary" id="resetCancelBtn">Отмена</button>
  `);
  document.getElementById('resetConfirmBtn').onclick = ()=>{

async function fetchAdminUsers(){
  const res = await fetch('/api/admin', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...authFields(), action:'list'})});
  return res.json();
}
async function adminAction(action, targetId){
  const res = await fetch('/api/admin', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...authFields(), action, targetId})});
  return res.json();
}
const DEALS_LEVEL_LABELS = {
  none: 'Нет доступа',
  own: 'Только свои сделки',
  read_all: 'Видит все, правит свои',
  full: 'Полный'
};
function renderAdminUsersList(users){
  if(!users.length) return `<div class="u-hint">Пока никто не заходил.</div>`;
  return users.map(u=>{
    const label = u.name || ('id '+u.id);
    const uname = u.username ? ' · @'+u.username : '';
    const statusColor = u.isOwner ? 'var(--accent)' : (u.status==='approved' ? 'var(--good)' : u.status==='pending' ? 'var(--warn)' : 'var(--danger)');
    const statusText = u.isOwner ? 'владелец' : (u.status==='approved' ? 'доступ открыт' : u.status==='pending' ? 'ожидает подтверждения' : 'доступ закрыт');
    const btn = u.isOwner ? '' : (u.status==='approved'
      ? `<button class="btn secondary small" data-revoke="${u.id}">Закрыть</button>`
      : `<button class="btn small" data-approve="${u.id}">Разрешить</button>`);
    // Уровень доступа к учёту сделок — отдельно от доступа к самому
    // приложению: человек может считать машины, но не видеть сделок.
    const levels = u.isOwner || u.status!=='approved' ? '' : `
      <div class="field" style="margin:var(--sp-2) 0 0;">
        <label>Учёт сделок</label>
        <select class="deals-level" data-uid="${u.id}">
          ${Object.keys(DEALS_LEVEL_LABELS).map(k=>`<option value="${k}" ${u.dealsLevel===k?'selected':''}>${DEALS_LEVEL_LABELS[k]}</option>`).join('')}
        </select>
      </div>`;
    return `<div class="histcard" style="cursor:default;display:block;">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);">
        <div class="l"><div class="m">${label}${uname}</div><div class="d" style="color:${statusColor};">${statusText}</div></div>
        <div class="r">${btn}</div>
      </div>
      ${levels}
    </div>`;
  }).join('');
}
async function loadAdminCard(){
  const cardEl = document.getElementById('adminCard');
  if(!cardEl) return;
  try{
    const {users, error} = await fetchAdminUsers();
    if(error){ cardEl.innerHTML = `<h2>Доступ к приложению</h2><div class="notice warn">${error}</div>`; return; }
    cardEl.innerHTML = `<h2>Доступ к приложению</h2>` + renderAdminUsersList(users||[]);
    cardEl.querySelectorAll('[data-approve]').forEach(b=> b.onclick = async ()=>{ b.disabled=true; await adminAction('approve', b.dataset.approve); toast('Доступ открыт'); loadAdminCard(); });
    cardEl.querySelectorAll('[data-revoke]').forEach(b=> b.onclick = async ()=>{ b.disabled=true; await adminAction('revoke', b.dataset.revoke); toast('Доступ закрыт'); loadAdminCard(); });
    cardEl.querySelectorAll('.deals-level').forEach(sel=> sel.onchange = async ()=>{
      sel.disabled = true;
      const res = await fetch('/api/admin', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({...authFields(), action:'setDealsLevel', targetId:sel.dataset.uid, level:sel.value})});
      const data = await res.json();
      sel.disabled = false;
      toast(data.error ? ('Не вышло: '+data.error) : 'Уровень доступа сохранён');
    });
  }catch(e){
    cardEl.innerHTML = `<h2>Доступ к приложению</h2><div class="notice warn">Не удалось загрузить: ${e.message}</div>`;
  }
}

/* ---------------------------------------------------------------------
   9b. "Сделки — дополнительно" — архив/выгрузка/чистка дилеров, прямо
   отсюда, без ухода на /deals (см. правку владельца — эти действия должны
   вести себя как обычный подраздел настроек). Ходит в /api/deals
   напрямую; шаблон этапов (STAGE_TEMPLATES) живёт только в deals.html, так
   что "текущий этап" показываем сырым ключом, а не человекочитаемой
   меткой — дублировать шаблон сюда означало бы рассинхронизацию при любой
   правке этапов там (как уже было один раз в этом же чате).
--------------------------------------------------------------------- */
let DEALS_EXTRA = null;
async function fetchDealsApi(action, payload){
  const res = await fetch('/api/deals', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({...authFields(), action}, payload||{}))
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}
async function loadDealsExtraCard(){
  const cardEl = document.getElementById('dealsExtraCard');
  if(!cardEl) return;
  try{
    const data = await fetchDealsApi('bootstrap');
    DEALS_EXTRA = data;
    const archivedCount = (data.deals||[]).filter(d=>d.archived).length;
    const dealersCount = (data.parties||[]).filter(p=>p.kind==='dealer').length;
    cardEl.innerHTML = `
      <h2>Сделки — дополнительно</h2>
      <button class="btn secondary small mb-2" id="deArchive">Архив сделок (${archivedCount})</button>
      ${data.me && data.me.level==='full' ? `<button class="btn secondary small mb-2" id="deExport">Выгрузить сделки и контрагентов</button>` : ''}
      ${data.me && data.me.isOwner ? `<button class="btn secondary small" id="deWipeDealers" style="color:var(--danger);">Удалить всех дилеров (${dealersCount})</button>` : ''}
    `;
    document.getElementById('deArchive').onclick = openDealsArchiveSheet;

function openDealsArchiveSheet(){

function csvCellIdx(v){ const s = String(v==null?'':v).replace(/"/g,'""'); return '"'+s+'"'; }
function idleDaysIdx(ts){ return ts ? Math.floor((Date.now()-ts)/86400000) : 0; }
function dealsCsvIdx(deals){
  const DEAL_TYPE_LABELS = {import:'Импорт', paperwork:'Оформление'};
  const head = ['Номер','№ договора','Дата договора','Тип','Маршрут','Физик','Ответственный','Машина','Текущий этап (код)','Дней без движения','Проблема','Архив','Заметки'];
  const rows = deals.map(d=>[
    d.num, d.dealNum||'', d.dealDate||'', DEAL_TYPE_LABELS[d.type]||d.type, CONFIG.routes[d.route]?CONFIG.routes[d.route].label:(d.route||''),
    d.partyName||'', (d.responsible&&d.responsible.name)||'', d.car||'', d.stageKey||'', idleDaysIdx(d.stageAt||d.createdAt),
    d.problem?'да':'', d.archived?'да':'', d.notes||''
  ].map(csvCellIdx).join(';'));
  return '﻿' + [head.map(csvCellIdx).join(';')].concat(rows).join('\r\n');
}
function partiesCsvIdx(parties){
  const KIND_LABELS = {person:'Физик', dealer:'Дилер'};
  const GENDER_LABELS = {m:'Мужской', f:'Женский'};
  const byId = {}; parties.forEach(p=>{ byId[p.id]=p.name; });
  const head = ['Имя','Тип','Телефон','Telegram','Через дилера','Пол','Дата рождения','ИНН','СНИЛС','Заметки'];
  const rows = parties.map(p=>[
    p.name||'', KIND_LABELS[p.kind]||p.kind, p.phone||'', p.telegramUsername||'',
    p.dealerId?(byId[p.dealerId]||''):'', GENDER_LABELS[p.gender]||'', p.birthDate||'', p.inn||'', p.snils||'', p.notes||''
  ].map(csvCellIdx).join(';'));
  return '﻿' + [head.map(csvCellIdx).join(';')].concat(rows).join('\r\n');
}
async function runDealsExport(){
  const btn = document.getElementById('deExport');
  if(btn) btn.disabled = true;
  let deals, parties;
  try{
    const data = await fetchDealsApi('export');
    deals = data.deals||[]; parties = data.parties||[];
  }catch(e){ toast('Не удалось выгрузить: '+e.message); if(btn) btn.disabled=false; return; }
  const stamp = new Date().toISOString().slice(0,10);
  const files = [
    new File([JSON.stringify({deals,parties}, null, 2)], 'deals-'+stamp+'.json', {type:'application/json'}),
    new File([dealsCsvIdx(deals)], 'deals-'+stamp+'.csv', {type:'text/csv'}),
    new File([partiesCsvIdx(parties)], 'parties-'+stamp+'.csv', {type:'text/csv'})
  ];
  if(btn) btn.disabled = false;
  // Та же цепочка запасных вариантов, что и в deals.html (runExport) — в
  // Android-WebView Telegram нет ни Web Share API, ни рабочего скачивания.
  if(navigator.share && navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, title:'Выгрузка сделок'}); return; }
    catch(e){ if(e.name==='AbortError') return; }
  }
  let downloaded = 0;
  files.forEach(f=>{
    try{
      const url = URL.createObjectURL(f);
      const a = document.createElement('a'); a.href=url; a.download=f.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 20000);
      downloaded++;
    }catch(e){ /* ниже покажем текстом */ }
  });
  if(downloaded===files.length){ toast('Выгружено '+downloaded+' файла — проверьте «Загрузки»', 3500); return; }
  openSheet(`
    <h3>Выгрузка</h3>
    <p style="font-size:var(--fs-sm);color:var(--muted);margin:0 0 var(--sp-3);">Этот браузер не дал ни поделиться файлом, ни скачать его. Скопируйте данные отсюда.</p>
    <textarea readonly style="height:300px;font-family:'IBM Plex Mono',monospace;font-size:var(--fs-xs);width:100%;box-sizing:border-box;">${escapeHtml(JSON.stringify({deals,parties}))}</textarea>
    <button class="btn mt-3" id="deExCopy">Скопировать</button>
    <button class="btn secondary mt-2" id="deExClose">Закрыть</button>
  `);
  document.getElementById('deExClose').onclick = closeSheet;
  document.getElementById('deExCopy').onclick = ()=>{
    navigator.clipboard && navigator.clipboard.writeText(JSON.stringify({deals,parties})).then(()=>toast('Скопировано')).catch(()=>toast('Не удалось скопировать'));
  };
}
function openWipeDealersConfirm(){
  const dealers = (DEALS_EXTRA && DEALS_EXTRA.parties || []).filter(p=>p.kind==='dealer');
  openSheet(`
    <h3>Удалить всех дилеров?</h3>
    <p style="font-size:var(--fs-base);color:var(--muted);line-height:1.5;margin:0 0 var(--sp-4);">Будет удалено записей: ${dealers.length}. Сделки и физики не удаляются — у физиков просто снимется отметка «через дилера». Отменить нельзя.</p>
    <button class="btn danger mb-2" id="wdConfirm">Да, удалить всех дилеров</button>

    loadDealsExtraCard();
  };
}

function openSheet(html){
  // Вне Telegram нет BackButton — в шапке каждого листа есть ✕, чтобы
  // лист без своей кнопки «Отмена/Закрыть» (курсы, история курса) не был тупиком.
  const closeX = inTelegram() ? '' : `<button class="sheet-close" id="sheetCloseX" type="button" aria-label="Закрыть">✕</button>`;
  document.getElementById('sheetBody').innerHTML = `<div class="sheet-top"><div class="sheet-handle"></div>${closeX}</div>` + html;
  document.getElementById('sheetOverlay').classList.add('open');
  const x = document.getElementById('sheetCloseX'); if(x) x.onclick = closeSheet;
  syncTelegramUI();
}
function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('open'); syncTelegramUI(); }

// «Состояние»/«Примечания» открывают этот шит вместо однострочного поля —
// распознавание аукционного листа кладёт туда длинный текст, который в
// однострочном инпуте не прочитать (см. ЗАДАНИЕ.md Блок 5).
function openTextFieldSheet(f, key, label, onDone){
  openSheet(`
    <h3>${label}</h3>
    <textarea id="sheetTextarea" rows="9" style="width:100%;box-sizing:border-box;">${escapeHtml(f[key]||'')}</textarea>
    <div class="row2 mt-4">

    </div>
  `);
  document.getElementById('sheetTextarea').focus();
  document.getElementById('sheetCancelBtn').onclick = closeSheet;
  document.getElementById('sheetDoneBtn').onclick = ()=>{
    clearFieldHints(f, key);
    f[key] = document.getElementById('sheetTextarea').value;
    updateClosingGuard();
    closeSheet();
    onDone();
  };
}
document.getElementById('sheetOverlay').onclick = (e)=>{ if(e.target.id==='sheetOverlay') closeSheet(); };
// Тактильный отклик на тумблерах (ЗАДАНИЕ.md Блок 10) — один делегирующий
// обработчик на все `.switch`, а не правка каждого onclick по отдельности:
// тумблеров много и они перерисовываются вместе со своими карточками.
document.addEventListener('click', (e)=>{ if(e.target.closest && e.target.closest('.switch')) tgHaptic('impact', 'light'); }, true);

// Клавиатура сворачивается сама (см. ЗАДАНИЕ.md Блок 6): по тапу куда угодно
// кроме полей ввода, и по прокрутке больше чем на 25px — с порогом, чтобы
// случайный сдвиг на пару пикселей при обычном тапе её не убирал раньше
// времени. Глобально, не только на экране расчёта.
(function setupKeyboardDismiss(){
  function isFormField(el){ return !!el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.tagName==='SELECT'); }
  document.addEventListener('click', (e)=>{
    const active = document.activeElement;
    if(!isFormField(active)) return;
    if(isFormField(e.target) || (e.target.closest && e.target.closest('input,textarea,select'))) return;
    active.blur();
  }, true);

  // На iOS открытие самой клавиатуры сдвигает window.scrollY на десятки
  // пикселей (система сама поднимает страницу, чтобы фокусное поле не
  // перекрывалось клавиатурой) — без этой проверки та же логика принимала
  // это за "пользователь прокрутил страницу" и тут же снимала фокус, поле
  // закрывалось сразу после открытия клавиатуры (Android/десктоп не
  // трогают scrollY при показе клавиатуры, поэтому там бага не было).
  // Настоящий жест "прокрутить, чтобы убрать клавиатуру" всегда включает
  // touchmove — простой тап по полю его не порождает.
  let userDragging = false;
  document.addEventListener('touchmove', ()=>{ userDragging = true; }, {passive:true, capture:true});
  document.addEventListener('touchend', ()=>{ userDragging = false; }, {passive:true, capture:true});

  let scrollAnchor = null;
  window.addEventListener('focusin', (e)=>{ scrollAnchor = isFormField(e.target) ? window.scrollY : null; });
  window.addEventListener('scroll', ()=>{
    const active = document.activeElement;
    if(!isFormField(active)){ scrollAnchor = null; return; }
    if(scrollAnchor===null){ scrollAnchor = window.scrollY; return; }
    if(!userDragging){ scrollAnchor = window.scrollY; return; } // не жест пользователя — просто переносим опорную точку
    if(Math.abs(window.scrollY - scrollAnchor) > 25){ active.blur(); scrollAnchor = null; }
  }, {passive:true});
})();

// История курса (ЗАДАНИЕ.md Блок 8) — принимает один id или несколько (для
// Кореи блок курса на экране расчёта собран из двух валют, показываем обе
// истории одним листом, а не заставляем выбирать).
async function openRateHistory(ids){
  const labels = ids.map(id => CONFIG.rates[id].label).join(' + ');
  openSheet(`<h3>История курса</h3><div style="font-size:var(--fs-sm);color:var(--muted);margin:calc(var(--sp-1) * -1) 0 var(--sp-3);">${labels}</div><div id="rateHistoryBody">Загрузка…</div>`);
  try{
    const results = await Promise.all(ids.map(id => fetch('/api/state', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({...authFields(), action:'getRateHistory', rateId:id})
    }).then(r=>r.json()).then(data=>({id, history: data.history||[]}))));
    const body = document.getElementById('rateHistoryBody');
    const anyHistory = results.some(r => r.history.length);
    if(!anyHistory){ body.innerHTML = '<div class="emptystate"><div class="big">Пока пусто</div>История появится после следующих обновлений курса</div>'; return; }
    body.innerHTML = results.map(({id, history}) => (ids.length>1 ? `<div style="font-weight:600;font-size:var(--fs-base);margin:var(--sp-3) 0 var(--sp-1);">${CONFIG.rates[id].label}</div>` : '') +
      history.map(h => `<div class="rline"><div class="k">${new Date(h.at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}<span class="hint">${h.source==='auto'?'автообновление':(h.source||'')}</span></div><div class="v mono">${h.value}</div></div>`).join('')
    ).join('');
  }catch(e){
    const body = document.getElementById('rateHistoryBody');
    if(body) body.innerHTML = '<div class="notice">Не удалось загрузить: '+e.message+'</div>';
  }
}

function openRateEditor(id){
  const r = CONFIG.rates[id];
  openSheet(`
    <h3>${r.label}</h3>
    <a class="linkbtn" href="javascript:void(0)" id="openSrc">Открыть источник ↗</a>
    <div class="src-line">${r.sourceNote}</div>
    ${r.problemFlag ? `<div class="notice mt-3">Автообновление не применено: ${r.problemReason||'значение не прошло проверку'}${r.rejectedRaw!=null ? '. Получено: '+r.rejectedRaw+', оставлено прежнее: '+r.raw : ''}</div>` : ''}
    <a class="linkbtn mt-2" href="javascript:void(0)" id="openHistory">История курса →</a>
    ${r.autoAvailable ? `
      <div class="field mt-4"><label>Обновляется раз в сутки и при открытии приложения</label>
        <div style="font-size:var(--fs-sm); color:var(--muted);">Последнее авто-значение: ${r.autoRaw!=null?r.autoRaw:'—'}${r.autoUpdatedAt ? ' · '+new Date(r.autoUpdatedAt).toLocaleString('ru-RU') : ''}</div>
      </div>
      <div class="toggle-row field mt-3">
        <div class="u-hint">Ручная корректировка ${r.manualOverride?'(активна — авто-курс игнорируется)':''}</div>
        <div class="switch ${r.manualOverride?'on':''}" id="manualToggle"><div class="knob"></div></div>
      </div>
    ` : `<div class="notice warn mt-4">Автообновление недоступно для этого источника — вводите значение вручную после проверки по ссылке выше.</div>`}
    ${field('Значение (сырое)', `<input type="number" id="r_raw" value="${r.raw}" step="0.0001" ${r.autoAvailable && !r.manualOverride ? 'disabled' : ''}>`)}
    ${r.adjustment ? `<div style="font-size:var(--fs-sm);color:var(--muted);margin:calc(var(--sp-1) * -1) 0 var(--sp-3);">Применяется корректировка: <b style="color:var(--text)">${r.adjustmentLabel}</b> → итоговое значение <b id="r_computed" style="color:var(--text)">${(r.raw+r.adjustment).toFixed(4)}</b></div>` : ''}
    <button class="btn" id="saveRateBtn" style="margin-top:var(--sp-2);">Сохранить</button>
  `);
  document.getElementById('openSrc').onclick = ()=> openExternal(r.sourceUrl);
  document.getElementById('openHistory').onclick = ()=> openRateHistory([id]);
  const rawEl = document.getElementById('r_raw');
  const compEl = document.getElementById('r_computed');
  if(rawEl && compEl) rawEl.oninput = ()=>{ compEl.textContent = (num(rawEl.value)+r.adjustment).toFixed(4); };
  const toggleEl = document.getElementById('manualToggle');
  if(toggleEl) toggleEl.onclick = ()=>{
    if(r.manualOverride){ clearManualOverride(id); } else { r.manualOverride = true; saveConfig(); }
    openRateEditor(id);
  };
  document.getElementById('saveRateBtn').onclick = ()=>{
    if(r.autoAvailable && !r.manualOverride){ closeSheet(); refreshRatesUI(); return; }
    setRawValue(id, document.getElementById('r_raw').value);
    closeSheet(); refreshRatesUI();
    toast('Курс обновлён');
  };
}
