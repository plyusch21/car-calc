<!doctype html><html><head><meta charset="utf-8"><title>Фото-КП Cobalt C</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{ --pg:#f2f2f5; --pg-text:#15171e; --pg-muted:#5c6474; --pg-line:#dcdde3; --pg-accent:#1f56c9; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --pg:#0b1220; --pg-text:#eef3f8; --pg-muted:#8fa4b8; --pg-line:rgba(255,255,255,.1); --pg-accent:#8fc0ff; } }
:root[data-theme="dark"]{ --pg:#0b1220; --pg-text:#eef3f8; --pg-muted:#8fa4b8; --pg-line:rgba(255,255,255,.1); --pg-accent:#8fc0ff; }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--pg); color:var(--pg-text); font-family:Inter,-apple-system,system-ui,sans-serif; }
.wrap{ padding-block:28px 48px; padding-inline:20px; max-width:1700px; margin:0 auto; }
h1{ font-size:22px; font-weight:700; margin:0 0 6px; }
.lead{ color:var(--pg-muted); font-size:14px; margin:0 0 22px; max-width:900px; line-height:1.5; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(360px, 1fr)); gap:24px; }
.col{ min-width:0; }
.col-h{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
.col-h b{ font-size:15px; }
.tag{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--pg-accent); border:1px solid var(--pg-line); padding:3px 8px; border-radius:99px; }
.col-d{ color:var(--pg-muted); font-size:13px; line-height:1.5; margin:0 0 12px; min-height:78px; }
.frame{ width:100%; overflow:hidden; border-radius:10px; box-shadow:0 10px 30px -14px rgba(0,0,0,.45); }
.scaler{ transform-origin:0 0; width:1080px; }

/* ===== общая структура (.kp-*), размеры текста подняты: минимум 17 px на 1080 px ширины ===== */
.kp-card{ width:1080px; font-family:Inter,sans-serif; background:#ebebee; color:#15171e; }
.kp-header{ padding:40px 48px; display:flex; align-items:center; justify-content:space-between; gap:26px; }
.kp-header-left{ display:flex; align-items:center; gap:26px; }
.kp-logo{ height:64px; display:block; }
.kp-header-div{ width:2px; align-self:stretch; background:rgba(255,255,255,.22); }
.kp-h-title{ font-size:36px; font-weight:800; color:#eef3f8; }
.kp-h-route{ font-size:24px; font-weight:700; white-space:nowrap; color:#fff; background:rgba(255,255,255,.14); padding:10px 20px; border-radius:99px; }
.kp-model{ padding:32px 48px 0; }
.kp-model-label{ font-size:16px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#33394a; }
.kp-model-name{ font-size:38px; font-weight:800; margin-top:6px; line-height:1.2; color:#15171e; }
.kp-stats{ display:flex; gap:16px; padding:28px 48px 0; }
.kp-stat{ flex:1; border-radius:14px; padding:20px 22px; text-align:center; background:#fff; box-shadow:0 2px 4px rgba(20,22,30,.06), 0 18px 34px -18px rgba(20,22,30,.45); }
.kp-stat-l{ font-size:16px; font-weight:600; letter-spacing:.03em; color:#33394a; }
.kp-stat-v{ font-size:30px; font-weight:700; margin-top:8px; color:#15171e; font-variant-numeric:tabular-nums; }
.kp-section{ padding:32px 48px 0; }
.kp-h2{ font-size:27px; font-weight:700; margin-bottom:16px; }
.kp-card-white{ border-radius:18px; padding:6px 30px; background:#fff; box-shadow:0 2px 4px rgba(20,22,30,.06), 0 18px 34px -18px rgba(20,22,30,.45); }
.kp-row{ display:flex; align-items:flex-start; gap:20px; padding:26px 0; border-bottom:1px solid #dcdde3; position:relative; }
.kp-row-last{ border-bottom:none !important; }
.kp-badge{ flex:0 0 auto; width:46px; height:46px; border-radius:11px; font-weight:800; font-size:21px; display:flex; align-items:center; justify-content:center; background:#e7efff; color:#1f56c9; }
.kp-row-body{ flex:1; min-width:0; }
.kp-row-title{ font-weight:600; font-size:22px; }
.kp-row-sub{ font-size:18px; margin-top:4px; color:#444a57; }
.kp-row-amt{ font-weight:700; font-size:25px; white-space:nowrap; padding-top:2px; font-variant-numeric:tabular-nums; }
.kp-sub-items{ margin-top:14px; display:flex; flex-direction:column; gap:10px; }
.kp-sub-item{ display:flex; justify-content:space-between; gap:16px; font-size:18px; color:#444a57; }
.kp-sub-item b{ font-weight:600; white-space:nowrap; color:#15171e; }
.kp-total{ margin:24px 48px 0; border-radius:18px; padding:28px 30px; background:linear-gradient(135deg,#12306a,#1f56c9); box-shadow:0 18px 34px -18px rgba(31,86,201,.7); }
.kp-total-row{ display:flex; align-items:center; justify-content:space-between; gap:20px; }
.kp-total-label{ font-size:28px; font-weight:800; letter-spacing:.02em; color:#fff; }
.kp-total-note{ font-size:17px; margin-top:6px; color:rgba(255,255,255,.72); }
.kp-total-right{ text-align:right; flex:0 0 auto; }
.kp-total-amt{ font-size:46px; font-weight:800; white-space:nowrap; color:#fff; font-variant-numeric:tabular-nums; }
.kp-badge-pill{ margin-top:8px; display:inline-block; font-size:16px; font-weight:700; padding:8px 16px; border-radius:99px; white-space:nowrap; background:rgba(255,255,255,.18); color:#fff; }
.kp-insurance{ margin:20px 48px 0; border-left:5px solid #c98a1f; border-radius:14px; padding:20px 26px; display:flex; align-items:center; justify-content:space-between; gap:20px; background:#fff7e6; }
.kp-ins-title{ font-weight:700; font-size:19px; color:#8a5a12; }
.kp-ins-sub{ font-size:17px; margin-top:4px; line-height:1.5; color:#8f7a4a; }
.kp-ins-amt{ font-weight:800; font-size:24px; white-space:nowrap; }
.kp-params .kp-prow{ padding:18px 0; border-bottom:1px solid #dcdde3; display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
.kp-params .kp-prow:last-child{ border-bottom:none; }
.kp-prow-2{ display:flex; gap:40px; }
.kp-prow-2>div{ flex:1; display:flex; align-items:baseline; justify-content:space-between; gap:16px; }
.kp-plabel{ font-size:18px; font-weight:600; color:#33394a; }
.kp-pval{ font-weight:600; font-size:19px; text-align:right; }
.kp-pval-wrap{ text-align:right; font-weight:600; max-width:640px; line-height:1.5; }
.kp-footer{ margin-top:36px; font-size:17px; text-align:center; line-height:1.6; padding:26px 48px; background:#0d1626; color:#8fa4b8; }

/* ===== C — базовый ===== */
.vc .kp-header{ background:linear-gradient(135deg,#0d1626,#12306a); }

/* ===== C1 — Витрина: шапка, модель и три показателя на одном кобальтовом поле ===== */
.vc1 .kp-hero{ background:linear-gradient(160deg,#0d1626 0%,#12306a 70%,#1a4db5 100%); padding-bottom:36px; }
.vc1 .kp-header{ padding-bottom:12px; }
.vc1 .kp-model-label{ color:#8fc0ff; }
.vc1 .kp-model-name{ color:#fff; font-size:46px; }
.vc1 .kp-stat{ background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); box-shadow:none; }
.vc1 .kp-stat-l{ color:rgba(255,255,255,.7); }
.vc1 .kp-stat-v{ color:#fff; }
.vc1 .kp-total{ background:#fff; box-shadow:0 2px 4px rgba(20,22,30,.06), 0 18px 34px -18px rgba(20,22,30,.45); }
.vc1 .kp-total-label{ color:#15171e; } .vc1 .kp-total-note{ color:#444a57; }
.vc1 .kp-total-amt{ color:#1f56c9; }
.vc1 .kp-badge-pill{ background:#e7efff; color:#1a4db5; }

/* ===== C2 — Этапы: платежи как цепочка шагов, зелёная нить Байкала ===== */
.vc2 .kp-header{ background:linear-gradient(135deg,#0d1626,#12306a); border-bottom:6px solid #66b342; }
.vc2 .kp-stats{ gap:0; }
.vc2 .kp-stat{ border-radius:0; box-shadow:0 2px 4px rgba(20,22,30,.06), 0 18px 34px -18px rgba(20,22,30,.45); }
.vc2 .kp-stat:first-child{ border-radius:14px 0 0 14px; } .vc2 .kp-stat:last-child{ border-radius:0 14px 14px 0; }
.vc2 .kp-stat + .kp-stat{ border-left:1px solid #dcdde3; }
.vc2 .kp-row{ border-bottom:none; }
.vc2 .kp-badge{ border-radius:50%; background:#fff; border:3px solid #1f56c9; color:#1f56c9; }
.vc2 .kp-row:not(.kp-row-last)::before{ content:''; position:absolute; left:22px; top:72px; bottom:-26px; width:2px; background:#c9d6f5; }
.vc2 .kp-total{ background:#fff; border-left:10px solid #1f56c9; border-radius:14px; box-shadow:0 2px 4px rgba(20,22,30,.06), 0 18px 34px -18px rgba(20,22,30,.45); }
.vc2 .kp-total-label{ color:#15171e; } .vc2 .kp-total-note{ color:#444a57; }
.vc2 .kp-total-amt{ color:#1f56c9; }
.vc2 .kp-badge-pill{ background:#e8f4e0; color:#2f6e18; }
.vc2 .kp-footer{ background:transparent; color:#444a57; border-top:1px solid #dcdde3; margin:36px 48px 0; padding:22px 0 30px; }
</style>
<div class="wrap">
  <h1>Фото-КП: вариант C и два развития</h1>
  <p class="lead">Основа — C (утверждён). Во всех трёх подняты размеры мелкого текста (минимум 17–18 px на 1080 px ширины вместо 14–16), чтобы после сжатия в WhatsApp/Telegram подписи оставались читаемыми. Структура, порядок блоков и тексты — как сейчас. Цифры условные.</p>

</div>
