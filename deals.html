<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Оформление намеренно повторяет калькулятор — это один продукт, человек
   переходит сюда с главного экрана и не должен чувствовать смену приложения.
   Переменные и базовые классы скопированы из index.html: страницы
   самостоятельные, сборщика в проекте нет и заводить его ради этого не стоит. */
:root{
  --bg:#080d12; --panel:#0f1720; --panel-2:#141f2a; --border:#213040;
  --text:#e6edf1; --muted:#75919e; --accent:#2f7dd1; --accent-soft:#2f7dd122;
  --teal:#37b07c; --teal-soft:#37b07c22; --danger:#d1573f; --danger-soft:#d1573f22;
  --warn:#d9b25f; --warn-soft:#d9b25f22; --radius:14px;
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tg-top-pad: 0px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{ background:var(--bg); color:var(--text); font-family:'Inter',system-ui,sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
.app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:calc(64px + var(--safe-bottom)); }
.mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.topbar{ padding:calc(14px + var(--safe-top) + var(--tg-top-pad)) 16px 10px; position:sticky; top:0; z-index:20; background:linear-gradient(180deg, var(--bg) 72%, transparent); }
.topbar h1{ font-family:'Fraunces',serif; font-weight:600; font-size:21px; margin:0 0 2px; }
.topbar .sub{color:var(--muted); font-size:12.5px;}
.content{ padding:0 16px 20px; flex:1; }

.tabs{ display:flex; gap:6px; padding:6px 0 14px; overflow-x:auto; scrollbar-width:none; }
.tab{ background:var(--panel); border:1px solid var(--border); color:var(--muted); border-radius:99px; padding:8px 14px; font-size:13px; white-space:nowrap; cursor:pointer; font-family:inherit; }
.tab.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--text); }

.card{ background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
.card h2{ font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 12px; font-weight:600; }

.btn{ width:100%; background:var(--accent); color:#fff; border:none; border-radius:11px; padding:13px; font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit; }
.btn.secondary{ background:transparent; border:1px solid var(--border); color:var(--text); }
.btn.small{ padding:9px; font-size:12.5px; }
.btn.danger{ background:var(--danger); }
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

.field{margin-bottom:12px;}
.field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:5px; }
input[type=text], input[type=tel], select, textarea{
  width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  border-radius:9px; padding:10px 11px; font-size:14.5px; font-family:inherit; outline:none;
}
textarea{resize:vertical; min-height:64px;}
input:focus, select:focus, textarea:focus{border-color:var(--accent);}

.dealrow{ position:relative; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 13px; margin-bottom:0; cursor:pointer; touch-action:pan-y; will-change:transform; }
.dealrow .top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.dealrow .num{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--accent); }
.dealrow .idle{ font-size:11.5px; color:var(--muted); white-space:nowrap; }
.dealrow .idle.warn{ color:var(--warn); }
.dealrow .idle.bad{ color:var(--danger); }
.dealrow .idle.good{ color:var(--teal); }
.dealrow .name{ font-weight:600; font-size:14.5px; margin-top:4px; }
.dealrow .car{ color:var(--muted); font-size:12.5px; margin-top:2px; }
.dealrow .foot{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:8px; }
.dealrow-wrap{ position:relative; border-radius:12px; overflow:hidden; margin-bottom:10px; }
.dealrow-wrap .dealrow{ margin-bottom:0; }
.dealrow-del{ position:absolute; top:0; right:0; bottom:0; width:88px; background:var(--danger); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; cursor:pointer; }
.folderrow{ display:flex; justify-content:space-between; align-items:center; }
.folderrow .arrow{ color:var(--muted); font-size:18px; }
.chip{ display:inline-block; font-size:11.5px; padding:3px 9px; border-radius:99px; background:var(--panel-2); border:1px solid var(--border); color:var(--muted); }
.chip.stage{ background:var(--teal-soft); border-color:var(--teal); color:var(--teal); }
.chip.problem{ background:var(--danger-soft); border-color:var(--danger); color:var(--danger); }
.chip.arch{ background:var(--warn-soft); border-color:var(--warn); color:var(--warn); }

.stage{ display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); }
.stage:last-child{border-bottom:none;}
.stage .mark{ flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:1px solid var(--border); background:var(--panel-2); color:var(--muted); font-size:13px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.stage .mark.done{ background:var(--teal-soft); border-color:var(--teal); color:var(--teal); }
.stage .mark.skip{ background:var(--warn-soft); border-color:var(--warn); color:var(--warn); }
.stage .body{flex:1; min-width:0;}
.stage .lbl{ font-size:14px; font-weight:500; }
.stage .meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }
.stage .note{ font-size:12.5px; color:var(--muted); margin-top:4px; white-space:pre-wrap; }

.kv{ display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13.5px; }
.kv:last-child{border-bottom:none;}
.kv .k{ color:var(--muted); flex:0 0 auto; }
.kv .v{ text-align:right; word-break:break-word; }

.logitem{ font-size:12.5px; padding:7px 0; border-bottom:1px solid var(--border); }
.logitem:last-child{border-bottom:none;}
.logitem .who{ color:var(--muted); }

.emptystate{ text-align:center; color:var(--muted); font-size:13px; padding:40px 20px; line-height:1.6; }
.emptystate .big{ font-family:'Fraunces',serif; font-size:16px; color:var(--text); margin-bottom:6px; }
.notice{ background:var(--danger-soft); border:1px solid var(--danger); color:var(--danger); border-radius:9px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; line-height:1.45; }
.notice.warn{ background:var(--warn-soft); border-color:var(--warn); color:var(--warn); }

.sheet-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; justify-content:center; z-index:50; }
.sheet-overlay.open{display:flex;}
.sheet{ background:var(--bg); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; border:1px solid var(--border); padding:14px 16px calc(24px + var(--safe-bottom)); }
.sheet h3{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:6px 0 12px; }
.toast{ position:fixed; bottom:84px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:9px; font-size:13px; z-index:60; opacity:0; pointer-events:none; transition:opacity .2s; max-width:88%; text-align:center; }
.toast.show{opacity:1;}

/* Нижнее меню — один в один как в калькуляторе: человек переходит между
   страницами и не должен замечать, что это разные документы. */
.bottomnav{ position:fixed; bottom:0; left:0; right:0; z-index:30; background:rgba(8,13,18,0.92); backdrop-filter:blur(10px); border-top:1px solid var(--border); padding-bottom:var(--safe-bottom); }
.bottomnav .inner{ max-width:480px; margin:0 auto; display:flex; }
.navbtn{ flex:1; background:none; border:none; color:var(--muted); padding:11px 4px 9px; font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; font-family:'Inter',sans-serif; }
.navbtn.active{color:var(--accent);}
.navicon{width:20px; height:20px; display:block;}
</style>

<body>

<script>
/* =====================================================================
   1. Этапы — перечень живёт здесь, в коде, и только здесь.
   Тип сделки выбирается при создании и дальше не меняется, поэтому и
   шаблон этапов у сделки один на всю её жизнь. В самой записи сделки
   лежат ТОЛЬКО отметки (состояние/дата/заметка), без названий и порядка —
   иначе перечень расползётся по сотне записей в базе и его нельзя будет
   поправить. В синхронизируемые настройки он не попадает вовсе.
===================================================================== */
const STAGE_TEMPLATES = {
  import: [
    {key:'pick',     label:'Подбор'},
    {key:'contract', label:'Договор'},
    {key:'prepay',   label:'Предоплата'},
    {key:'booking',  label:'Бронь'},
    {key:'invoice',  label:'Оплата инвойса'},
    {key:'export',   label:'Экспорт'},
    {key:'customs',  label:'Таможня'},
    {key:'lab',      label:'Лаборатория'},
    {key:'yard',     label:'Наша стоянка'},
    {key:'settle',   label:'Расчёт'},
    {key:'shipping', label:'Отправка', optional:true},
    {key:'issued',   label:'Выдан авто', final:true}
  ],
  paperwork: [
    {key:'docs',     label:'Документы получены'},
    {key:'customs',  label:'Таможня'},
    {key:'lab',      label:'Лаборатория'},
    {key:'yard',     label:'Наша стоянка'},
    {key:'settle',   label:'Расчёт'},
    {key:'shipping', label:'Отправка', optional:true},
    {key:'issued',   label:'Выдан авто', final:true}
  ]
};
const DEAL_TYPE_LABELS = { import:'Импорт', paperwork:'Оформление' };
const ROUTE_LABELS = { japan:'Япония', korea:'Корея', china:'Китай', eaeu:'ЕАЭС' };
const ROUTE_FLAGS = { japan:'🇯🇵', korea:'🇰🇷', china:'🇨🇳', eaeu:'🌐' };
const PARTY_KIND_LABELS = { person:'Физик', dealer:'Дилер' };
const LEVEL_LABELS = { none:'Нет доступа', own:'Только свои сделки', read_all:'Видит все, правит свои', full:'Полный' };

function stagesOf(type){ return STAGE_TEMPLATES[type] || STAGE_TEMPLATES.import; }

/* Статус сделки нигде не хранится и руками не ставится — он всегда
   вычисляется как последний пройденный этап. Так статус не может разойтись
   с отметками: единственный источник правды — сами отметки. */
function currentStage(deal){
  const list = stagesOf(deal.type);
  let last = null;
  list.forEach(st=>{ if(deal.stages && deal.stages[st.key] && deal.stages[st.key].state === 'done') last = st; });
  return last;
}
function isArchived(deal){
  const fin = stagesOf(deal.type).find(s=>s.final);
  return !!(fin && deal.stages && deal.stages[fin.key] && deal.stages[fin.key].state === 'done');
}
// Мягкое удаление (см. api/deals.js action 'removeDeal') — сделка в архиве,
// но НЕ потому что дошла до последнего этапа. Отдельная (красная) пометка,
// чтобы не путать с настоящим завершением сделки.
function isRemoved(deal){ return !!deal.removed; }
/* "Движение" — это отметка этапа. Заметку поправили — сделка не сдвинулась,
   поэтому счётчик простоя считаем по последней отметке, а до первой — от
   даты создания. */
function lastMovementAt(deal){
  let t = deal.createdAt || 0;
  Object.keys(deal.stages || {}).forEach(k=>{
    const at = deal.stages[k] && deal.stages[k].at;
    if(at && at > t) t = at;
  });
  return t;
}
function idleDays(ts){
  if(!ts) return 0;
  return Math.floor((Date.now() - ts) / 86400000);
}

/* =====================================================================
   2. Утилиты и состояние
===================================================================== */
const state = { view:'list', tab:'all', archive:false, dealerFolder:null, deals:[], parties:[], users:[], me:null, deal:null, log:[], canWrite:false, party:null };
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString('ru-RU') : '—';
const fmtMoney = n => (Math.round(Number(n)||0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fmtDateTime = ts => ts ? new Date(ts).toLocaleString('ru-RU', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
function toast(msg, ms){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), ms||2200); }
function openSheet(html){ document.getElementById('sheetBody').innerHTML = html; document.getElementById('sheetOverlay').classList.add('open'); }
function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('open'); }
document.getElementById('sheetOverlay').onclick = (e)=>{ if(e.target.id==='sheetOverlay') closeSheet(); };

function initData(){ return (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || ''; }

async function api(action, payload){
  const res = await fetch('/api/deals', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({ initData: initData(), action }, payload || {}))
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

function pluralDays(n){
  const a = Math.abs(n) % 100, b = n % 10;
  if(a > 10 && a < 20) return n + ' дней';
  if(b === 1) return n + ' день';
  if(b >= 2 && b <= 4) return n + ' дня';
  return n + ' дней';
}

/* =====================================================================
   3. Экран списка
   "Все"/"Оформление" — плоский список сделок (каждая всегда на физике;
   если у физика есть дилер, у строки просто метка "через <дилер>").
   "Дилеры" — не фильтр этого же списка, а отдельный режим: папки дилеров,
   у которых есть сделки в работе; провалившись внутрь — тот же список
   строк сделок, но только физиков этого дилера.
   "Физики" — справочник контактов (не сделок): все физики, чтобы можно
   было открыть/завести профиль и вне привязки к конкретной сделке.
===================================================================== */
let dealSwipeOpen = null;
function bindDealSwipe(card){
  const REVEAL = 88;
  card._open = false; card._moved = false;
  let tracking = false, startX = 0, startY = 0, startTranslate = 0, axis = null;
  const setX = (px)=>{ card.style.transform = `translateX(${px}px)`; };
  card.addEventListener('pointerdown', (e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    tracking = true; axis = null; card._moved = false;
    startX = e.clientX; startY = e.clientY;
    startTranslate = card._open ? -REVEAL : 0;
    card.style.transition = 'none';
  });
  card.addEventListener('pointermove', (e)=>{
    if(!tracking) return;
    const dx = e.clientX-startX, dy = e.clientY-startY;
    if(axis===null){
      if(Math.abs(dx)<6 && Math.abs(dy)<6) return;
      axis = Math.abs(dx)>Math.abs(dy) ? 'x' : 'y';
      if(axis==='y'){ tracking=false; return; }
    }
    if(axis!=='x') return;
    card._moved = true;
    setX(Math.min(0, Math.max(-REVEAL, startTranslate+dx)));
  });
  const finish = ()=>{
    if(!tracking) return;
    tracking = false;
    if(axis!=='x') return;
    card.style.transition = 'transform .2s ease';
    const m = /translateX\((-?\d+(?:\.\d+)?)/.exec(card.style.transform);
    const cur = m ? parseFloat(m[1]) : 0;
    const open = cur < -REVEAL/2;
    setX(open ? -REVEAL : 0);
    card._open = open;
    if(open){
      if(dealSwipeOpen && dealSwipeOpen!==card){ dealSwipeOpen.style.transition='transform .2s ease'; dealSwipeOpen.style.transform='translateX(0px)'; dealSwipeOpen._open=false; }
      dealSwipeOpen = card;
    } else if(dealSwipeOpen===card) dealSwipeOpen = null;
  };
  card.addEventListener('pointerup', finish);
  card.addEventListener('pointercancel', finish);
}

function openDeleteDealConfirm(id, name){
  openSheet(`
    <h3>Удалить сделку?</h3>
    <p style="font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 18px;">${esc(name||'Без названия')} — сделка не сотрётся, а уйдёт в архив с пометкой «не завершена». Отменить возврат из архива нельзя, но сама запись не теряется.</p>
    <button class="btn danger" id="delConfirm">Да, удалить</button>
    <button class="btn secondary" id="delCancel" style="margin-top:8px;">Отмена</button>
  `);
  document.getElementById('delCancel').onclick = closeSheet;
  document.getElementById('delConfirm').onclick = async ()=>{
    try{
      await api('removeDeal', {id});
      await reloadIndexes();
      closeSheet();
      renderList();
      toast('Сделка перенесена в архив');
    }catch(e){ toast('Не удалось: ' + e.message); }
  };
}

// Одна строка сделки (используется и в "Все"/"Оформление", и внутри папки
// дилера) — со свайпом-удалением слева направо, как в истории калькулятора.
function dealRowsHtml(rows, opts){
  opts = opts || {};
  if(!rows.length){
    return `<div class="emptystate"><div class="big">${opts.emptyBig||'Сделок пока нет'}</div>${opts.emptySub||''}</div>`;
  }
  return rows.map(d=>{
    const days = idleDays(d.stageAt || d.createdAt);
    const cls = d.archived ? (isRemoved(d)?'bad':'good') : (days >= 14 ? 'bad' : (days >= 7 ? 'warn' : ''));
    const idleLabel = d.archived ? (isRemoved(d) ? 'не завершена (удалена)' : 'завершена') : 'без движения ' + pluralDays(days);
    const stage = d.stageKey ? (stagesOf(d.type).find(s=>s.key===d.stageKey) || {}).label : null;
    const party = state.parties.find(p=>p.id===d.partyId);
    const dealer = (party && party.dealerId) ? state.parties.find(p=>p.id===party.dealerId) : null;
    return `<div class="dealrow-wrap">
      <div class="dealrow-del" data-del="${esc(d.id)}" data-delname="${esc(d.partyName)}">Удалить</div>
      <div class="dealrow" data-id="${esc(d.id)}">
        <div class="top">
          <span class="num">${esc(d.num)}</span>
          <span class="idle ${cls}">${idleLabel}</span>
        </div>
        <div class="name">${esc(d.partyName || 'без контрагента')}${dealer ? ` <span class="chip">через ${esc(dealer.name)}</span>` : ''}</div>
        <div class="car">${esc(d.car || 'машина не указана')}${d.route ? ' · ' + (ROUTE_FLAGS[d.route]||'') + ' ' + (ROUTE_LABELS[d.route]||'') : ''}</div>
        <div class="foot">
          <span>
            <span class="chip ${stage?'stage':''}">${esc(stage || 'этапов нет')}</span>
            ${d.problem ? '<span class="chip problem">проблема</span>' : ''}
            ${d.type==='paperwork' ? '<span class="chip">оформление</span>' : ''}
          </span>
          <span class="chip">${esc(d.responsibleName || 'без ответственного')}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}
function bindDealRows(c){
  dealSwipeOpen = null;
  c.querySelectorAll('.dealrow').forEach(el=> bindDealSwipe(el));
  c.querySelectorAll('.dealrow').forEach(el=>{
    el.onclick = ()=>{
      if(el._moved){ el._moved=false; return; }
      if(el._open){ el.style.transition='transform .2s ease'; el.style.transform='translateX(0px)'; el._open=false; dealSwipeOpen=null; return; }
      openDeal(el.dataset.id);
    };
  });
  c.querySelectorAll('[data-del]').forEach(b=> b.onclick = (e)=>{
    e.stopPropagation();
    openDeleteDealConfirm(b.dataset.del, b.dataset.delname);
  });
}

function activeDealsOf(list){ return list.filter(d=>!d.archived); }

function renderList(){
  const c = document.getElementById('content');
  document.getElementById('title').textContent = state.archive ? 'Архив сделок' : 'Сделки';

  if(state.archive){ state.dealerFolder = null; return renderArchiveList(c); }
  if(!state.tab) state.tab = 'all';
  if(state.tab === 'dealers' && state.dealerFolder) return renderDealerFolder(c);
  if(state.tab === 'dealers') return renderDealerFolders(c);
  if(state.tab === 'physiks') return renderPhysiksTab(c);
  return renderFlatDeals(c);
}
// Клик по вкладке всегда сбрасывает открытую папку дилера — иначе повторный
// заход на "Дилеры" из другой вкладки неожиданно вёл бы обратно в папку,
// которую человек уже покинул.
function selectTab(t){ state.tab = t; state.dealerFolder = null; renderList(); }

function renderFlatDeals(c){
  const rows = activeDealsOf(state.deals)
    .filter(d => state.tab === 'paperwork' ? d.type === 'paperwork' : true)
    .sort((a,b)=> (a.stageAt||a.createdAt||0) - (b.stageAt||b.createdAt||0));

  document.getElementById('subtitle').textContent = rows.length ? 'В работе: ' + rows.length : 'Пока пусто';

  const tabs = `
    <div class="tabs">
      <button class="tab ${state.tab==='all'?'active':''}" data-t="all">Все</button>
      <button class="tab ${state.tab==='dealers'?'active':''}" data-t="dealers">Дилеры</button>
      <button class="tab ${state.tab==='physiks'?'active':''}" data-t="physiks">Физики</button>
      <button class="tab ${state.tab==='paperwork'?'active':''}" data-t="paperwork">Оформление</button>
    </div>`;

  c.innerHTML = `<button class="btn" id="newDeal" style="margin-bottom:14px;">+ Новая сделка</button>` +
    tabs + dealRowsHtml(rows, {emptySub:'Создайте первую — кнопка выше.'});

  c.querySelectorAll('.tab').forEach(b=> b.onclick = ()=> selectTab(b.dataset.t));
  bindDealRows(c);
  document.getElementById('newDeal').onclick = openNewDealSheet;
}

function renderArchiveList(c){
  const rows = state.deals.filter(d=>d.archived)
    .sort((a,b)=> (b.stageAt||b.createdAt||0) - (a.stageAt||a.createdAt||0));
  document.getElementById('subtitle').textContent = rows.length ? rows.length + ' в архиве' : 'Пока пусто';
  c.innerHTML = dealRowsHtml(rows, {emptyBig:'Архив пуст', emptySub:'Сюда попадают сделки после отметки «Выдан авто» или после удаления.'}) +
    `<button class="btn secondary" id="backToWork" style="margin-top:10px;">← К сделкам в работе</button>`;
  bindDealRows(c);
  document.getElementById('backToWork').onclick = ()=>{ state.archive = false; renderList(); };
}

// Папки дилеров — только те, у кого хоть одна сделка (через их физиков) в
// работе; пустых дилеров (создан, но ещё ни одной активной сделки) тут не
// показываем — они не потеряны, просто не создают лишнюю пустую папку.
function renderDealerFolders(c){
  const dealers = state.parties.filter(p=>p.kind==='dealer').map(dl=>{
    const physikIds = new Set(state.parties.filter(p=>p.dealerId===dl.id).map(p=>p.id));
    const active = activeDealsOf(state.deals).filter(d=> physikIds.has(d.partyId));
    return { dealer: dl, count: active.length };
  }).filter(x=>x.count>0).sort((a,b)=> b.count - a.count);

  document.getElementById('subtitle').textContent = dealers.length ? dealers.length + ' в работе' : 'Пока пусто';

  const tabs = `
    <div class="tabs">
      <button class="tab" data-t="all">Все</button>
      <button class="tab active" data-t="dealers">Дилеры</button>
      <button class="tab" data-t="physiks">Физики</button>
      <button class="tab" data-t="paperwork">Оформление</button>
    </div>`;

  const list = dealers.length ? dealers.map(x=>`
    <div class="dealrow" data-dealer="${esc(x.dealer.id)}">
      <div class="folderrow">
        <div>
          <div class="name" style="margin-top:0;">${esc(x.dealer.name)}</div>
          <div class="car">${esc(x.dealer.phone||'без телефона')}${x.dealer.telegramUsername?' · @'+esc(x.dealer.telegramUsername):''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="chip">${x.count} в работе</span>
          <span class="arrow">›</span>
        </div>
      </div>
    </div>`).join('') : `<div class="emptystate"><div class="big">Пока пусто</div>Папка дилера появится здесь, как только у него будет хоть одна сделка в работе.</div>`;

  c.innerHTML = `<button class="btn" id="newDeal" style="margin-bottom:14px;">+ Новая сделка</button>` + tabs + list;
  c.querySelectorAll('.tab').forEach(b=> b.onclick = ()=> selectTab(b.dataset.t));
  c.querySelectorAll('[data-dealer]').forEach(el=> el.onclick = ()=>{ state.dealerFolder = el.dataset.dealer; renderDealerFolder(c); });
  document.getElementById('newDeal').onclick = openNewDealSheet;
}

function renderDealerFolder(c){
  const dealer = state.parties.find(p=>p.id===state.dealerFolder);
  if(!dealer){ state.dealerFolder=null; return renderDealerFolders(c); }
  const physikIds = new Set(state.parties.filter(p=>p.dealerId===dealer.id).map(p=>p.id));
  const rows = activeDealsOf(state.deals).filter(d=> physikIds.has(d.partyId))
    .sort((a,b)=> (a.stageAt||a.createdAt||0) - (b.stageAt||b.createdAt||0));
  document.getElementById('title').textContent = dealer.name;
  document.getElementById('subtitle').textContent = rows.length + ' в работе';
  c.innerHTML = `<button class="btn secondary small" id="dfBack" style="margin-bottom:12px;">← К дилерам</button>
    <div class="card">
      <h2>Дилер</h2>
      <div class="kv"><span class="k">Телефон</span><span class="v">${esc(dealer.phone||'—')}</span></div>
      ${dealer.telegramUsername?`<div class="kv"><span class="k">Telegram</span><span class="v">@${esc(dealer.telegramUsername)}</span></div>`:''}
      ${dealer.notes?`<div class="kv"><span class="k">Заметки</span><span class="v">${esc(dealer.notes)}</span></div>`:''}
      ${(!auth_isRestricted())?`<button class="btn secondary small" id="dfEdit" style="margin-top:12px;">Редактировать</button>`:''}
    </div>` +
    dealRowsHtml(rows, {emptyBig:'У этого дилера пока нет сделок в работе'});
  document.getElementById('dfBack').onclick = ()=>{ state.dealerFolder=null; renderDealerFolders(c); };
  const de = document.getElementById('dfEdit'); if(de) de.onclick = ()=> openPartySheet(dealer, ()=>{ renderDealerFolder(c); });
  bindDealRows(c);
}
// Правка контрагента разрешена только владельцу/full (см. api/deals.js) —
// маленький клиентский помощник, чтобы не звать сервер ради одной кнопки.
function auth_isRestricted(){ return !(state.me && (state.me.isOwner || state.me.level === 'full')); }

// Справочник контактов-физиков — не фильтр сделок, а список самих людей:
// сюда заходят завести/поправить профиль (паспорт, ИНН и т.п.) и вне
// привязки к какой-то конкретной сделке.
function renderPhysiksTab(c){
  const persons = state.parties.filter(p=>p.kind==='person').sort((a,b)=> a.name.localeCompare(b.name, 'ru'));
  document.getElementById('subtitle').textContent = persons.length + ' записей';
  const tabs = `
    <div class="tabs">
      <button class="tab" data-t="all">Все</button>
      <button class="tab" data-t="dealers">Дилеры</button>
      <button class="tab active" data-t="physiks">Физики</button>
      <button class="tab" data-t="paperwork">Оформление</button>
    </div>`;
  const list = persons.length ? persons.map(p=>{
    const dealer = p.dealerId ? state.parties.find(x=>x.id===p.dealerId) : null;
    return `<div class="dealrow" data-pid="${esc(p.id)}">
      <div class="name" style="margin-top:0;">${esc(p.name)}</div>
      <div class="car">${esc(p.phone||'без телефона')}${dealer?' · через '+esc(dealer.name):''}</div>
    </div>`;
  }).join('') : `<div class="emptystate"><div class="big">Пока никого</div>Физики появляются при создании сделок или их можно добавить здесь.</div>`;
  c.innerHTML = `<button class="btn" id="newDeal" style="margin-bottom:14px;">+ Новая сделка</button>` + tabs + list +
    `<button class="btn secondary small" id="newPhysik" style="margin-top:10px;">+ Новый физик</button>`;
  c.querySelectorAll('.tab').forEach(b=> b.onclick = ()=> selectTab(b.dataset.t));
  c.querySelectorAll('[data-pid]').forEach(el=> el.onclick = ()=> openParty(el.dataset.pid));
  document.getElementById('newDeal').onclick = openNewDealSheet;
  document.getElementById('newPhysik').onclick = ()=> openPartySheet({kind:'person'}, (p)=> openParty(p.id));
}

// Архив и выгрузка — раньше были кнопкой прямо на главном экране сделок и
// путались под ногами; теперь отдельное меню, открывается только из
// Настроек калькулятора (index.html → «Сделки — дополнительно» →
// /deals?menu=1, см. boot() ниже), на самой странице сделок этой кнопки нет.
function openDealsMenu(){
  openSheet(`
    <h3>Сделки — дополнительно</h3>
    <button class="btn secondary" id="mArchive" style="margin-bottom:8px;">Архив сделок</button>
    ${state.me && state.me.level === 'full' ? `<button class="btn secondary" id="mExport" style="margin-bottom:8px;">Выгрузить сделки и контрагентов</button>` : ''}
    <button class="btn secondary" id="mClose">Закрыть</button>
  `);
  document.getElementById('mClose').onclick = closeSheet;
  document.getElementById('mArchive').onclick = ()=>{ closeSheet(); state.archive = true; renderList(); };
  const mx = document.getElementById('mExport'); if(mx) mx.onclick = ()=>{ closeSheet(); runExport(); };
}

/* =====================================================================
   4. Создание сделки: физик ищется по телефону, дилер — отдельным шагом
   после (сделка всегда на физике; дилер — просто метка на нём, "под
   папка" для группировки).
===================================================================== */
function openNewDealSheet(){
  openSheet(`
    <h3>Новая сделка</h3>
    <div class="field">
      <label>Тип сделки — потом не изменить</label>
      <select id="ndType">
        <option value="import">Импорт</option>
        <option value="paperwork">Оформление</option>
      </select>
    </div>
    <div class="field">
      <label>Телефон физика (конечного покупателя)</label>
      <input type="tel" id="ndPhone" placeholder="+7 999 123-45-67" inputmode="tel">
    </div>
    <button class="btn" id="ndNext">Дальше</button>
    <button class="btn secondary" id="ndCancel" style="margin-top:8px;">Отмена</button>
  `);
  document.getElementById('ndCancel').onclick = closeSheet;
  document.getElementById('ndNext').onclick = async ()=>{
    const type = document.getElementById('ndType').value;
    const phone = document.getElementById('ndPhone').value.trim();
    if(!phone){ toast('Укажите телефон — по нему ищем физика'); return; }
    let found = null;
    try{ found = (await api('findPartyByPhone', {phone})).party; }
    catch(e){ toast('Не удалось найти: ' + e.message); return; }
    if(found && found.kind === 'dealer'){
      toast('Этот номер — дилер «' + found.name + '». Заведите физика от этого дилера в его карточке.');
      return;
    }
    if(found) askSamePerson(found, type, phone);
    else openPartySheet({ phone, kind:'person' }, (party)=> pickDealerStep(type, party));
  };
}

/* Телефон совпал. Полное совпадение подставляем молча только если и имя
   то же; если имя другое — решает человек, потому что один номер вполне
   может быть и у нового клиента (перешёл номер, семья, перепродажа). */
function askSamePerson(found, type, phone){
  openSheet(`
    <h3>Такой телефон уже есть</h3>
    <p style="font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 14px;">
      ${esc(phone)} — записан как <b>${esc(found.name)}</b>${found.city?' ('+esc(found.city)+')':''}.
      Это тот же человек или новый физик с тем же номером?
    </p>
    <button class="btn" id="sameYes">Тот же — создать сделку для него</button>
    <button class="btn secondary" id="sameNo" style="margin-top:8px;">Новый физик</button>
    <button class="btn secondary" id="sameCancel" style="margin-top:8px;">Отмена</button>
  `);
  document.getElementById('sameCancel').onclick = closeSheet;
  document.getElementById('sameYes').onclick = ()=> pickDealerStep(type, found);
  document.getElementById('sameNo').onclick = ()=> openPartySheet({ phone:'', kind:'person' }, (party)=> pickDealerStep(type, party));
}

// Шаг после физика: через какого дилера (если через какого-то вообще) идёт
// эта сделка — выбрать существующего, завести нового или пропустить.
function pickDealerStep(type, party){
  const dealers = state.parties.filter(x=>x.kind==='dealer');
  openSheet(`
    <h3>Через дилера?</h3>
    <p style="font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 14px;">Если ${esc(party.name)} пришёл через дилера — выберите его или заведите нового. Если сделка напрямую — просто пропустите.</p>
    <div class="field">
      <select id="ndDealer">
        <option value="">— нет, напрямую —</option>
        ${dealers.map(d=>`<option value="${esc(d.id)}" ${party.dealerId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
      </select>
    </div>
    <button class="btn secondary" id="ndNewDealer" style="margin-bottom:8px;">+ Новый дилер</button>
    <button class="btn" id="ndDealerNext">Дальше</button>
  `);
  document.getElementById('ndNewDealer').onclick = ()=> openPartySheet({kind:'dealer'}, (dealer)=> finishDealerStep(type, party, dealer.id));
  document.getElementById('ndDealerNext').onclick = ()=> finishDealerStep(type, party, document.getElementById('ndDealer').value);
}

async function finishDealerStep(type, party, dealerId){
  if((party.dealerId||'') !== (dealerId||'')){
    try{
      party = (await api('saveParty', {party: Object.assign({}, party, {dealerId: dealerId||''})})).party;
      await reloadIndexes();
    }catch(e){ toast('Не удалось сохранить дилера: ' + e.message); return; }
  }
  createDeal(type, party);
}

function openPartySheet(initial, onSaved){
  const p = initial || {};
  const isDealer = p.kind === 'dealer';
  const dealers = state.parties.filter(x=>x.kind==='dealer');
  openSheet(`
    <h3>${p.id ? esc(p.name||'Контрагент') : (isDealer?'Новый дилер':'Новый физик')}</h3>
    <div class="field">
      <label>Тип</label>
      <select id="pKind">
        <option value="person" ${!isDealer?'selected':''}>Физик</option>
        <option value="dealer" ${isDealer?'selected':''}>Дилер</option>
      </select>
    </div>
    <div class="field"><label>ФИО / наименование</label><input type="text" id="pName" value="${esc(p.name||'')}"></div>
    <div class="field"><label>Телефон</label><input type="tel" id="pPhone" value="${esc(p.phone||'')}" inputmode="tel"></div>

    <div id="pDealerFields" style="${isDealer?'':'display:none;'}">
      <div class="field"><label>Ник в Telegram (опционально)</label><input type="text" id="pTgUser" placeholder="без @" value="${esc(p.telegramUsername||'')}"></div>
    </div>

    <div id="pPersonFields" style="${isDealer?'display:none;':''}">
      <div class="row2">
        <div class="field"><label>Канал связи</label>
          <select id="pChannel">
            ${['','Telegram','WhatsApp','MAX','Звонок','Email'].map(x=>`<option value="${esc(x)}" ${p.channel===x?'selected':''}>${esc(x||'не указан')}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Город</label><input type="text" id="pCity" value="${esc(p.city||'')}"></div>
      </div>
      <div class="field">
        <label>Привёл дилер</label>
        <select id="pDealer">
          <option value="">— нет —</option>
          ${dealers.map(d=>`<option value="${esc(d.id)}" ${p.dealerId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
        </select>
      </div>
      <div id="passportToggle" style="cursor:pointer;color:var(--accent);font-size:13px;margin:4px 0 10px;">Паспортные данные (опционально) ▾</div>
      <div id="passportFields" style="display:none;">
        <div class="row2">
          <div class="field"><label>Дата рождения</label><input type="text" id="pBirth" placeholder="ДД.ММ.ГГГГ" value="${esc(p.birthDate||'')}"></div>
          <div class="field"><label>Паспорт (серия и номер)</label><input type="text" id="pPassNum" value="${esc(p.passportNumber||'')}"></div>
        </div>
        <div class="field"><label>Кем и когда выдан</label><input type="text" id="pPassBy" value="${esc(p.passportIssuedBy||'')}"></div>
        <div class="field"><label>Адрес регистрации (прописка)</label><textarea id="pReg">${esc(p.registrationAddress||'')}</textarea></div>
        <div class="row2">
          <div class="field"><label>ИНН</label><input type="text" id="pInn" inputmode="numeric" value="${esc(p.inn||'')}"></div>
          <div class="field"><label>СНИЛС</label><input type="text" id="pSnils" inputmode="numeric" value="${esc(p.snils||'')}"></div>
        </div>
      </div>
    </div>

    <div class="field"><label>Заметки</label><textarea id="pNotes">${esc(p.notes||'')}</textarea></div>
    <button class="btn" id="pSave">Сохранить</button>
    <button class="btn secondary" id="pCancel" style="margin-top:8px;">Отмена</button>
  `);
  const kindSel = document.getElementById('pKind');
  kindSel.onchange = ()=>{
    const dealerNow = kindSel.value === 'dealer';
    document.getElementById('pDealerFields').style.display = dealerNow ? '' : 'none';
    document.getElementById('pPersonFields').style.display = dealerNow ? 'none' : '';
  };
  const passToggle = document.getElementById('passportToggle');
  if(passToggle) passToggle.onclick = ()=>{
    const box = document.getElementById('passportFields');
    const open = box.style.display !== 'none';
    box.style.display = open ? 'none' : '';
    passToggle.textContent = 'Паспортные данные (опционально) ' + (open?'▾':'▴');
  };
  document.getElementById('pCancel').onclick = closeSheet;
  document.getElementById('pSave').onclick = async ()=>{
    const kind = kindSel.value;
    const party = { id: p.id || '', kind, name: document.getElementById('pName').value.trim(), phone: document.getElementById('pPhone').value.trim(), notes: document.getElementById('pNotes').value.trim() };
    if(kind === 'dealer'){
      party.telegramUsername = document.getElementById('pTgUser').value.trim();
    } else {
      party.channel = document.getElementById('pChannel').value;
      party.city = document.getElementById('pCity').value.trim();
      party.dealerId = document.getElementById('pDealer').value;
      party.birthDate = document.getElementById('pBirth').value.trim();
      party.passportNumber = document.getElementById('pPassNum').value.trim();
      party.passportIssuedBy = document.getElementById('pPassBy').value.trim();
      party.registrationAddress = document.getElementById('pReg').value.trim();
      party.inn = document.getElementById('pInn').value.trim();
      party.snils = document.getElementById('pSnils').value.trim();
    }
    if(!party.name){ toast('Без имени/названия не сохранить'); return; }
    try{
      const saved = (await api('saveParty', {party})).party;
      await reloadIndexes();
      closeSheet();
      if(onSaved) onSaved(saved);
      else toast('Сохранено');
    }catch(e){ toast('Не сохранилось: ' + e.message); }
  };
}

async function createDeal(type, party){
  try{
    const deal = {
      type,
      partyId: party.id, partyName: party.name, partyKind: party.kind,
      stages: {}, stageKey:'', stageAt:0, archived:false
    };
    const saved = (await api('saveDeal', {deal})).deal;
    await reloadIndexes();
    closeSheet();
    openDeal(saved.id);
    toast('Сделка ' + saved.num + ' создана');
  }catch(e){ toast('Не создалось: ' + e.message); }
}

/* =====================================================================
   5. Карточка сделки
===================================================================== */
async function openDeal(id){
  try{
    const data = await api('getDeal', {id});
    state.deal = data.deal; state.log = data.log || []; state.canWrite = !!data.canWrite;
    state.view = 'deal';
    renderDeal();
  }catch(e){ toast(e.message); }
}

function renderDeal(){
  const d = state.deal;
  const c = document.getElementById('content');
  document.getElementById('title').textContent = d.num;
  const stage = currentStage(d);
  document.getElementById('subtitle').textContent =
    (stage ? stage.label : 'этапов ещё нет') + ' · ' + (DEAL_TYPE_LABELS[d.type] || d.type);

  const party = state.parties.find(p=>p.id===d.partyId);
  const endBuyer = state.parties.find(p=>p.id===d.endBuyerId);

  const stagesHtml = stagesOf(d.type).map(st=>{
    const mark = (d.stages && d.stages[st.key]) || {};
    const cls = mark.state === 'done' ? 'done' : (mark.state === 'skip' ? 'skip' : '');
    const glyph = mark.state === 'done' ? '✓' : (mark.state === 'skip' ? '—' : '');
    return `<div class="stage">
      <div class="mark ${cls}" data-stage="${esc(st.key)}">${glyph}</div>
      <div class="body">
        <div class="lbl">${esc(st.label)}${st.optional?' <span class="chip">необязательный</span>':''}</div>
        <div class="meta">${mark.state==='done' ? 'пройден ' + fmtDate(mark.at) : (mark.state==='skip' ? 'не требуется' : 'не пройден')}</div>
        ${mark.note ? `<div class="note">${esc(mark.note)}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  c.innerHTML = `
    <button class="btn secondary small" id="dBack" style="margin-bottom:12px;">← К списку</button>
    ${d.problem && d.problem.on ? `<div class="notice">Проблема: ${esc(d.problem.reason || 'без описания')}</div>` : ''}
    ${d.archived ? (isRemoved(d) ? `<div class="notice">Сделка удалена и находится в архиве как незавершённая.</div>` : `<div class="notice warn">Сделка завершена и находится в архиве.</div>`) : ''}

    <div class="card">
      <h2>Сделка</h2>
      <div class="kv"><span class="k">Контрагент</span><span class="v">${party ? `<a href="#" id="toParty" style="color:var(--accent);text-decoration:none;">${esc(d.partyName)}</a>` : esc(d.partyName||'—')}</span></div>
      ${d.endBuyerName ? `<div class="kv"><span class="k">Конечный покупатель</span><span class="v">${esc(d.endBuyerName)}</span></div>` : ''}
      <div class="kv"><span class="k">Тип</span><span class="v">${esc(DEAL_TYPE_LABELS[d.type]||d.type)}</span></div>
      <div class="kv"><span class="k">Маршрут</span><span class="v">${d.route ? (ROUTE_FLAGS[d.route]||'') + ' ' + esc(ROUTE_LABELS[d.route]||d.route) : '—'}</span></div>
      <div class="kv"><span class="k">Что ищем</span><span class="v">${esc(d.car||'—')}${d.year?' · '+esc(d.year):''}</span></div>
      <div class="kv"><span class="k">Бюджет</span><span class="v">${esc(d.budget||'—')}</span></div>
      <div class="kv"><span class="k">Город доставки</span><span class="v">${esc(d.deliveryCity||'—')}</span></div>
      <div class="kv"><span class="k">Ответственный</span><span class="v">${esc((d.responsible&&d.responsible.name)||'не назначен')}</span></div>
      <div class="kv"><span class="k">Создана</span><span class="v">${fmtDate(d.createdAt)}</span></div>
      ${d.dealNum ? `<div class="kv"><span class="k">№ договора</span><span class="v">${esc(d.dealNum)}</span></div>` : ''}
      ${d.dealDate ? `<div class="kv"><span class="k">Дата договора</span><span class="v">${esc(d.dealDate)}</span></div>` : ''}
      ${d.wishes ? `<div class="kv"><span class="k">Пожелания</span><span class="v">${esc(d.wishes)}</span></div>` : ''}
      ${d.notes ? `<div class="kv"><span class="k">Заметки</span><span class="v">${esc(d.notes)}</span></div>` : ''}
      ${state.canWrite ? `<button class="btn secondary small" id="dEdit" style="margin-top:12px;">Редактировать</button>` : ''}
    </div>

    <div class="card">
      <h2>Этапы</h2>
      ${stagesHtml}
      ${state.canWrite ? `<div style="font-size:11.5px;color:var(--muted);margin-top:10px;">Нажмите на кружок, чтобы отметить этап.</div>` : ''}
    </div>

    <div class="card">
      <h2>Расчёты</h2>
      ${(d.calcs||[]).length ? (d.calcs||[]).map((x,i)=>`
        <div class="kv">
          <span class="k">${esc(x.model||'без названия')}${x.route?' · '+(ROUTE_FLAGS[x.route]||''):''}<br><span style="font-size:11.5px;">${fmtDate(x.at)}</span></span>
          <span class="v">${fmtMoney(x.total)} ₽${state.canWrite?` <button class="btn secondary small" data-unlink="${i}" style="width:auto;padding:4px 9px;margin-left:6px;">убрать</button>`:''}</span>
        </div>`).join('') : '<div style="font-size:12.5px;color:var(--muted);">Расчёты не привязаны.</div>'}
      ${state.canWrite ? `<button class="btn secondary small" id="dLinkCalc" style="margin-top:12px;">Привязать расчёт из истории</button>` : ''}
    </div>

    ${state.canWrite ? `<div class="card">
      <h2>Отметки</h2>
      <button class="btn secondary small" id="dProblem">${d.problem && d.problem.on ? 'Снять отметку проблемы' : 'Отметить проблему / паузу'}</button>
    </div>` : ''}

    <div class="card">
      <h2>История изменений</h2>
      ${state.log.length ? state.log.slice().reverse().map(l=>`
        <div class="logitem"><div>${esc(l.text)}</div><div class="who">${esc(l.name)} · ${fmtDateTime(l.at)}</div></div>
      `).join('') : '<div style="font-size:12.5px;color:var(--muted);">Пока пусто.</div>'}
    </div>
  `;

  document.getElementById('dBack').onclick = ()=>{ state.view='list'; renderList(); };
  const tp = document.getElementById('toParty');
  if(tp) tp.onclick = (e)=>{ e.preventDefault(); openParty(d.partyId); };
  const ed = document.getElementById('dEdit'); if(ed) ed.onclick = openDealEditSheet;
  const pb = document.getElementById('dProblem'); if(pb) pb.onclick = openProblemSheet;
  const lc = document.getElementById('dLinkCalc'); if(lc) lc.onclick = openCalcPicker;
  c.querySelectorAll('[data-unlink]').forEach(b=> b.onclick = ()=>{
    const calcs = (state.deal.calcs||[]).slice();
    calcs.splice(Number(b.dataset.unlink), 1);
    saveDeal(Object.assign({}, state.deal, { calcs }));
  });
  if(state.canWrite){
    c.querySelectorAll('.mark').forEach(el=> el.onclick = ()=> openStageSheet(el.dataset.stage));
  }
}

/* Отметка этапа. У необязательного этапа («отправка») три состояния —
   не пройден / пройден / не требуется; у остальных два. */
function openStageSheet(key){
  const d = state.deal;
  const st = stagesOf(d.type).find(s=>s.key===key);
  const mark = (d.stages && d.stages[key]) || {};
  openSheet(`
    <h3>${esc(st.label)}</h3>
    <div class="field">
      <label>Состояние</label>
      <select id="stState">
        <option value="" ${!mark.state?'selected':''}>Не пройден</option>
        <option value="done" ${mark.state==='done'?'selected':''}>Пройден</option>
        ${st.optional?`<option value="skip" ${mark.state==='skip'?'selected':''}>Не требуется</option>`:''}
      </select>
    </div>
    <div class="field"><label>Дата</label><input type="text" id="stDate" value="${mark.at?new Date(mark.at).toISOString().slice(0,10):new Date().toISOString().slice(0,10)}" placeholder="ГГГГ-ММ-ДД"></div>
    <div class="field"><label>Заметка</label><textarea id="stNote">${esc(mark.note||'')}</textarea></div>
    ${st.final?`<div class="notice warn">Отметка «${esc(st.label)}» переводит сделку в архив.</div>`:''}
    <button class="btn" id="stSave">Сохранить</button>
    <button class="btn secondary" id="stCancel" style="margin-top:8px;">Отмена</button>
  `);
  document.getElementById('stCancel').onclick = closeSheet;
  document.getElementById('stSave').onclick = async ()=>{
    const val = document.getElementById('stState').value;
    const dateStr = document.getElementById('stDate').value.trim();
    const note = document.getElementById('stNote').value.trim();
    const stages = Object.assign({}, d.stages || {});
    if(!val){ delete stages[key]; }
    else {
      const at = dateStr ? new Date(dateStr + 'T12:00:00').getTime() : Date.now();
      stages[key] = { state: val, at: isNaN(at) ? Date.now() : at, note, label: st.label };
    }
    await saveDeal(Object.assign({}, d, { stages }));
  };
}

function openProblemSheet(){
  const d = state.deal;
  const on = !!(d.problem && d.problem.on);
  if(on){ saveDeal(Object.assign({}, d, { problem:{on:false, reason:''} })); return; }
  openSheet(`
    <h3>Проблема или пауза</h3>
    <div class="field"><label>Причина</label><textarea id="prReason" placeholder="Например: ждём документы от продавца"></textarea></div>
    <button class="btn danger" id="prSave">Отметить</button>
    <button class="btn secondary" id="prCancel" style="margin-top:8px;">Отмена</button>
  `);
  document.getElementById('prCancel').onclick = closeSheet;
  document.getElementById('prSave').onclick = ()=>{
    const reason = document.getElementById('prReason').value.trim();
    saveDeal(Object.assign({}, state.deal, { problem:{on:true, reason} }));
  };
}

function openDealEditSheet(){
  const d = state.deal;
  const canAssign = state.me && (state.me.isOwner || state.me.level === 'full');
  const persons = state.parties.filter(p=>p.kind==='person');
  openSheet(`
    <h3>Сделка ${esc(d.num)}</h3>
    <div class="field"><label>Номер сделки (технический)</label><input type="text" id="eNum" value="${esc(d.num||'')}"></div>
    <div class="row2">
      <div class="field"><label>№ договора</label><input type="text" id="eDealNum" value="${esc(d.dealNum||'')}"></div>
      <div class="field"><label>Дата договора</label><input type="text" id="eDealDate" placeholder="ДД.ММ.ГГГГ" value="${esc(d.dealDate||'')}"></div>
    </div>
    <div class="field"><label>Маршрут</label>
      <select id="eRoute">
        <option value="">— не выбран —</option>
        ${Object.keys(ROUTE_LABELS).map(r=>`<option value="${r}" ${d.route===r?'selected':''}>${ROUTE_FLAGS[r]} ${ROUTE_LABELS[r]}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Что ищем — модель</label><input type="text" id="eCar" value="${esc(d.car||'')}"></div>
    <div class="row2">
      <div class="field"><label>Год</label><input type="text" id="eYear" value="${esc(d.year||'')}"></div>
      <div class="field"><label>Бюджет</label><input type="text" id="eBudget" value="${esc(d.budget||'')}"></div>
    </div>
    <div class="field"><label>Пожелания</label><textarea id="eWishes">${esc(d.wishes||'')}</textarea></div>
    <div class="field"><label>Город доставки</label><input type="text" id="eCity" value="${esc(d.deliveryCity||'')}"></div>
    <div class="field"><label>Конечный покупатель (если отличается)</label>
      <select id="eEndBuyer">
        <option value="">— тот же контрагент —</option>
        ${persons.map(p=>`<option value="${esc(p.id)}" ${d.endBuyerId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
    </div>
    ${canAssign ? `<div class="field"><label>Ответственный</label>
      <select id="eResp">
        <option value="">— не назначен —</option>
        ${state.users.map(u=>`<option value="${esc(u.id)}" ${(d.responsible&&d.responsible.uid)===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}
        <option value="__manual__">Вписать имя вручную…</option>
      </select>
      <input type="text" id="eRespName" placeholder="Имя ответственного" style="margin-top:8px;display:none;">
    </div>` : ''}
    <div class="field"><label>Заметки</label><textarea id="eNotes">${esc(d.notes||'')}</textarea></div>
    <button class="btn" id="eSave">Сохранить</button>
    <button class="btn secondary" id="eCancel" style="margin-top:8px;">Отмена</button>
  `);
  const respSel = document.getElementById('eResp');
  if(respSel){
    const manual = document.getElementById('eRespName');
    // Ответственного можно вписать и текстом — для тех, кто в приложении не
    // работает. Такая сделка не попадёт ни в чей фильтр «только свои»:
    // привязать её не к кому, и это честнее, чем приписать кому-то чужое.
    respSel.onchange = ()=>{ manual.style.display = respSel.value === '__manual__' ? '' : 'none'; };
  }
  document.getElementById('eCancel').onclick = closeSheet;
  document.getElementById('eSave').onclick = ()=>{
    const patch = {
      num: document.getElementById('eNum').value.trim(),
      dealNum: document.getElementById('eDealNum').value.trim(),
      dealDate: document.getElementById('eDealDate').value.trim(),
      route: document.getElementById('eRoute').value,
      car: document.getElementById('eCar').value.trim(),
      year: document.getElementById('eYear').value.trim(),
      budget: document.getElementById('eBudget').value.trim(),
      wishes: document.getElementById('eWishes').value.trim(),
      deliveryCity: document.getElementById('eCity').value.trim(),
      notes: document.getElementById('eNotes').value.trim()
    };
    const eb = document.getElementById('eEndBuyer').value;
    patch.endBuyerId = eb;
    patch.endBuyerName = eb ? ((state.parties.find(p=>p.id===eb)||{}).name || '') : '';
    if(respSel){
      if(respSel.value === '__manual__'){
        patch.responsible = { uid:'', name: document.getElementById('eRespName').value.trim() };
      } else if(respSel.value){
        const u = state.users.find(x=>x.id===respSel.value);
        patch.responsible = { uid: respSel.value, name: u ? u.name : '' };
      } else {
        patch.responsible = { uid:'', name:'' };
      }
    }
    saveDeal(Object.assign({}, state.deal, patch));
  };
}

/* Сохранение всегда идёт через одну дверь: здесь же считаем производные
   поля для списка (текущий этап, дата движения, архив) — сервер их не
   вычисляет, потому что перечня этапов не знает. */
async function saveDeal(next){
  try{
    const stage = currentStage(next);
    next.stageKey = stage ? stage.key : '';
    next.stageAt = lastMovementAt(next);
    next.archived = isArchived(next) || isRemoved(next);
    const data = await api('saveDeal', {deal: next});
    state.deal = data.deal; state.log = data.log || [];
    await reloadIndexes();
    closeSheet();
    renderDeal();
    toast('Сохранено');
  }catch(e){ toast('Не сохранилось: ' + e.message); }
}

/* История расчётов лежит там же, где её ведёт калькулятор (/api/state),
   отдельного хранилища для неё здесь не заводим — это один и тот же список,
   просто читаем его при первой надобности и держим в памяти страницы. */
async function loadCalcHistory(){
  if(state.calcHistory) return state.calcHistory;
  const res = await fetch('/api/state', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ initData: initData(), action:'get' })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  state.calcHistory = Array.isArray(data.history) ? data.history : [];
  return state.calcHistory;
}

async function openCalcPicker(){
  let history;
  try{ history = await loadCalcHistory(); }
  catch(e){ toast('Не удалось загрузить историю: ' + e.message); return; }
  if(!history.length){ toast('В истории калькулятора пока пусто'); return; }

  const linked = (state.deal.calcs || []).map(c=>c.id);
  openSheet(`
    <h3>Привязать расчёт</h3>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 12px;">Из истории калькулятора. Сохраняем снимок расчёта — он останется в сделке, даже когда запись выпадет из истории.</p>
    ${history.slice(0, 60).map(h=>`
      <div class="dealrow" data-calc="${esc(h.id)}" style="${linked.indexOf(String(h.id))>=0?'opacity:.45;':''}">
        <div class="top"><span class="num">${esc(ROUTE_LABELS[h.route]||h.route||'')}</span><span class="idle">${fmtDate(new Date(h.date).getTime())}</span></div>
        <div class="name">${esc(h.model||'без названия')}</div>
        <div class="car">${fmtMoney(h.total)} ₽${linked.indexOf(String(h.id))>=0?' · уже привязан':''}</div>
      </div>`).join('')}
    <button class="btn secondary" id="calcCancel">Отмена</button>
  `);
  document.getElementById('calcCancel').onclick = closeSheet;
  document.querySelectorAll('[data-calc]').forEach(el=> el.onclick = ()=>{
    const h = history.find(x=>String(x.id) === el.dataset.calc);
    if(!h) return;
    if(linked.indexOf(String(h.id)) >= 0){ toast('Этот расчёт уже привязан'); return; }
    const calcs = (state.deal.calcs || []).concat([{
      id: String(h.id), model: h.model || '', route: h.route || '',
      total: Number(h.total) || 0, at: new Date(h.date).getTime() || Date.now()
    }]);
    saveDeal(Object.assign({}, state.deal, { calcs }));
  });
}

/* =====================================================================
   6. Профиль контакта (физик или дилер) — физики доступны через вкладку
   «Физики» или карточку сделки, дилеры — через вкладку «Дилеры».
===================================================================== */
async function openParty(id){
  if(!id) return;
  try{
    const data = await api('getParty', {id});
    state.party = data.party;
    state.view = 'party';
    const p = data.party;
    const c = document.getElementById('content');
    document.getElementById('title').textContent = p.name;
    document.getElementById('subtitle').textContent = PARTY_KIND_LABELS[p.kind] || p.kind;
    const dealer = p.dealerId ? state.parties.find(x=>x.id===p.dealerId) : null;
    const passportRows = p.kind==='person' ? [
      ['Дата рождения', p.birthDate], ['Паспорт', p.passportNumber], ['Кем и когда выдан', p.passportIssuedBy],
      ['Прописка', p.registrationAddress], ['ИНН', p.inn], ['СНИЛС', p.snils]
    ].filter(([,v])=>v) : [];
    c.innerHTML = `
      <button class="btn secondary small" id="prBack" style="margin-bottom:12px;">← Назад</button>
      <div class="card">
        <h2>${p.kind==='dealer'?'Дилер':'Физик'}</h2>
        <div class="kv"><span class="k">Телефон</span><span class="v">${esc(p.phone||'—')}</span></div>
        ${p.kind==='dealer' ? (p.telegramUsername?`<div class="kv"><span class="k">Telegram</span><span class="v">@${esc(p.telegramUsername)}</span></div>`:'') : `
        <div class="kv"><span class="k">Канал связи</span><span class="v">${esc(p.channel||'—')}</span></div>
        <div class="kv"><span class="k">Город</span><span class="v">${esc(p.city||'—')}</span></div>
        ${dealer?`<div class="kv"><span class="k">Через дилера</span><span class="v">${esc(dealer.name)}</span></div>`:''}`}
        ${p.notes?`<div class="kv"><span class="k">Заметки</span><span class="v">${esc(p.notes)}</span></div>`:''}
        <button class="btn secondary small" id="prEdit" style="margin-top:12px;">Редактировать</button>
      </div>
      ${passportRows.length ? `<div class="card">
        <h2>Паспортные данные</h2>
        ${passportRows.map(([k,v])=>`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}
      </div>` : ''}
      <div class="card">
        <h2>Сделки (${data.deals.length})</h2>
        ${data.deals.length ? data.deals.map(d=>`
          <div class="dealrow" data-id="${esc(d.id)}">
            <div class="top"><span class="num">${esc(d.num)}</span><span class="idle ${d.archived?(d.removed?'bad':'good'):''}">${d.archived?(d.removed?'не завершена':'завершена'):''}</span></div>
            <div class="car">${esc(d.car||'машина не указана')}</div>
          </div>`).join('') : '<div style="font-size:12.5px;color:var(--muted);">Сделок пока нет.</div>'}
      </div>
      ${p.kind==='dealer' ? `<div class="card">
        <h2>Физики этого дилера (${data.linked.length})</h2>
        ${data.linked.length ? data.linked.map(x=>`<div class="dealrow" data-pid="${esc(x.id)}"><div class="name">${esc(x.name)}</div><div class="car">${esc(x.phone||'')}</div></div>`).join('') : '<div style="font-size:12.5px;color:var(--muted);">Пока никого.</div>'}
        <button class="btn secondary small" id="prAddLinked" style="margin-top:10px;">+ Новый физик от этого дилера</button>
      </div>` : ''}
    `;
    document.getElementById('prBack').onclick = ()=> renderList();
    document.getElementById('prEdit').onclick = ()=> openPartySheet(p, ()=> openParty(p.id));
    // Прямой путь с карточки дилера: тип и dealerId уже заполнены, остаётся
    // только имя/телефон.
    const addLinked = document.getElementById('prAddLinked');
    if(addLinked) addLinked.onclick = ()=> openPartySheet({ kind:'person', dealerId:p.id }, ()=> openParty(p.id));
    c.querySelectorAll('[data-id]').forEach(el=> el.onclick = ()=> openDeal(el.dataset.id));
    c.querySelectorAll('[data-pid]').forEach(el=> el.onclick = ()=> openParty(el.dataset.pid));
  }catch(e){ toast(e.message); }
}

/* =====================================================================
   7. Выгрузка
   JSON — полный слепок (всё, включая этапы и лог), CSV — то же плоской
   таблицей для Excel и будущей 1С. Отдать файл в Telegram сложнее, чем
   кажется: в его WebView на Android нет ни Web Share API, ни рабочего
   скачивания (это выяснилось на живом устройстве владельца), поэтому
   пробуем по очереди все три способа и в крайнем случае показываем текст.
===================================================================== */
function csvCell(v){
  const s = String(v == null ? '' : v).replace(/"/g, '""');
  return '"' + s + '"';
}
function dealsCsv(deals){
  const head = ['Номер','№ договора','Дата договора','Тип','Маршрут','Контрагент','Конечный покупатель','Ответственный','Машина','Год','Бюджет','Город доставки','Текущий этап','Дата этапа','Дней без движения','Проблема','Причина','Архив','Удалена','Создана','Заметки'];
  const rows = deals.map(d=>{
    const stage = currentStage(d);
    const moved = lastMovementAt(d);
    return [
      d.num, d.dealNum||'', d.dealDate||'', DEAL_TYPE_LABELS[d.type]||d.type, ROUTE_LABELS[d.route]||d.route||'',
      d.partyName||'', d.endBuyerName||'', (d.responsible&&d.responsible.name)||'',
      d.car||'', d.year||'', d.budget||'', d.deliveryCity||'',
      stage?stage.label:'', fmtDate(moved), idleDays(moved),
      (d.problem&&d.problem.on)?'да':'', (d.problem&&d.problem.reason)||'',
      d.archived?'да':'', d.removed?'да':'', fmtDate(d.createdAt), d.notes||''
    ].map(csvCell).join(';');
  });
  // BOM — иначе Excel открывает кириллицу кракозябрами.
  return '﻿' + [head.map(csvCell).join(';')].concat(rows).join('\r\n');
}
function partiesCsv(parties){
  const head = ['Имя','Тип','Телефон','Telegram','Канал связи','Город','Через дилера','Дата рождения','Паспорт','Кем и когда выдан','Прописка','ИНН','СНИЛС','Заметки'];
  const byId = {};
  parties.forEach(p=>{ byId[p.id] = p.name; });
  const rows = parties.map(p=>[
    p.name||'', PARTY_KIND_LABELS[p.kind]||p.kind, p.phone||'', p.telegramUsername||'', p.channel||'', p.city||'',
    p.dealerId ? (byId[p.dealerId]||'') : '', p.birthDate||'', p.passportNumber||'', p.passportIssuedBy||'',
    p.registrationAddress||'', p.inn||'', p.snils||'', p.notes||''
  ].map(csvCell).join(';'));
  return '﻿' + [head.map(csvCell).join(';')].concat(rows).join('\r\n');
}

async function runExport(){
  let data;
  try{ data = await api('export'); }
  catch(e){ toast('Не удалось выгрузить: ' + e.message); return; }

  const stamp = new Date().toISOString().slice(0,10);
  const files = [
    new File([JSON.stringify(data, null, 2)], 'deals-' + stamp + '.json', {type:'application/json'}),
    new File([dealsCsv(data.deals)], 'deals-' + stamp + '.csv', {type:'text/csv'}),
    new File([partiesCsv(data.parties)], 'parties-' + stamp + '.csv', {type:'text/csv'})
  ];

  if(navigator.share && navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files, title:'Выгрузка сделок'}); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }

  let downloaded = 0;
  files.forEach(f=>{
    try{
      const url = URL.createObjectURL(f);
      const a = document.createElement('a');
      a.href = url; a.download = f.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=> URL.revokeObjectURL(url), 20000);
      downloaded++;
    }catch(e){ /* ниже покажем текстом */ }
  });
  if(downloaded === files.length){
    toast('Выгружено ' + downloaded + ' файла — проверьте «Загрузки»', 3500);
    return;
  }

  // Ни поделиться, ни скачать не вышло — показываем JSON, чтобы можно было
  // хотя бы скопировать вручную и не остаться ни с чем.
  openSheet(`
    <h3>Выгрузка</h3>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;">Этот браузер не дал ни поделиться файлом, ни скачать его. Скопируйте данные отсюда.</p>
    <textarea readonly style="height:300px;font-family:'IBM Plex Mono',monospace;font-size:11px;">${esc(JSON.stringify(data))}</textarea>
    <button class="btn" id="exCopy" style="margin-top:10px;">Скопировать</button>
    <button class="btn secondary" id="exClose" style="margin-top:8px;">Закрыть</button>
  `);
  document.getElementById('exClose').onclick = closeSheet;
  document.getElementById('exCopy').onclick = ()=>{
    navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(data))
      .then(()=> toast('Скопировано')).catch(()=> toast('Не удалось скопировать'));
  };
}

/* =====================================================================
   8. Загрузка и гейт
===================================================================== */
async function reloadIndexes(){
  const data = await api('bootstrap');
  state.deals = data.deals || [];
  state.parties = data.parties || [];
  state.users = data.users || [];
  state.me = data.me;
}

document.querySelectorAll('.navbtn[data-go]').forEach(b=>{
  b.onclick = ()=>{ location.href = b.dataset.go; };
});

// Меню на экранах отказа НЕ прячем: без него человек, которому раздел не
// открыт, оказался бы заперт на этой странице без пути назад в калькулятор.
function gate(html){
  document.getElementById('subtitle').textContent = '';
  document.getElementById('content').innerHTML = html;
}

async function boot(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(!tg || !tg.initData){
    gate(`<div class="emptystate"><div class="big">Откройте через Telegram</div>Раздел работает только внутри Telegram — откройте бота и запустите мини-приложение.</div>`);
    return;
  }
  try{ tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#080d12'); tg.setBackgroundColor && tg.setBackgroundColor('#080d12'); }catch(e){}
  try{
    const inset = (tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) || (tg.safeAreaInset && tg.safeAreaInset.top) || 0;
    document.documentElement.style.setProperty('--tg-top-pad', Math.max(inset, 44) + 'px');
  }catch(e){ document.documentElement.style.setProperty('--tg-top-pad', '44px'); }

  try{
    await reloadIndexes();
  }catch(e){
    gate(`<div class="emptystate"><div class="big">Нет доступа</div>${esc(e.message)}<br><button class="btn secondary" id="retry" style="margin-top:16px;">Повторить</button></div>`);
    const r = document.getElementById('retry'); if(r) r.onclick = ()=> location.reload();
    return;
  }
  renderList();
  // Пришли из Настроек калькулятора (/deals?menu=1) — сразу открываем то же
  // меню архива/выгрузки, а не заставляем искать его на этой странице.
  if(new URLSearchParams(location.search).get('menu') === '1') openDealsMenu();
}

boot();
</script>
